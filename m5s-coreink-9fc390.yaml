packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common

  # --- BOARD AND MODULES ---
  board: !include board/m5stack_coreink.yaml
  hat: !include board/extension/hat_i2c.yaml
  grove: !include board/extension/grove_i2c.yaml
  env_iii: !include board/module/hat_env_iii.yaml
  env_iv: !include board/module/unit_env_iv.yaml
  tvoc: !include board/module/unit_tvoc.yaml

  # --- FEATURE PACKAGES ---
  combined_env_sensors: !include features/combined_env_sensors.yaml

  # --- E-PAPER PAGE BINDINGS ---
  epaper_out_series: !include
    file: gui/epaper/sections/rolling_graph_remote_series.yaml
    vars:
      uid: inngang_out
      entity_id: sensor.ute_foran_temperature
      history_attribute: temp_foran_history
      value_fmt: "%.0f"
      min_span: "2.0"
  epaper_room_series: !include
    file: gui/epaper/sections/rolling_graph_remote_series.yaml
    vars:
      uid: inngang_room
      entity_id: sensor.etg1_gang_temperature
      history_attribute: temp_inngang_history
      value_fmt: "%.0f"
      min_span: "2.0"
  epaper_local_sensors: !include
    file: gui/epaper/pages/temp_single_local_sensors.yaml
    vars:
      uid: inngang_local
      sensor_id: temperature_local
      value_fmt: "%.0f"

substitutions:
  common:
    log_level: WARN
#    log_baud_rate: "115200"
  device:
    name: m5s-coreink-9fc390
    location: "Inngang"
    framework:
      type: esp-idf
  epaper_rotation: "90"
  epaper_home_page: "page_out"

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
#  use_address: 192.168.69.68
  use_address: ${device.name}.local
  manual_ip:
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.42

lvgl:
  pages:
    - !include
      file: gui/epaper/pages/temp_single.yaml
      vars:
        uid: inngang_out
        page_id: page_out
        title: "Ute"
        icon: "\U000F0F9B"
        show_graph: "true"
    - !include
      file: gui/epaper/pages/temp_single.yaml
      vars:
        uid: inngang_room
        page_id: page_room
        title: "Rom"
        show_graph: "true"
    - !include
      file: gui/epaper/pages/temp_single.yaml
      vars:
        uid: inngang_local
        page_id: page_local
        title: "Enhet"
        icon: "\U000F0510"
    - !include
      file: gui/epaper/pages/info.yaml
      vars:
        show_battery_volt: true

# Check if person is home
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.etg1_occupancy
    id: ha_presence_detected
  - id: !extend presence_detected
    lambda: 'return id(ha_presence_detected).state;'

sensor:
  - id: !extend bat_adc
    on_value:
      - then:
          - lambda: |-
              char buf[12];
              if (isnan(x)) snprintf(buf, sizeof(buf), "--V");
              else snprintf(buf, sizeof(buf), "%.2f V", x);
              lv_label_set_text(id(lbl_ep_info_bat_volt), buf);

  # Combine sensors
  - id: !extend temperature_local
    sources:
      # HAT ENV III
      - source: temperature_sht30_hat_env
      - source: temperature_qmp6988_hat_env
      # Unit ENV IV
      - source: temperature_bmp280_unit_env
      - source: temperature_sht40_unit_env

  - id: !extend humidity_local
    sources:
      # HAT ENV III
      - source: humidity_sht30_hat_env
      # Unit ENV IV
      - source: humidity_sht40_unit_env

  - id: !extend pressure_local
    sources:
      # HAT ENV III
      - source: pressure_qmp6988_hat_env
      # Unit ENV IV
      - source: pressure_bmp280_unit_env
