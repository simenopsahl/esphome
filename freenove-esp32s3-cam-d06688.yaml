packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common

  # --- BOARD AND MODULES ---
  board: !include board/freenove_esp32s3_n16r8_cam.yaml

substitutions:
  common:
    log_level: DEBUG
#    log_baud_rate: "115200"
  camera:
    resolution: 800x600
    jpeg_quality: 20
  device:
    name: freenove-esp32s3-cam-74f5d4
    location: "Storage"
    framework:
      type: esp-idf

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.96
