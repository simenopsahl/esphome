packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common

  # --- BOARD AND MODULES ---
  board: !include board/seeed_xiao_esp32s3_plus.yaml
  e1002: !include board/module/display_reterminal_e1001.yaml

substitutions:
  common:
    log_level: DEBUG
#    log_baud_rate: "115200"
  device:
    name: seeed-trmnl-e1001
    location: "Storage"
    framework:
      type: esp-idf
  display:
    home_page: page_info
    font:
      text_sm: 18
      text_md: 22
      text_lg: 26
      text_xl: 30
      text_xxl: 36
      text_hg: 44
      text_fl: 54
      icons_sm: 30
      icons_md: 38
      icons_lg: 46
      icons_xl: 56
      icons_xxl: 66

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.37
    
# Check if person is home
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.etg2_occupancy
    id: presence_detected

  # Home
  - id: !extend button_green
    on_press:
      - display.page.show: ${display.home_page}
      - script.execute: update_screen
  # Stick Press
  - id: !extend button_left
    on_press:
      - display.page.show_previous: display_eink
      - script.execute: update_screen
  # Stick Down
  - id: !extend button_right
    on_press:
      - display.page.show_next: display_eink
      - script.execute: update_screen

image:
  - platform: file
    defaults:
      type: RGB
    files:
      - id: i_selma_1
        file: gui/img/eink/spectra6/selma_1_480x800.png
      - id: i_selma_2
        file: gui/img/eink/spectra6/selma_3_480x800.png
      - id: i_selma_3
        file: gui/img/eink/spectra6/selma_3_480x800.png

