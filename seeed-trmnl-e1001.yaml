graph:
  - id: graph_nordpool
    duration: 9h
    border: false
    x_grid: 1h
    y_grid: 10.0
    width: 390
    height: 160
    traces:
      - id: trace_nordpool
        sensor: nordpool_sensor
        line_thickness: 8

