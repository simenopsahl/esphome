packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common
  <<: !include_dir_named bluetooth

  # --- BOARD AND MODULES ---
  board: !include board/seeed_xiao_esp32s3_plus.yaml
  e1001: !include board/module/display_reterminal_e1001.yaml

  # --- EPAPER DASHBOARD PACKAGES ---
  epaper_content: !include gui/epaper/pages/weather_station_sensors.yaml
  epaper_image: !include gui/epaper/pages/image_sensors.yaml

substitutions:
  common:
    log_level: DEBUG
#    log_baud_rate: "115200"
  device:
    name: seeed-trmnl-e1001-85a7d0
    location: "Storage"
    framework:
      type: esp-idf
  epaper_home_page: page_content
  epaper_image_dir: gui/img/eink

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.39

lvgl:
  pages:
    - !include gui/epaper/pages/weather_station.yaml
    - !include gui/epaper/pages/image.yaml
    - !include gui/epaper/pages/info.yaml

# Check if person is home
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.etg2_occupancy
    id: ha_presence_detected
  - id: !extend presence_detected
    lambda: 'return id(ha_presence_detected).state;'
