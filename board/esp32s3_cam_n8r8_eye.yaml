labels: [esp32s3, psram, camera]
---
# https://github.com/nulllaborg/esp32s3-cam

# Pins for this model
packages:
  pins: !include pins/esp32s3_cam_n8r8_eye.yaml
  i2c: !include extension/internal_i2c.yaml

substitutions:
  device:
    model: "NullLab S3-Cam"
    rmt_symbols_block: 48
    framework:
      type: esp-idf
  module:
    camera:
      pixel_format: JPEG
      resolution: 800x600
      jpeg_quality: 20
      max_framerate: 2fps
      idle_framerate: 0.1fps
      agc_gain_ceiling: 64x
      wb_mode: auto
  extension:
    i2c:
      internal:
        frequency: 200kHz

esp32:
# ESP32-S3 N8R8
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  watchdog_timeout: 10s
  framework: 
    type: ${device.framework.type}
    advanced:
      compiler_optimization: PERF
      enable_idf_experimental_features: true
      execute_from_psram: true
      loop_task_stack_size: 16384
      assertion_level: DISABLE
      enable_lwip_assert : false
    sdkconfig_options:
      # Caching Optimizations
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      
      # PSRAM Integrations
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      
      # TLS and Logging
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_LOG_DEFAULT_LEVEL: "0"  # prevents "ESP-IDF" Guru Meditation Error
      
      # Camera Specifics
      CONFIG_CAMERA_TASK_STACK_SIZE: "8192"

esphome:
  project:
    name: "NullLab.ESP32-S3-CAM"
    version: "1.2.0"

psram:
  mode: octal
  speed: 80MHz

wifi:
  power_save_mode: light
  use_psram: true
  enable_btm: true
  enable_rrm: true

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}
  miso_pin: ${pin.int.spi.miso}

output:
  # flash output
  - platform: ledc
    id: flash_output
    pin: ${pin.light.flash}

light:
  - platform: monochromatic # Camera Flash
    output: flash_output
    id: flash_light
    default_transition_length: 50ms
    restore_mode: RESTORE_AND_OFF
    initial_state:
      state: off
    name: "Flash"
    entity_category: config

esp32_camera:
  i2c_id: i2c_internal
  # PINS
  external_clock:
    pin: ${pin.cam.m_clk}
    frequency: 20MHz
  data_pins:
    - ${pin.cam.y2}
    - ${pin.cam.y3}
    - ${pin.cam.y4}
    - ${pin.cam.y5}
    - ${pin.cam.y6}
    - ${pin.cam.y7}
    - ${pin.cam.y8}
    - ${pin.cam.y9}
  vsync_pin: ${pin.cam.vs}
  href_pin: ${pin.cam.hs}
  pixel_clock_pin: ${pin.cam.p_clk}
  # Metadata
  id: espcam
  name: "Camera"
  # Image settings
  resolution: ${module.camera.resolution}
  pixel_format: ${module.camera.pixel_format}
  jpeg_quality: ${module.camera.jpeg_quality}
  vertical_flip: false
  horizontal_mirror: false
  max_framerate: ${module.camera.max_framerate}
  idle_framerate: ${module.camera.idle_framerate}
  frame_buffer_count: 2 # defaults to 1
  # Exposure
  aec_mode: auto
  aec2: true # defaults to false
  ae_level: 2
  agc_gain_ceiling: ${module.camera.agc_gain_ceiling}
  # White balance
  wb_mode: ${module.camera.wb_mode}

# If NOT JPEG pixel_format
#camera_encoder:
#  type: esp32_camera
#  quality: 70
#  buffer_size: 524288
#  buffer_expand_size: 2097152

status_led:
  pin: ${pin.light.led}

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    update_interval: 5s
    entity_category: diagnostic