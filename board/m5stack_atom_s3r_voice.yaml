labels: [esp32s3, psram, ES8311, I2S, microphone, speaker, i2c]
---
# https://docs.m5stack.com/en/core/Atom_EchoS3R
# https://docs.m5stack.com/en/homeassistant/voice_assistant/atom_echos3r_voice_assistant
# https://github.com/m5stack/esphome-yaml/blob/main/common/atom-echos3r-satellite-base.yaml
# Base functions for:
# M5Stack Atom Voice S3R
#

# Pins for this model
packages:
  pins: !include pins/m5stack_atom_s3r.yaml
# Limit of 2 i2c buses on ESP32-S3, one already used for es8311
# Include Grove *OR* HAT i2c in top level config
  i2c_int: !include extension/internal_i2c.yaml

substitutions:
  time_timezone: "Europe/Oslo"
  mbus_i2c_shared: "false"
  module:
    internal:
      i2c_bus: i2c_internal
  device:
    model: "M5Stack Atom S3R Voice"
    rmt_symbols_block: 48
    framework:
      type: esp-idf

esphome:
  project:
    name: "M5Stack.Atom S3R Voice"
    version: "1.0.0"

esp32:
# ESP32-S3-PICO-1-N8R8@Dual-core Xtensa LX7, up to 240MHz
# PSRAM: 8MB Octal
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
    type: ${device.framework.type}
    ## Note: Disable these configurations if you face the boot loop issue.
    sdkconfig_options:
        CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
        CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
        CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

# I2S Bus Configuration
i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin:
    number: ${pin.audio.i2s_lrclk}
    ignore_strapping_warning: true
  i2s_bclk_pin: ${pin.audio.i2s_bclk}
  i2s_mclk_pin: ${pin.audio.i2s_mclk}

audio_dac:
  - platform: es8311
    i2c_id: ${module.internal.i2c_bus}
    id: dac_es8311
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    id: i2s_mic
    i2s_din_pin: ${pin.audio.mic}
    bits_per_sample: 16bit
    sample_rate: 16000
    adc_type: external

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    id: i2s_speaker
    i2s_dout_pin: ${pin.audio.i2s_dout}
    dac_type: external
    audio_dac: dac_es8311
    use_apll: true
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

media_player:
  - platform: speaker
    name: "S3R Voice Player"
    id: s3r_voice_player
    volume_initial: 0.1
    volume_max: 0.8
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: i2s_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1

# Button
binary_sensor:
  - platform: gpio
    id: btn_front
    pin:
      number: ${pin.btn}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Button Pressed
    name: Button
    entity_category: diagnostic

switch:
  - platform: gpio
    id: speaker_enable
    pin: ${pin.audio.pwr}
    restore_mode: RESTORE_DEFAULT_ON
    name: "Speaker Enable"
    icon: "mdi:volume-high"
    entity_category: config
    disabled_by_default: true

  - platform: template
    id: mic_mute
    name: Microphone Mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
        - microphone.unmute:
    on_turn_on:
        - microphone.mute:

sensor:
  - platform: sound_level
    id: sound_level_sensor
    passive: false
    measurement_duration: 1250ms
    rms:
      name: "Noise Level"
      id: average_loudness
      filters:
        - multiply: -1
