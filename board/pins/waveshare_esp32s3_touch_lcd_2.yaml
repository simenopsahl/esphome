---
# PINs for WaveShare ESP32-S3 Touch LCD 2" w/ Camera
# Model:  esp32-s3 n16r8
# FLASH:  16MB
# PSRAM:  8MB
# https://docs.waveshare.com/ESP32-S3-Touch-LCD-2

substitutions:
  pin:
    light:
      led: nc
      rgb: nc
      bl: GPIO1
    int:
      spi:
        clk: GPIO39
        mosi: GPIO38
        miso: GPIO40
      i2c:
        sda: GPIO48
        scl: GPIO47
    disp:
      bl: GPIO1
      cs: GPIO45
      dc: GPIO42
    cam:
      sda: GPIO21
      scl: GPIO16
      y0: nc
      y1: nc
      y2: GPIO12
      y3: GPIO13
      y4: GPIO15
      y5: GPIO11
      y6: GPIO14
      y7: GPIO10
      y8: GPIO7
      y9: GPIO2
      vs: GPIO6
      hs: GPIO4
      p_clk: GPIO9
      m_clk: GPIO8
      pwr: GPIO17
    card:
      d0: nc
      d1: nc
      d2: nc
      d3: nc
      cs: GPIO41
      cmd: GPIO38
      clk: GPIO39
    
    ext:
      h1:
        p1: 3v3
        p2: gnd
        p3: u0tx
        p4: u0rx
        p5: GPIO47
        p6: GPIO48
        p7: GPIO15
        p8: GPIO13
        p9: GPIO11
        p10: GPIO12
        p11: GPIO14
        p12: GPIO9
        p13: gnd
        p14: vbat
      h2:
        p15: 5v
        p16: gnd
        p17: GPIO19
        p18: GPIO20
        p19: GPIO10
        p20: GPIO7
        p21: GPIO8
        p22: GPIO21
        p23: GPIO18
        p24: GPIO17
        p25: GPIO16
        p26: GPIO6
        p27: GPIO4
        p28: GPIO2
