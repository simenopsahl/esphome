# https://docs.m5stack.com/en/core/Tab5
# PINs for m5stack Tab5

substitutions:
  pin:
    btn:
      power: GPIOxx
      side: GPIOxx
      front: GPIOxx

    int:
      i2c:
        sda: GPIO31
        scl: GPIO32
      spi:
        clk: GPIO43
        mosi: GPIO44
        miso: GPIO39
        disp:
          cs: GPIOxx
          dc: GPIOxx
          rst: GPIOxx
          bl: GPIO22
        card:
          cs: GPIO42
          cmd: GPIO44
          d0: GPIO39
          d1: GPIO40
          d2: GPIO41
          d3: GPIO42
      c6_hosted:
        rst: GPIO15
        cmd: GPIO13
        clk: GPIO12
        d0: GPIO11
        d1: GPIO10
        d2: GPIO9
        d3: GPIO8

    touch:
      int: GPIO23
    
    light:
      disp_bl: GPIO22
    
    audio:
      i2s_lrclk: GPIO29
      i2s_bclk: GPIO27
      i2s_mclk: GPIO30
      i2s_din: GPIO26 # es8311 (0x10)
      i2s_dout: GPIO28 # es7210 (0x40)
      spk: GPIOxx
      mic: GPIOxx

    cam:
      y0: nc
      y1: nc
