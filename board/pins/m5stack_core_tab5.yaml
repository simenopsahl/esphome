        rx: GPIO21
        dir: GPIO34
      extPort1:
        p1: GND
        p2: HVIN
        p3: GND
        p4: GND
        p5: 5v
        p6: 3v
        p7: GPIO0
        p8: GPIO1
        p9: GPIO49
        p10: GPIO50
      i2c:
        grove:
          sda: GPIO53
          scl: GPIO54
        mbus:
          sda: GPIO3
          scl: GPIO4
      uart:
        grove:
          tx: GPIO54
          rx: GPIO53
        mbus:
          tx: GPIO37
          rx: GPIO38
      gpio:
        grove:
          in: GPIO54
          out: GPIO53
        mbus:
