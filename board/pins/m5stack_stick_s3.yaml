---
# https://docs.m5stack.com/en/core/StickS3
# PINs for m5stack StickS3

substitutions:
  pin:
    btn:
      power: GPIO35
      side: GPIO12
      front: GPIO11

    int:
      i2c:
        sda: GPIO47
        scl: GPIO48
        int: GPIO4
      spi:
        clk: GPIO40
        mosi: GPIO39
        disp:
          cs: GPIO41
          dc: GPIO45
          rst: GPIO21
          bl: GPIO38
      pwr_mos: GPIO4
      bat_feedback: GPIO0
    
    light:
      disp_bl: GPIO38
      ir:
        rx: GPIO42
        tx: GPIO46
    
    audio:
      i2s_lrclk: GPIO15
      i2s_bclk: GPIO17
      i2s_mclk: GPIO18
      i2s_din: GPIO16
      i2s_dout: GPIO14
      spk: GPIO14
      mic: GPIO16
    
    m5pm1:
      chg_stat: GPIO0
      irq: GPIO1
      l3b_en: GPIO2
      spk_pulse: GPIO3
      imu_int: GPIO4
    
    ext:
      i2c:
        grove:
          sda: GPIO9
          scl: GPIO10
        hat:
          sda: GPIO43
          scl: GPIO6
        hat2:
          sda: GPIO8
          scl: boot
      uart:
        grove:
          tx: GPIO10
          rx: GPIO9
        hat:
          tx: GPIO43
          rx: GPIO6
        hat2:
          tx: GPIO8
          rx: boot
      gpio:
        grove:
          in: GPIO10
          out: GPIO9
        hat:
          in: GPIO7
          out: GPIO6
        hat2:
          in: GPIO1
          out: boot
      hat2:
        left:
          p1: gnd
          p2: 5v_ext
          p3: boot
          p4: GPIO1
          p5: GPIO8
          p6: bat
          p7: 3v3
          p8: 5v_in
        right:
          p1: GPIO5
          p2: GPIO4
          p3: GPIO6
          p4: GPIO7
          p5: GPIO43
          p6: GPIO44
          p7: GPIO2
          p8: GPIO3
        p1: gnd
        p2: GPIO5
        p3: 5v_ext
        p4: GPIO4
        p5: boot
        p6: GPIO6
        p7: GPIO1
        p8: GPIO7
        p9: GPIO8
        p10: GPIO43
        p11: bat
        p12: GPIO44
        p13: 3v3
        p14: GPIO2
        p15: 5v_in
        p16: GPIO3

  # Internal
  i2c_int_sda_pin: GPIO21
  i2c_int_scl_pin: GPIO22
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO17
  i2s_mclk_pin: GPIO18
  spi_clk_pin: GPIO40
  spi_mosi_pin: GPIO39
  disp_cs_pin: GPIO41
  disp_dc_pin: nc
  disp_reset_pin: GPIO21
  # GROVE
  i2c_grove_sda_pin: GPIO9
  i2c_grove_scl_pin: GPIO10
  in_grove_pin: GPIO10
  out_grove_pin: GPIO9
  tx_grove_pin: GPIO10
  rx_grove_pin: GPIO9
  # HAT
  i2c_hat_sda_pin: GPIO43
  i2c_hat_scl_pin: GPIO6
  in_hat_pin: GPIO7
  out_hat_pin: GPIO6
  tx_uart_hat_pin: GPIO43
  rx_uart_hat_pin: GPIO6
  # Button
  button_power_pin: GPIO35
  button_side_pin: GPIO12
  button_front_pin: GPIO11
  # LED
  disp_bl_pin: GPIO38
  ir_rx_pin: GPIO42
  ir_tx_pin: GPIO46
  # Buzzer & Mic
  spk_pin: GPIO14
  mic_pin: GPIO16
  # Power MOS
  pwr_mos_pin: GPIO4
  bat_feedback_pin: GPIO0
