---
# https://docs.m5stack.com/en/core/CoreS3-Lite
# PINs for m5stack Core S3-Lite

substitutions:
  pin:
    int:
      i2c:
        sda: GPIO12
        scl: GPIO11
        int: GPIO21
      spi:
        clk: GPIO36
        mosi: GPIO37
        miso: GPIO35
        disp:
          cs: GPIO3
          dc: GPIO35
        card:
          cs: GPIO4

    cam:
      y0: nc
      y1: nc
      y2: GPIO39
      y3: GPIO40
      y4: GPIO41
      y5: GPIO42
      y6: GPIO15
      y7: GPIO16
      y8: GPIO48
      y9: GPIO47
      vs: GPIO46
      hs: GPIO38
      p_clk: GPIO45
      m_clk: GPIO36
      pwr: -1
      rst: -1

    audio:
      i2s_lrclk: GPIO33
      i2s_wck: GPIO33
      i2s_bclk: GPIO34
      i2s_mclk: GPIO0
      i2s_din: GPIO14
      i2s_dati: GPIO14
      mic: GPIO14
      i2s_dout: GPIO13
      i2s_dato: GPIO13
    
    ext:
      i2c:
        mbus:
          sda: GPIO2
          scl: GPIO1
        grove:
          sda: GPIO2
          scl: GPIO1
      uart:
        mbus:
          tx: GPIO43
          rx: GPIO44
        grove:
          tx: GPIO17
          rx: GPIO18
      gpio:
        mbus:
          in: GPIO8
          out: GPIO9
        grove:
          in: GPIO8
          out: GPIO9
      mbus:
        p2: GPIO10
        p4: GPIO8
        p7: GPIO37
        p8: GPIO5
        p9: GPIO35
        p10: GPIO9
        p11: GPIO36
        p13: GPIO44
        p14: GPIO43
        p15: GPIO18
        p16: GPIO17
        p17: GPIO12
        p18: GPIO11
        p19: GPIO2
        p20: GPIO1
        p21: GPIO6
        p22: GPIO7
        p23: GPIO13
        p24: GPIO0
        p26: GPIO14
