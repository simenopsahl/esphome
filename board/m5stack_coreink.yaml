labels: [esp32, ePaper, display]
---
# https://docs.m5stack.com/en/core/coreink
# Schematic reference: "esphome/pinmap/schematics/esp32 M5Stack CoreInk.png"
# Base LVGL e-Paper hardware package for:
# M5Stack CoreInk (ESP32-PICO-D4, no PSRAM)
#

# Pins for this model & shared gui/epaper engine
packages:
  pins: !include pins/m5stack_coreink.yaml
  epaper: !include ../gui/epaper/base.yaml

substitutions:
  panel_width: "200"
  panel_height: "200"
  time_timezone: "Europe/Oslo"
  epaper:
    theme: bw
    fonts: bw
    nav: coreink
  display:
    buffer_size: "5%"
    home_page: "page_room"
    chrome:
      header: "true"
      status_in_footer: "true"
    page:
      info:
        show_battery_volt: "true"
  module:
    internal:
      i2c_bus: i2c_internal
  device:
    model: "M5Stack CoreInk"
    board: m5stack_coreink
    rmt_symbols_block: 64
    framework:
      type: esp-idf
    screen:
      width: ${screen_width}
      height: ${screen_height}

esphome:
  project:
    name: "M5Stack.CoreInk"
    version: "1.0.0"
  on_boot:
    - priority: 800
      then:
        # Bypass sleep circuit esp-idf
        - lambda: |-
            gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_12, 1);
            gpio_hold_en(GPIO_NUM_12);
            gpio_deep_sleep_hold_en();

esp32:
# ESP32-PICO-D4@dual-core processor, main frequency 240MHz
  variant: esp32
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: SIZE
      flash_chip: gd
    sdkconfig_options:
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
    type: ${device.framework.type}

wifi:
  enable_btm: true
  enable_rrm: true

esp32_ble:
  max_connections: 1
esp32_ble_tracker:
  scan_parameters:
    interval: 500ms
    window: 15ms
bluetooth_proxy:
  active: false
  connection_slots: 1

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}

# Buzzer
output:
  - platform: ledc
    id: buzzer
    pin:
      number: ${pin.audio.buzzer}
      ignore_strapping_warning: true

display:
  # 200 x 200 resolution
  - platform: epaper_spi
    id: display_eink
    model: Waveshare-1.54in-v2
    data_rate: 10MHz
    cs_pin: ${pin.int.spi.disp.cs}
    dc_pin:
      number: ${pin.int.spi.disp.dc}
      ignore_strapping_warning: true
    reset_pin:
      number: ${pin.int.spi.disp.reset}
      ignore_strapping_warning: true
    busy_pin:
      number: ${pin.int.spi.disp.busy}
      inverted: false
    full_update_every: 2
    auto_clear_enabled: false
    update_interval: never

binary_sensor:
  # Top Button
  - platform: gpio
    id: button_top
    name: Top Button
    entity_category: diagnostic
    pin:
      number: ${pin.btn.top}
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Top Button Pressed
      - script.execute: buzzer_beep
    on_release:
      - output.turn_off: buzzer

  # Stick Up (Home)
  - platform: gpio
    id: stick_up
    pin:
      number: ${pin.btn.stick.up}
      inverted: true
      mode:
        input: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Stick Up
      - script.execute: buzzer_beep
      - lvgl.page.show:
          id: ${display.home_page}
          animation: NONE
          time: 0ms
      - script.execute: update_screen
    on_release:
      - output.turn_off: buzzer
    name: Stick Up
    entity_category: diagnostic

  # Stick Press (Refresh)
  - platform: gpio
    id: stick_press
    pin:
      number: ${pin.btn.stick.press}
      inverted: true
      mode:
        input: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Stick Press
      - script.execute: buzzer_beep
      - script.execute: update_screen
    on_release:
      - output.turn_off: buzzer
    name: Stick Press
    entity_category: diagnostic

  # Stick Down (Next Page)
  - platform: gpio
    id: stick_down
    pin:
      number: ${pin.btn.stick.down}
      inverted: true
      mode:
        input: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Stick Down
      - script.execute: buzzer_beep
      - lvgl.page.next:
          animation: NONE
          time: 0ms
      - script.execute: update_screen
    on_release:
      - output.turn_off: buzzer
    name: Stick Down
    entity_category: diagnostic

  # Power Hold
  - platform: gpio
    id: pwr_hold
    pin:
      number: ${pin.int.pwr_mos}
      ignore_strapping_warning: true
      inverted: true
    name: Power Hold
    entity_category: diagnostic

sensor:
  # Battery voltage
  - platform: adc
    pin: ${pin.int.bat_feedback}
    id: bat_adc
    attenuation: 12db
    update_interval: 10s
    samples: 10
    accuracy_decimals: 3
    filters:
      - multiply: 4.9216
      - median:
          window_size: 6
          send_every: 3
          send_first_at: 1
    name: "Battery Voltage"
    entity_category: diagnostic
    disabled_by_default: true
    device_class: voltage
    unit_of_measurement: V
    on_value:
      - then:
          - component.update: bat_percent
          - lambda: |-
              char buf[12];
              if (isnan(x)) snprintf(buf, sizeof(buf), "--V");
              else snprintf(buf, sizeof(buf), "%.2f V", x);
              lv_label_set_text(id(lbl_ep_info_bat_volt), buf);
              id(data_updated) = true;

  # Battery Percent
  - platform: template
    name: "Battery"
    id: bat_percent
    lambda: return id(bat_adc).state;
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.27 -> 0.0
            - 3.61 -> 10.0
            - 3.69 -> 20.0
            - 3.74 -> 30.0
            - 3.79 -> 40.0
            - 3.83 -> 50.0
            - 3.87 -> 60.0
            - 3.92 -> 70.0
            - 3.98 -> 80.0
            - 4.08 -> 90.0
            - 4.20 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
    entity_category: diagnostic
    device_class: battery
    unit_of_measurement: "%"

# Script for buzzer beep
script:
  - id: buzzer_on
    then:
      - output.turn_on: buzzer
      - output.ledc.set_frequency:
          id: buzzer
          frequency: "500Hz"
      - output.set_level:
          id: buzzer
          level: "1%"
  - id: buzzer_beep
    then:
      - output.turn_on: buzzer
      - output.ledc.set_frequency:
          id: buzzer
          frequency: "500Hz"
      - output.set_level:
          id: buzzer
          level: "1%"
      - delay: 30ms
      - output.turn_off: buzzer

status_led:
  pin: ${pin.light.led}
