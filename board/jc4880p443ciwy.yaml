labels: [esp32p4, psram, JC4880P443, display, i2c]
---
# https://github.com/agillis/esphome-modular-lvgl-buttons/blob/main/hardware/guition-esp32-p4-jc4880p443.yaml
# Schematic reference: "esphome/pinmap/schematics/esp32p4 jc4880p443.pdf"
# Base functions for:
# Guition module ESP32-P4 & ESP32-C6 with 4.3" display and camera (JC4880P443C_I_W_Y)
#

# Pins for this model
packages:
  pins: !include pins/jc4880p443ciwy.yaml
  i2c_int: !include extension/internal_i2c.yaml
  audio: !include
    file: module/audio/${feature.audio.hardware_module | default("jc4880p443ciwy_audio.yaml")}
    condition: ${feature_audio_enabled | default("false")}

substitutions:
  screen_width: "480"
  screen_height: "800"
  extension:
    i2c:
      internal:
        frequency: 400kHz
  device:
    model: 'Guition 4,3"'
    board: jc4880p443ciwy
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    psram: 'true'
    screen:
      width: ${screen_width}
      height: ${screen_height}
  feature:
    audio:
      hardware_module: jc4880p443ciwy_audio.yaml

esphome:
  project:
    name: 'Guition.4,3" 480x800'
    version: "1.0.0"

esp32:
# ESP32-P4R32 (Dual-core, 360MHz)
# PSRAM: 32MB
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
      enable_idf_experimental_features: true
    sdkconfig_options:
      # Memory allocation for large RGB graphics buffers
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
    type: ${device.framework.type}

logger:
  hardware_uart: USB_SERIAL_JTAG

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

preferences:
  flash_write_interval: 5min

http_request:  # Needed by esp32_hosted-update and any JSON stuff
  buffer_size_rx: 2048

# Network hardware
esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: ${pin.int.c6_hosted.rst}
  clk_pin: ${pin.int.c6_hosted.clk}
  cmd_pin: ${pin.int.c6_hosted.cmd}
  d0_pin: ${pin.int.c6_hosted.d0}
  d1_pin: ${pin.int.c6_hosted.d1}
  d2_pin: ${pin.int.c6_hosted.d2}
  d3_pin: ${pin.int.c6_hosted.d3}
  use_psram: true

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: "C6 CoProcessor Update"
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

# Internal outputs
output:
  # Backlight LED
  - platform: ledc
    id: backlight_output
    pin: ${pin.disp.bl}
    frequency: 100Hz
    inverted: false

light:
  - platform: monochromatic
    id: backlight_light
    output: backlight_output
    default_transition_length: 100ms
    restore_mode: RESTORE_AND_ON
    initial_state:
      state: on
      brightness: 25%
    name: "Backlight"
    entity_category: config

display:
  - platform: mipi_dsi
    id: display_lcd
    model: JC4880P443
    dimensions:
      height: ${device.screen.height}
      width: ${device.screen.width}
    auto_clear_enabled: false
    update_interval: 10s

# Touchscreen
touchscreen:
  - platform: gt911
    i2c_id: i2c_internal
    id: touchscreen_gt911
    display: display_lcd
    reset_pin: ${pin.touch.rst}
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - logger.log:
          tag: "Touch"
          level: INFO
          format: Touch %d at (%d, %d)
          args: [ 'touch.id', 'touch.x', 'touch.y' ]

# MIPI CSI Camera not yet supported in ESPHome
# esp32_camera:
#   i2c_id: i2c_internal
#   id: espcam
#   # PINS
#   external_clock:
#     pin: ${pin.cam.m_clk}
#     frequency: 20MHz
#   data_pins:
#     - ${pin.cam.y2}
#     - ${pin.cam.y3}
#     - ${pin.cam.y4}
#     - ${pin.cam.y5}
#     - ${pin.cam.y6}
#     - ${pin.cam.y7}
#     - ${pin.cam.y8}
#     - ${pin.cam.y9}
#   vsync_pin: ${pin.cam.vs}
#   href_pin: ${pin.cam.hs}
#   pixel_clock_pin: ${pin.cam.p_clk}
#   power_down_pin: ${pin.cam.pwr}
#   # Metadata
#   name: "Camera OV02C10"
#   # Image settings
#   resolution: 640x480
#   jpeg_quality: 20
#   max_framerate: 5 fps
#   frame_buffer_count: 2 # defaults to 1
# #  vertical_flip: true
# #  horizontal_mirror: true

# Special LVGL settings required for this display
lvgl:
  byte_order: little_endian
# Some screens need little_endian byte order and some need big_endian
# this sets the byte order for all the images loaded in this file and the packages as well
image:
  defaults:
    byte_order: little_endian
