# Audio - speaker/mic
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: ${pin.audio.i2s_lrclk}
    i2s_bclk_pin: ${pin.audio.i2s_bclk}
    i2s_mclk_pin: ${pin.audio.i2s_mclk}

audio_dac:
  - platform: es8311
    i2c_id: i2c_internal
    id: dac_es8311
    address: 0x18

audio_adc:
  - platform: es7210
    i2c_id: i2c_internal
    id: adc_es7210
    address: 0x36

microphone:
  - platform: i2s_audio
    id: i2s_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: ${pin.audio.mic}
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    channel: left

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: ${pin.audio.spk}
    audio_dac: dac_es8311
    dac_type: external
    channel: mono
    buffer_duration: 750ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    task_stack_in_psram: true

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    task_stack_in_psram: true

switch:
  # Speaker Amplifier Enable
  - platform: gpio
    id: speaker_enable
    pin: ${pin.audio.amp}
    restore_mode: RESTORE_DEFAULT_ON
    name: "Speaker Enable"
    icon: "mdi:volume-high"
    entity_category: config

  - platform: template
    id: mic_mute
    name: Microphone Mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
        - microphone.unmute:
    on_turn_on:
        - microphone.mute:

sensor:
  - platform: sound_level
    id: sound_level_sensor
    passive: false
    measurement_duration: 2000ms
    rms:
      name: "Noise Level"
      id: average_loudness
      filters:
        - multiply: -1
  # CPU Temperature
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    update_interval: 5s
    entity_category: diagnostic

# Special LVGL settings required for this display
lvgl:
  byte_order: little_endian
# Some screens need little_endian byte order and some need big_endian
# this sets the byte order for all the images loaded in this file and the packages as well
image:
  defaults:
    byte_order: little_endian