labels: [esp32p4, psram, JC4880P443, display, i2c]
---
# https://github.com/agillis/esphome-modular-lvgl-buttons/blob/main/hardware/guition-esp32-p4-jc4880p443.yaml
# Base functions for:
# Guition module ESP32-P4 & ESP32-C6 with 4.3" display and camera (JC4880P443C_I_W_Y)
#
  
# Pins for this model
packages:
  pins: !include pins/jc4880p443ciwy.yaml
  i2c_int: !include extension/internal_i2c.yaml

substitutions:
  screen_width: "480"
  screen_height: "800"
  extension:
    i2c:
      internal:
        frequency: 400kHz
  device:
    model: 'Guition 4,3"'
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    psram: 'true'
    screen:
      width: ${screen_width}
      height: ${screen_height}
  feature:
    audio:
      volume_min: '0.4'
      volume_max: '0.8'
      sound_file_boot: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_triple_press.flac
      sound_file_speaker_enable: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac

esphome:
  project:
    name: 'Guition.4,3" 480x800'
    version: "1.0.0"
  on_boot:
    - priority: 375
      then:
        # Safety net: if HA never connects.
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
    - priority: -100
      then:
        # Diagnostics: an explicit OFF switch that silences the mic completely.
        # ON = microphone disabled. (This used to be inverted, so the mic was
        # stopped on every boot with the switch in its default OFF position.)
        - if:
            condition:
              switch.is_on: diag_disable_mic
            then:
              - logger.log: "Mic DISABLED for diagnostics"
              - microphone.stop_capture: i2s_mic
            else:
              - logger.log: "Mic enabled"

esp32:
# ESP32-P4R32 (Dual-core, 360MHz)
# PSRAM: 32MB
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
      enable_idf_experimental_features: true
    sdkconfig_options:
      # Memory allocation for large RGB graphics buffers
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
    type: ${device.framework.type}

logger:
  hardware_uart: USB_SERIAL_JTAG

esp_ldo:
  - channel: 3
    voltage: 2.5V

psram:
  mode: hex
  speed: 200MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

api:
  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
    - lambda: id(init_in_progress) = false;
    # One-shot "ready" chime. It MUST run after the mic is turned on: the
    # speaker is a slave to the mic's I2S clock, so playing before the mic is
    # capturing hangs the announcement and can interrupt mic operation. The
    # flag is set first so an HA reconnect can't replay it.
    - if:
        condition:
          - lambda: 'return !id(boot_chime_done);'
          - switch.is_on: boot_sound
          - switch.is_off: diag_disable_mic
        then:
          - lambda: id(boot_chime_done) = true;
          - delay: 1s            # let the mic-master clock settle
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(boot_sound_custom);

preferences:
  flash_write_interval: 5min

http_request:  # Needed by esp32_hosted-update and any JSON stuff
  buffer_size_rx: 2048

globals:
  - id: mic_is_muted
    type: bool
    restore_value: no          # the switch forces OFF at boot (see on_client_connected)
    initial_value: 'false'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_chime_done
    type: bool
    restore_value: no
    initial_value: 'false'

# Network hardware
esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: ${pin.int.c6_hosted.rst}
  clk_pin: ${pin.int.c6_hosted.clk}
  cmd_pin: ${pin.int.c6_hosted.cmd}
  d0_pin: ${pin.int.c6_hosted.d0}
  d1_pin: ${pin.int.c6_hosted.d1}
  d2_pin: ${pin.int.c6_hosted.d2}
  d3_pin: ${pin.int.c6_hosted.d3}
  use_psram: true

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: "C6 CoProcessor Update"
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

# Internal outputs
output:
  # Backlight LED
  - platform: ledc
    id: backlight_output
    pin: ${pin.disp.bl}
    frequency: 100Hz
    inverted: false

light:
  - platform: monochromatic
    id: backlight_light
    output: backlight_output
    default_transition_length: 100ms
    restore_mode: RESTORE_AND_ON
    initial_state:
      state: on
      brightness: 25%
    name: "Backlight"
    entity_category: config

display:
  - platform: mipi_dsi
    id: display_lcd
    model: JC4880P443
    dimensions:
      height: ${device.screen.height}
      width: ${device.screen.width}
    auto_clear_enabled: false
    update_interval: 10s

# Touchscreen
touchscreen:
  - platform: gt911
    i2c_id: i2c_internal
    id: touchscreen_gt911
    display: display_lcd
    reset_pin: ${pin.touch.rst}
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - logger.log:
          tag: "Touch"
          level: INFO
          format: Touch %d at (%d, %d)
          args: [ 'touch.id', 'touch.x', 'touch.y' ]

# MIPI CSI Camera not yet supported in ESPHome
# esp32_camera:
#   i2c_id: i2c_internal
#   id: espcam
#   # PINS
#   external_clock:
#     pin: ${pin.cam.m_clk}
#     frequency: 20MHz
#   data_pins:
#     - ${pin.cam.y2}
#     - ${pin.cam.y3}
#     - ${pin.cam.y4}
#     - ${pin.cam.y5}
#     - ${pin.cam.y6}
#     - ${pin.cam.y7}
#     - ${pin.cam.y8}
#     - ${pin.cam.y9}
#   vsync_pin: ${pin.cam.vs}
#   href_pin: ${pin.cam.hs}
#   pixel_clock_pin: ${pin.cam.p_clk}
#   power_down_pin: ${pin.cam.pwr}
#   # Metadata
#   name: "Camera OV02C10"
#   # Image settings
#   resolution: 640x480
#   jpeg_quality: 20
#   max_framerate: 5 fps
#   frame_buffer_count: 2 # defaults to 1
# #  vertical_flip: true
# #  horizontal_mirror: true

# Audio - speaker/mic
# The DAC and ADC share BCLK/LRCLK pins, but ESPHome's i2s_audio cannot run one
# bus full-duplex with active capture (mutex contention). So we use TWO buses:
#   - i2s_input  = the MIC bus, I2S MASTER. Continuous capture generates BCLK/LRCLK.
#   - i2s_output = the SPEAKER bus, I2S SLAVE (secondary). Receives the mic clock.
i2s_audio:
  - id: i2s_input
    i2s_mclk_pin: ${pin.audio.i2s_mclk}
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true
  - id: i2s_output
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true

audio_dac:
  - platform: es8311
    i2c_id: i2c_internal
    id: dac_es8311
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_microphone: false
    mic_gain: 30DB

microphone:
  - platform: i2s_audio
    id: i2s_mic
    i2s_audio_id: i2s_input
    i2s_din_pin: ${pin.audio.mic}
    bits_per_sample: 16bit
    adc_type: external
    channel: left

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: ${pin.audio.spk}
    i2s_mode: secondary
    dac_type: external
    sample_rate: 16000
    audio_dac: dac_es8311
    channel: left
    buffer_duration: 250ms
  # Mixes the announcement and media pipelines into the one physical output.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # The mixer needs both inputs at one sample rate; these resample if needed.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

# media player and voice assist in features/voice_assistant.yaml
media_player:
  - platform: speaker
    id: speaker_media_player
    name: None
    internal: False
    task_stack_in_psram: ${device.psram}
    buffer_size: 1000000
    volume_initial: 50%
    volume_min: ${feature.audio.volume_min}
    volume_max: ${feature.audio.volume_max}
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC              # cheapest codec for the S3
      num_channels: 1           # stereo is pointless for announcements
      sample_rate: 48000        # what Music Assistant serves
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1           # mono hardware, one speaker
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      # Amp follows playback: turn it on the instant audio starts. It stays on
      # afterwards (the speaker then holds the line at clean silence), so there
      # is no per-sound clicking - only the boot window is silent.
      - if:
          condition:
            or:
              - media_player.is_announcing:
              - lambda: 'return id(speaker_media_player)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - switch.turn_on: amp_enable
      - if:
          condition:
            - not:
                media_player.is_announcing:
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
    files:
      - id: boot_sound_custom
        file: ${feature.audio.sound_file_boot}
      - id: speaker_enable_sound
        file: ${feature.audio.sound_file_speaker_enable}

switch:
  # Speaker Amplifier Enable
  - platform: gpio
    id: amp_enable
    pin: ${pin.audio.amp}
    restore_mode: ALWAYS_OFF
    name: "Amplifier"
    icon: "mdi:volume-high"
    entity_category: config
    on_turn_on:
      - if:
          condition:
            - lambda: 'return id(boot_chime_done);'
            - lambda: 'return !id(init_in_progress);'
            - switch.is_on: boot_sound
            - switch.is_off: diag_disable_mic
            - not:
                media_player.is_announcing: speaker_media_player
            - lambda: 'return id(speaker_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - delay: 250ms            # let the amplifier settle
            - script.execute:
                id: play_sound
                priority: false
                sound_file: !lambda return id(speaker_enable_sound);

  - platform: template
    id: diag_disable_mic
    name: "Diag: disable microphone"
    icon: mdi:microphone-settings
    internal: true                      # diagnostic-only, not shown in HA
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # OFF = mic works as usual
    # These triggers also fire during setup() when the state is restored from
    # flash - at setup_priority HARDWARE-2, i.e. before the mic and mWW exist.
    # on_boot (priority -100) applies the restored state once everything is up,
    # so here we only handle a live toggle.
    on_turn_on:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - microphone.stop_capture: i2s_mic
    on_turn_off:
      - if:
          condition:
            - lambda: return !id(init_in_progress);
            - switch.is_off: mic_mute_switch
          then:
            - microphone.capture: i2s_mic

  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: mdi:microphone-off
    entity_category: config
    # State comes from the lambda below, so restore_mode would be a no-op here.
    # The mute is forced off at boot by the voice_assistant on_client_connected.
    lambda: |-
      return id(mic_is_muted);
    # A real mute, via ESPHome's own primitive: microphone.mute makes the
    # Microphone hand every consumer a zero-filled buffer, so the wake word
    # literally hears silence. The stream keeps running, so there is no I2S
    # restart and no start/stop race.
    #
    # The previous implementation dropped the ES7210 gain to 0.0f - but 0 dB is
    # UNITY gain, not silence. The mic kept hearing the room and only the wake
    # word handler ignored it.
    turn_on_action:
      - lambda: id(mic_is_muted) = true;
      - microphone.mute: i2s_mic
    turn_off_action:
      - lambda: id(mic_is_muted) = false;
      - microphone.unmute: i2s_mic

  - platform: template
    id: boot_sound
    name: Boot sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: sound_level_enabled
    optimistic: true
    restore_mode: ALWAYS_ON
    name: "Sound Level Tracking"
    icon: "mdi:waveform"
    entity_category: config
    on_turn_off:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - sound_level.stop: sound_level_sensor
    on_turn_on:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - sound_level.start: sound_level_sensor

sensor:
  - platform: sound_level
    id: sound_level_sensor
    passive: false
    measurement_duration: 3000ms
    rms:
      name: "Noise Level"
      id: average_loudness
      filters:
        - offset: 100.0
  # CPU Temperature
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    update_interval: 5s
    entity_category: diagnostic

script:
  # ESPHome 2026.10 made audio files const; 2026.8/2026.9 still take a mutable
  # pointer in play_file(). A const parameter accepts both, and the const_cast
  # below keeps play_file() compiling on either. The type is spelled with
  # add_const_t because script parameter types may not contain spaces.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: "std::add_const_t<audio::AudioFile>*"
    then:
      - switch.turn_on: amp_enable
      - lambda: |-
          if (priority) {
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(speaker_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(speaker_media_player)->play_file(const_cast<audio::AudioFile *>(sound_file), true, false);
          }

# Special LVGL settings required for this display
lvgl:
  byte_order: little_endian
# Some screens need little_endian byte order and some need big_endian
# this sets the byte order for all the images loaded in this file and the packages as well
image:
  defaults:
    byte_order: little_endian
