labels: [esp32s3, psram, camera]
---
# https://docs.waveshare.com/ESP32-S3-CAM-OVxxxx
# Base functions for Waveshare ESP32-S3 camera board
#

# Pins for this model
packages:
  pins: !include pins/esp32s3_cam_n16r8_waveshare.yaml
  i2c: !include extension/internal_i2c.yaml
  camera: !include module/esp32_camera.yaml

substitutions:
  device:
    model: "Waveshare S3-Cam"
    rmt_symbols_block: 48
    framework:
      type: esp-idf
  extension:
    i2c:
      internal:
        frequency: 200kHz
  module:
    camera:
      pixel_format: JPEG
      resolution: 800x600
      jpeg_quality: 20
      max_framerate: 2fps
      idle_framerate: 0.1fps
      agc_gain_ceiling: 64x
      wb_mode: auto

esp32:
# ESP32-S3R8
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  watchdog_timeout: 10s
  framework: 
    type: ${device.framework.type}
    advanced:
      compiler_optimization: PERF
      enable_idf_experimental_features: true
      execute_from_psram: true
      loop_task_stack_size: 16384
      assertion_level: DISABLE
      enable_lwip_assert : false
    sdkconfig_options:
      # Caching Optimizations
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      
      # PSRAM Integrations
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      
      # TLS and Logging
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_LOG_DEFAULT_LEVEL: "0"  # prevents "ESP-IDF" Guru Meditation Error
      
      # Camera Specifics
      CONFIG_CAMERA_TASK_STACK_SIZE: "8192"

esphome:
  project:
    name: "Waveshare.ESP32-S3-CAM"
    version: "1.0.0"

psram:
  mode: octal
  speed: 80MHz

wifi:
  output_power: 10dB
  power_save_mode: light
  use_psram: true
  enable_btm: true
  enable_rrm: true

spi:
  - id: spi_mmc
    clk_pin: ${pin.int.spi.card.clk}
    mosi_pin: ${pin.int.spi.card.cmd}
    miso_pin: ${pin.int.spi.card.data}
  - id: spi_quad
    type: quad
    clk_pin: ${pin.int.spi.disp.clk}
    data_pins:
      - ${pin.int.spi.disp.quad.sda0}
      - ${pin.int.spi.disp.quad.sda1}
      - ${pin.int.spi.disp.quad.sda2}
      - ${pin.int.spi.disp.quad.sda3}

# Waveshare IO Expander
waveshare_io_ch32v003:
  - id: hub_ch32v003
    i2c_id: i2c_internal

esp32_camera:
  i2c_id: i2c_internal
  # PINS
  external_clock:
    pin: ${pin.cam.m_clk}
    frequency: 20MHz
  data_pins:
    - ${pin.cam.y2}
    - ${pin.cam.y3}
    - ${pin.cam.y4}
    - ${pin.cam.y5}
    - ${pin.cam.y6}
    - ${pin.cam.y7}
    - ${pin.cam.y8}
    - ${pin.cam.y9}
  vsync_pin: ${pin.cam.vs}
  href_pin: ${pin.cam.hs}
  pixel_clock_pin: ${pin.cam.p_clk}
# This variable only supports pin numbers, not full pin schemas (with inverted and mode).
#  power_down_pin:
#    waveshare_io_ch32v003: hub_ch32v003
#    number: ${pin.cam.pwr}
#    mode: OUTPUT
  # Image settings
  vertical_flip: false
  horizontal_mirror: false
  frame_buffer_count: 2 # defaults to 1
  # Exposure
  aec2: true # defaults to false
  ae_level: 2

# If NOT JPEG pixel_format
#camera_encoder:
#  type: esp32_camera
#  quality: 70
#  buffer_size: 524288
#  buffer_expand_size: 2097152

output:
  # backlight output
  - platform: waveshare_io_ch32v003
    waveshare_io_ch32v003_id: hub_ch32v003
    id: backlight_output
    inverted: true  # Example: PWM is inverted on ESP32S3-Touch-LCD-7B board
    safe_pwm_levels:
      min_value: 1 # Example: safe level for power_supply component to work
      max_value: 247 # Example: safe level for ESP32S3-Touch-LCD-7B board

light:
  - platform: monochromatic # backlight
    id: backlight_light
    output: backlight_output
    default_transition_length: 100ms
    restore_mode: ALWAYS_OFF
    name: "Backlight"
    entity_category: config

switch:
  - platform: gpio
    id: camera_power
    name: "Camera Power"
    pin:
      waveshare_io_ch32v003: hub_ch32v003
      number: ${pin.cam.pwr}
      mode: OUTPUT
    restore_mode: ALWAYS_ON
    entity_category: config
  - platform: gpio
    id: amp_power
    name: "Amplifier Power"
    pin:
      waveshare_io_ch32v003: hub_ch32v003
      number: ${pin.audio.amp}
      mode: OUTPUT
    restore_mode: DISABLED
    entity_category: config

status_led:
  pin:
    waveshare_io_ch32v003: hub_ch32v003
    number: ${pin.light.led}
    mode: OUTPUT

sensor:
  - platform: waveshare_io_ch32v003
    waveshare_io_ch32v003_id: hub_ch32v003
    id: wave_adc
    reference_voltage: 9.9
    name: "Battery level"
    entity_category: diagnostic

  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    update_interval: 5s
    entity_category: diagnostic