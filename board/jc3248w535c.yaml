labels: [esp32s3, psram, JC4832W535, display, i2c, audio, speaker]
---
# PINs for Sunton module ESP32-S3 with Guition 3.5" display
#

# Pins for this model
packages:
  pins: !include pins/jc3248w535c.yaml

substitutions:
  screen_width: "320"
  screen_height: "480"
  device:
    model: 'Sunton 3,5"'
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    screen:
      width: ${screen_width}
      height: ${screen_height}
    psram: 'true'
  feature:
    audio:
      volume_min: '0.4'
      volume_max: '0.8'
      sound_file_boot: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_triple_press.flac
      sound_file_speaker_enable: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac

esphome:
  project:
    name: 'Sunton.3,5" 320x480'
    version: "1.0.0"
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            // Park all I2S lines strongly low to prevent PSRAM bus crosstalk from triggering MAX98357A
            gpio_reset_pin(GPIO_NUM_41);
            gpio_set_direction(GPIO_NUM_41, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_41, 0);

            gpio_reset_pin(GPIO_NUM_42);
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 0);

            gpio_reset_pin(GPIO_NUM_2);
            gpio_set_direction(GPIO_NUM_2, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_2, 0);
    - priority: 375
      then:
        # Safety net: if HA never connects.
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;

esp32:
# ESP32-S3N16R8 (Dual-core, 240MHz)
# PSRAM: 8MB Octal
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
    sdkconfig_options:
      # Cache optimizations
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      # Memory allocation for large RGB graphics buffers
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
    type: ${device.framework.type}

psram:
  mode: octal
  speed: 80MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

# https://community.home-assistant.io/t/jc3248w535-guition-3-5-config/791363
spi:
  - type: quad
    clk_pin: ${pin.int.spi.clk}
    data_pins:
      - ${pin.int.spi.dat1}
      - ${pin.int.spi.dat2}
      - ${pin.int.spi.dat3}
      - ${pin.int.spi.dat4}

i2c:
  - id: i2c_internal
    sda: ${pin.int.i2c.sda}
    scl: ${pin.int.i2c.scl}

output:
  - platform: ledc
    id: backlight_output
    pin: ${pin.light.disp_bl}

light:
  # White
  - platform: monochromatic
    id: backlight_light
    output: backlight_output
    default_transition_length: 100ms
    restore_mode: RESTORE_AND_ON
    initial_state:
      state: on
      brightness: 25%
    name: "Backlight"
    entity_category: config

display:
  - platform: qspi_dbi
    id: display_lcd
    model: JC4832W535
    cs_pin:
      number: ${pin.int.spi.disp.cs}
      ignore_strapping_warning: true
    dimensions:
      height: ${device.screen.height}
      width: ${device.screen.width}
    data_rate: 40MHz
    draw_from_origin: true
    auto_clear_enabled: false
    update_interval: 10s

touchscreen:
  - platform: axs15231
    i2c_id: i2c_internal
    id: touchscreen_axs
    # https://community.home-assistant.io/t/esp32-s3-3-5-inch-capacitive-touch-ips-module-320-480/768591/73
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 480
    transform:
      swap_xy: false   # 0=false, 90=true, 180=false, 270=true
      mirror_x: false  # 0=false, 90=true, 180=true, 270=false
      mirror_y: false   # 0=false, 90=false, 180=true, 270=true
#    on_update:
#      - logger.log:
#          format: Touch %d at (%d, %d)
#          args: [ 'touch->id', 'touch->x', 'touch->y' ]

api:
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - if:
        condition:
          - lambda: 'return !id(boot_chime_done);'
        then:
          - if:
              condition:
                - switch.is_on: boot_sound
              then:
                - delay: 1s
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: !lambda return id(boot_sound_custom);
                - delay: 2s
          - lambda: id(boot_chime_done) = true;

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_chime_done
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    id: amp_enable
    name: "Amplifier"
    icon: "mdi:volume-high"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(i2s_speaker)->set_mute_state(false);'
    turn_off_action:
      - lambda: 'id(i2s_speaker)->set_mute_state(true);'
    on_turn_on:
      - if:
          condition:
            - lambda: 'return id(boot_chime_done);'
            - lambda: 'return !id(init_in_progress);'
            - switch.is_on: boot_sound
            - not:
                media_player.is_announcing: speaker_media_player
            - lambda: 'return id(speaker_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - delay: 250ms
            - script.execute:
                id: play_sound
                priority: false
                sound_file: !lambda return id(speaker_enable_sound);

  - platform: template
    id: boot_sound
    name: Boot sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

script:
  - id: play_sound
    parameters:
      priority: bool
      sound_file: "std::add_const_t<audio::AudioFile>*"
    then:
      - lambda: |-
          if (priority) {
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(speaker_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(speaker_media_player)->play_file(const_cast<audio::AudioFile *>(sound_file), true, false);
          }

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: ${pin.audio.i2s_lrclk}
    i2s_bclk_pin: ${pin.audio.i2s_bclk}

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: ${pin.audio.spk}
    dac_type: external
    buffer_duration: 500ms
    timeout: never

  # Mixes the announcement and media pipelines into the one physical output.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # The mixer needs both inputs at one sample rate; these resample if needed.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    id: speaker_media_player
    name: None
    internal: False
    task_stack_in_psram: ${device.psram | default("true")}
    buffer_size: ${feature.audio.buffer_size | default("1000000")}
    volume_increment: 0.01
    volume_min: ${feature.audio.volume_min}
    volume_max: ${feature.audio.volume_max}
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC              # cheapest codec for the S3
      num_channels: 1           # stereo is pointless for announcements
      sample_rate: 48000        # what Music Assistant serves
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1           # mono hardware, one speaker
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            or:
              - media_player.is_announcing:
              - lambda: 'return id(speaker_media_player)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - switch.turn_on: amp_enable
      - if:
          condition:
            - not:
                media_player.is_announcing:
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
    files:
      - id: boot_sound_custom
        file: ${feature.audio.sound_file_boot}
      - id: speaker_enable_sound
        file: ${feature.audio.sound_file_speaker_enable}
