labels: [esp32s3, ePaper, display]
---
# CrowPanel ESP32 E-paper 5.79-inch HMI Display
# https://www.elecrow.com/wiki/CrowPanel_ESP32_E-paper_5.79-inch_HMI_Display.html
# https://github.com/Elecrow-RD/CrowPanel-ESP32-5.79-E-paper-HMI-Display-with-272-792
# Schematic reference: "esphome/pinmap/schematics/esp32s3 Elecrow CrowPanel-5.79in.pdf"
# Model:  ESP32-S3-WROOM-1-N8R8
# Flash:  8MB
# PSRAM:  8MB
# Resolution: 272 x 792 (5.79-inch)
#
# CrowPanel ESP32 E-paper 4.2-inch HMI Display v1.2
# https://www.elecrow.com/wiki/CrowPanel_ESP32_E-paper_4.2-inch_HMI_Display.html
# https://github.com/Elecrow-RD/CrowPanel-ESP32-4.2-E-paper-HMI-Display-with-400-300
# Schematic reference: "esphome/pinmap/schematics/esp32s3 Elecrow CrowPanel-4.2in.pdf"
# Model:  ESP32-S3-WROOM-1-N8R8
# Flash:  8MB
# PSRAM:  8MB
# Resolution: 400 x 300 (4.2-inch)
#
# Base functions for:
# Elecrow CrowPanel epaper series
#

packages:
  pins: !include pins/elecrow_crowpanel_epaper.yaml
  epaper_base: !include ../gui/epaper/base.yaml
  epaper_theme: !include ../gui/epaper/themes/bw.yaml
  epaper_fonts: !include ../gui/epaper/fonts/bw.yaml
  epaper_chrome: !include ../gui/epaper/chrome/status_bar.yaml
  epaper_nav: !include ../gui/epaper/chrome/nav_crowpanel.yaml
  epaper_info: !include ../gui/epaper/pages/info_sensors.yaml

substitutions:
  panel_width: "400"
  panel_height: "300"
  screen_width: ${ panel_height if (epaper_rotation|string) in ["90", "270"] else panel_width }
  screen_height: ${ panel_width if (epaper_rotation|string) in ["90", "270"] else panel_height }
  epaper_home_page: "page_info"
  hint_1: "Meny: Hjem | Exit: Info"
  hint_2: "Pinne: Side / Oppdater"
  hint_3: ""
  time_timezone: "Europe/Oslo"
  device:
    model: "Elecrow CrowPanel epaper"
    board: elecrow_crowpanel_epaper
    display_model: "4.20in-v1.2" # or "5.79in"
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    screen:
      width: ${screen_width}
      height: ${screen_height}

esphome:
  project:
    name: "Elecrow.CrowPanel"
    version: "1.0.0"

esp32:
# ESP32-S3-WROOM-1-N8R8@dual-core processor, main frequency 240MHz
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
    type: ${device.framework.type}

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0

wifi:
  enable_btm: true
  enable_rrm: true

#spi:
#  clk_pin: ${pin.int.spi.clk}
#  mosi_pin: ${pin.int.spi.mosi}

# https://github.com/ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2
external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2

display:
  - platform: crowpanel_epaper
    id: display_eink
    model: ${device.display_model | default("4.20in-v1.2")}
    clk_pin: ${pin.int.disp.clk}
    mosi_pin: ${pin.int.disp.mosi}
    cs_pin:
      number: ${pin.int.disp.cs}
      ignore_strapping_warning: true
    dc_pin:
      number: ${pin.int.disp.dc}
      ignore_strapping_warning: true
    reset_pin: ${pin.int.disp.reset}
    busy_pin: ${pin.int.disp.busy}
    full_update_every: 2
    auto_clear_enabled: false
    update_interval: never

binary_sensor:
  # Menu Button
  - platform: gpio
    id: button_menu
    pin:
      number: ${pin.btn.menu}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - logger.log: Menu Button Pressed
        - lvgl.page.show: ${epaper_home_page}
        - script.execute: update_screen
    name: Menu Button
    entity_category: diagnostic
  # Exit Button
  - platform: gpio
    id: button_exit
    pin:
      number: ${pin.btn.exit}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Exit Button Pressed
      - lvgl.page.show: page_info
      - script.execute: update_screen
    name: Exit Button
    entity_category: diagnostic

  # Stick Up
  - platform: gpio
    id: stick_up
    pin:
      number: ${pin.btn.stick.up}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Stick Up
      - lvgl.page.previous:
      - script.execute: update_screen
    name: Stick Up
    entity_category: diagnostic
  # Stick Press
  - platform: gpio
    id: stick_press
    pin:
      number: ${pin.btn.stick.press}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Stick Press
      - script.execute: update_screen
    name: Stick Press
    entity_category: diagnostic
  # Stick Down
  - platform: gpio
    id: stick_down
    pin:
      number: ${pin.btn.stick.down}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Stick Down
      - lvgl.page.next:
      - script.execute: update_screen
    name: Stick Down
    entity_category: diagnostic

switch:
  # Display power
  - platform: gpio
    id: epd_power
    pin: ${pin.int.disp.power}
    name: Display Power
    entity_category: config
    restore_mode: ALWAYS_ON
    internal: true

status_led:
  pin: ${pin.light.led}
