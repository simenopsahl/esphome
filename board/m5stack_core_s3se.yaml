labels: [esp32s3, psram, ILI9342, display, BM8563, microphone, speaker]
---
# https://docs.m5stack.com/en/core/M5CoreS3%20SE
# Base functions for:
# M5Stack Core S3SE
#
# https://community.home-assistant.io/t/m5stack-m5cores3-se-with-microwakeword/761965/5
# https://github.com/luka6000/wake-word-voice-assistants/blob/main/m5stack-coreS3-se/m5stack-coreS3-se-spk.yaml
# https://github.com/m5stack/esphome-yaml/blob/main/common/cores3-satellite-base.yaml

# Pins for this model
packages:
  pins: !include pins/m5stack_core_s3se.yaml

substitutions:
  screen_width: "320"
  screen_height: "240"
  time_timezone: "Europe/Oslo"
  mbus_i2c_shared: "false"
  module:
    internal:
      i2c_bus: i2c_internal
  device:
    model: "M5Stack Core S3 SE"
    rmt_symbols_block: 48
    rtc: "true"
    framework:
      type: esp-idf
    screen:
      width: ${screen_width}
      height: ${screen_height}
  feature:
    audio:
      volume_min: '0.4'
      volume_max: '0.8'
      boot_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_triple_press.flac

esphome:
  project:
    name: "M5Stack.Core S3 SE"
    version: "1.0.0"
  on_boot:
    - priority: 800
      then:
        - bm8563.read_time:
    - priority: 375
      then:
        # Safety net: if HA never connects.
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
    - priority: -100
      then:
        # Push the mic gain restored from flash into the ES7210. The codec boots
        # with `mic_gain` from audio_adc, so without this a saved value would show
        # in HA while the hardware sat at the default.
        - lambda: |-
            id(adc_es7210).set_mic_gain(id(mic_gain_db).state);
            ESP_LOGI("mic", "[MIC] restored ES7210 gain -> %.1f dB", id(mic_gain_db).state);
        # Diagnostics: an explicit OFF switch that silences the mic completely.
        # ON = microphone disabled. (This used to be inverted, so the mic was
        # stopped on every boot with the switch in its default OFF position.)
        - if:
            condition:
              switch.is_on: diag_disable_mic
            then:
              - logger.log: "Mic DISABLED for diagnostics"
              - microphone.stop_capture: i2s_mic
            else:
              - logger.log: "Mic enabled"

esp32:
# ESP32-S3@Xtensa LX7 Dual-Core, 240MHz
# PSRAM: 8MB Quad
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
    sdkconfig_options:
      # Cache optimizations for display graphics
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      # Memory allocation rules for graphics buffers
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
    type: ${device.framework.type}

psram:
  mode: quad
  speed: 80MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

api:
  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
    - lambda: id(init_in_progress) = false;
    # One-shot "ready" chime. It MUST run after micro_wake_word.start above: the
    # speaker is a slave to the mic's I2S clock, so playing before the mic is
    # capturing hangs the announcement (and then wake word stops working). The
    # flag is set first so an HA reconnect can't replay it.
    - if:
        condition:
          - lambda: 'return !id(boot_chime_done);'
          - switch.is_on: boot_sound
          - switch.is_off: diag_disable_mic
        then:
          - lambda: id(boot_chime_done) = true;
          - delay: 1s            # let the mic-master clock settle
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(boot_sound_custom);

logger:
  deassert_rts_dtr: true

globals:
  - id: mic_is_muted
    type: bool
    restore_value: no          # the switch forces OFF at boot (see on_client_connected)
    initial_value: 'false'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_chime_done
    type: bool
    restore_value: no
    initial_value: 'false'

time:
  - platform: bm8563
    i2c_id: ${module.internal.i2c_bus}
    id: time_rtc
    address: 0x51
    update_interval: never
  - id: !extend time_homeassistant
    on_time_sync:
      - then:
          - bm8563.write_time:

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}
  miso_pin: 
    number: ${pin.int.spi.miso}
    allow_other_uses: true

#i2c:
# Int
#  - id: i2c_internal
#    sda:
#      number: ${pin.int.i2c.sda}
#      allow_other_uses: ${mbus_i2c_shared}
#    scl:
#      number: ${pin.int.i2c.scl}
#      allow_other_uses: ${mbus_i2c_shared}
#    frequency: ${i2c_internal_frequency}
#    scan: true
# Ext PINs
#  - id: i2c_bus
#    sda: ${pin.ext.i2c.mbus.sda}
#    scl: ${pin.ext.i2c.mbus.scl}
#    frequency: 200kHz
#    scan: true

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [axp2101, aw88298, aw9523b]

# IO Expander
aw9523b:
  i2c_id: ${module.internal.i2c_bus}
  id: aw9523b_hub
  p0_drive_mode: PUSH_PULL
  interrupt_pin: ${pin.int.i2c.int}

# PMU
axp2101:
  id: axp2101_pmu
  i2c_id: ${module.internal.i2c_bus}

output:
  - platform: axp2101
    type: range
    channel: DLDO1
    id: backlight_output
    min_voltage: 2600
    max_voltage: 3300

  - platform: axp2101
    channel: ALDO1
    voltage: 1800

  - platform: axp2101
    channel: ALDO2
    voltage: 3300
  
  - platform: axp2101
    channel: BLDO1
    voltage: 2800
  
  - platform: axp2101
    channel: BLDO2
    voltage: 1500

#  - platform: axp2101
#    channel: DCDC1
#    voltage: 3300

#  - platform: axp2101
#    channel: DCDC3
#    voltage: 3300

light:
  # White
  - platform: monochromatic
    id: backlight_light
    output: backlight_output
    default_transition_length: 250ms
    restore_mode: RESTORE_AND_ON
    initial_state:
      state: on
      brightness: 25%
    name: "Backlight"
    entity_category: config
    # on_state:
    #   - lambda: |-
    #       uint8_t light;
    #       if (id(axp2101).read_byte(0x99, &light))
    #         id(backlight).turn_on().set_brightness( (( light << 5 ) - 641 ) /255 );

display:
  - platform: mipi_spi
    id: display_lcd
    model: ili9342
    cs_pin:
      number: ${pin.int.spi.disp.cs}
      ignore_strapping_warning: true
    dc_pin:
      number: ${pin.int.spi.disp.dc}
      allow_other_uses: true
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 9
    dimensions:
      height: ${device.screen.height}
      width: ${device.screen.width}
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    invert_colors: true
    auto_clear_enabled: false
    update_interval: 10s

touchscreen:
  - platform: ft63x6
    i2c_id: ${module.internal.i2c_bus}
    id: touchscreen_ft63x6
#    update_interval: 20ms
#    interrupt_pin:
#      aw9523b_id: aw9523b_hub
#      number: 10
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    on_touch:
      - then:
          - lambda: |-
                ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                    touch.x,
                    touch.y,
                    touch.x_raw,
                    touch.y_raw
                    );  
          - if:
              condition:
                - light.is_off: backlight_light
              then:
                - light.turn_on:
                    id: backlight_light
                    brightness: 40%
#    on_update:
#      - logger.log:
#          format: Touch %d at (%d, %d)
#          args: [ 'touch->id', 'touch->x', 'touch->y' ]

binary_sensor:
  - platform: touchscreen
    id: touch
    name: Touchscreen
    entity_category: diagnostic
    x_min: 0
    x_max: 320
    y_min: 0
    y_max: 240
  # some aw9523b inputs (handle interrupts)
  - platform: gpio
    name: "ES_INT P0_3"
    pin:
      aw9523b_id: aw9523b_hub
      number: 3
    on_press:
      then:
        - logger.log: "ES7210 interrupt triggered"
    internal: true
  - platform: gpio
    name: "TF_SW P0_4"
    pin:
      aw9523b_id: aw9523b_hub
      number: 4 
    on_press:
      then:
        - logger.log: "TF_SW interrupt triggered"
    internal: true
  - platform: gpio
    name: "TOUCH_INT P1_2"
    pin:
      aw9523b_id: aw9523b_hub
      number: 10
    on_press:
      then:
        - logger.log: "TOUCH interrupt triggered"
    internal: true
  - platform: gpio
    name: "AW_INT P1_3"
    pin:
      aw9523b_id: aw9523b_hub
      number: 11
    on_press:
      then:
        - logger.log: "AW88298 interrupt triggered"
    internal: true

sensor:
  - platform: sound_level
    id: sound_level_sensor
    passive: false
    measurement_duration: 3000ms
    rms:
      name: "Noise Level"
      id: average_loudness
      filters:
        - offset: 100.0

switch:
  - platform: gpio
    id: sw_bus_out_en
    name: "BUS_OUT_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 1
    # BUS_OUT_EN = 1
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: gpio
    id: sw_usb_otg_en
    name: "USB_OTG_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 5
    # USB_OTG_EN = 0
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    disabled_by_default: true

  - platform: gpio
    id: sw_boost_en
    name: "BOOST_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 15
    # BOOST_EN = 1
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: template
    id: diag_disable_mic
    name: "Diag: disable microphone"
    icon: mdi:microphone-settings
    internal: true                      # diagnostic-only, not shown in HA
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # OFF = mic works as usual
    # These triggers also fire during setup() when the state is restored from
    # flash - at setup_priority HARDWARE-2, i.e. before the mic and mWW exist.
    # on_boot (priority -100) applies the restored state once everything is up,
    # so here we only handle a live toggle.
    on_turn_on:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - microphone.stop_capture: i2s_mic
    on_turn_off:
      - if:
          condition:
            - lambda: return !id(init_in_progress);
            - switch.is_off: mic_mute_switch
          then:
            - microphone.capture: i2s_mic

  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: mdi:microphone-off
    entity_category: config
    # State comes from the lambda below, so restore_mode would be a no-op here.
    # The mute is forced off at boot by the voice_assistant on_client_connected.
    lambda: |-
      return id(mic_is_muted);
    # A real mute, via ESPHome's own primitive: microphone.mute makes the
    # Microphone hand every consumer a zero-filled buffer, so the wake word
    # literally hears silence. The stream keeps running, so there is no I2S
    # restart and no start/stop race.
    #
    # The previous implementation dropped the ES7210 gain to 0.0f - but 0 dB is
    # UNITY gain, not silence. The mic kept hearing the room and only the wake
    # word handler ignored it.
    turn_on_action:
      - lambda: id(mic_is_muted) = true;
      - microphone.mute: i2s_mic
    turn_off_action:
      - lambda: id(mic_is_muted) = false;
      - microphone.unmute: i2s_mic

  - platform: template
    id: boot_sound
    name: Boot sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: sound_level_enabled
    optimistic: true
    restore_mode: ALWAYS_ON
    name: "Sound Level Tracking"
    icon: "mdi:waveform"
    entity_category: config
    on_turn_off:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - sound_level.stop: sound_level_sensor
    on_turn_on:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - sound_level.start: sound_level_sensor

i2s_audio:
  - id: i2s_input
    i2s_mclk_pin:
      number: ${pin.audio.i2s_mclk}
      ignore_strapping_warning: true
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true
  - id: i2s_output
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true

audio_dac:
  - platform: aw88298
    i2c_id: ${module.internal.i2c_bus}
    id: dac_aw88298
    sample_rate: 48000

audio_adc:
  - platform: es7210
    i2c_id: ${module.internal.i2c_bus}
    id: adc_es7210
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_input
    id: i2s_mic
    i2s_din_pin: ${pin.audio.mic}
    bits_per_sample: 16bit
    channel: left
    adc_type: external

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_output
    i2s_mode: secondary
    id: i2s_speaker
    dac_type: external
    i2s_dout_pin: ${pin.audio.i2s_dout}
    audio_dac: dac_aw88298
    buffer_duration: 100ms

  # Mixes the announcement and media pipelines into the one physical output.
  # Mono: the board has a single speaker (mono ES8311 + NS4150B), so a second
  # channel would just be discarded.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # The mixer needs both inputs at one sample rate; these resample if needed.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    id: speaker_media_player
    name: None
    internal: False
    task_stack_in_psram: True
    volume_increment: 0.01
    volume_min: ${feature.audio.volume_min}
    volume_max: ${feature.audio.volume_max}
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC              # cheapest codec for the S3
      num_channels: 1           # stereo is pointless for announcements
      sample_rate: 48000        # what Music Assistant serves
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1           # mono hardware, one speaker
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            - not:
                media_player.is_announcing:
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
    files:
      - id: boot_sound_custom
        file: ${feature.audio.boot_sound_file}

number:
  - platform: template
    id: mic_gain_db
    name: "Mic gain (ES7210)"
    icon: mdi:microphone-settings
    entity_category: config
    unit_of_measurement: dB
    min_value: 0
    # The ES7210 gain register moves in 3 dB steps up to 33 dB (then 34.5, 36
    # and 37.5), so a finer slider step would leave every second position a
    # no-op. 36 dB is the highest value that sits on the 3 dB grid.
    max_value: 36
    step: 3
    restore_value: true
    initial_value: 24
    mode: slider
    # Without `optimistic`, a template number with only a set_action never
    # publishes the new value back: the slider snapped back to 24 dB in HA even
    # though the ES7210 had already been reprogrammed. The restored value is
    # applied to the codec in on_boot (-100), since TemplateNumber::setup() only
    # publishes it and does not run set_action.
    optimistic: true
    set_action:
      - lambda: |-
          id(adc_es7210).set_mic_gain(x);
      - logger.log:
          format: "[MIC] ES7210 gain -> %.1f dB"
          args: ["x"]

script:
  # ESPHome 2026.10 made audio files const; 2026.8/2026.9 still take a mutable
  # pointer in play_file(). A const parameter accepts both, and the const_cast
  # below keeps play_file() compiling on either. The type is spelled with
  # add_const_t because script parameter types may not contain spaces.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: "std::add_const_t<audio::AudioFile>*"
    then:
      - lambda: |-
          if (priority) {
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(speaker_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(speaker_media_player)->play_file(const_cast<audio::AudioFile *>(sound_file), true, false);
          }