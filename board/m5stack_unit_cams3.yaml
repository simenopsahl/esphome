labels: [camera, i2c]
---
# https://docs.m5stack.com/en/unit/Unit-CAMS3%205MP
# https://docs.m5stack.com/en/homeassistant/camera/unit_cams3_5mp

# UNIT CamS3-5MP
# Pins for this model
packages:
  pins: !include pins/m5stack_unit_cams3.yaml
  i2c: !include extension/internal_i2c.yaml

substitutions:
  device:
    model: "M5Stack Unit CamS3"
    rmt_symbols_block: 48
    framework:
      type: esp-idf
  extension:
    i2c:
      internal:
        frequency: 200kHz

esphome:
  project:
    name: "M5Stack.Unit CamS3"
    version: "1.0.0"

esp32:
# ESP32-S3-WROOM-1-N16R8
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  watchdog_timeout: 15s
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
      enable_idf_experimental_features: true
      loop_task_stack_size: 16384
      assertion_level: DISABLE
      enable_lwip_assert : false
    type: ${device.framework.type}
    sdkconfig_options:
      # Caching Optimizations
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      
      # PSRAM Integrations
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      
      # TLS and Logging
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_LOG_DEFAULT_LEVEL: "0"  # prevents "ESP-IDF" Guru Meditation Error
      
      # Camera Specifics
      CONFIG_CAMERA_TASK_STACK_SIZE: "8192"

psram:
  mode: octal
  speed: 80MHz

wifi:
  output_power: 10dB
  power_save_mode: light
  use_psram: true
  enable_btm: true
  enable_rrm: true

ota:
  allow_partition_access: true

preferences:
  flash_write_interval: 30min

logger:
  logs:
    i2s_audio: ERROR
    microphone: ERROR
    esp32_camera: DEBUG

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}
  miso_pin: ${pin.int.spi.miso}

esp32_camera:
  i2c_id: i2c_internal
  id: espcam
  # PINS
  external_clock:
    pin: ${pin.cam.m_clk}
    frequency: 8MHz
  data_pins:
    - ${pin.cam.y2}
    - ${pin.cam.y3}
    - ${pin.cam.y4}
    - ${pin.cam.y5}
    - ${pin.cam.y6}
    - ${pin.cam.y7}
    - ${pin.cam.y8}
    - ${pin.cam.y9}
  vsync_pin: ${pin.cam.vs}
  href_pin: ${pin.cam.hs}
  pixel_clock_pin: ${pin.cam.p_clk}
  reset_pin: ${pin.cam.reset}
  # Metadata
  name: "Camera PY260"
  # Image settings
  resolution: 640x480
  jpeg_quality: 20
  max_framerate: 2 fps
  frame_buffer_count: 1 # defaults to 1
#  vertical_flip: true
#  horizontal_mirror: true
  # Exposure
  aec_mode: auto
  aec2: true # defaults to false
  ae_level: 2
  agc_gain_ceiling: 8x
  # White balance
  wb_mode: auto

# Enable status LED
status_led:
  pin: ${pin.light.led}

sensor:
  # - platform: sound_level
  #   id: sound_level_sensor
  #   passive: false
  #   measurement_duration: 2000ms
  #   rms:
  #     name: "PDM Noise Level"
  #     id: pdm_average_loudness
  #     filters:
  #       - multiply: -1
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    update_interval: 5s
    entity_category: diagnostic

