labels: [esp32s3, psram, ST7789P3, microphone]
---
# Base functions for:
# M5Stack StickS3
#

# Pins for this model
packages:
  pins: !include pins/m5stack_stick_s3.yaml
# Limit of 2 i2c buses on ESP32-S3, one already used for M5PM1 (and IMU)
# Include Grove *OR* HAT i2c in top level config
  i2c_int: !include extension/internal_i2c.yaml
  imu: !include module/chip_imu_bmi270.yaml

substitutions:
  hat_shared: "false"
  grove_shared: "false"
  device:
    model: "M5Stack StickS3"
    rmt_symbols_block: 48
    framework:
      type: esp-idf

esphome:
  project:
    name: "M5Stack.StickS3"
    version: "1.0.0"
  on_boot:
    - priority: 1200
      then:
        - lambda: |-
            // 1. Configure the new ESP-IDF v5 Master Bus
            i2c_master_bus_config_t bus_config = {};
            bus_config.i2c_port = -1; // Auto-allocate a free hardware port
            bus_config.sda_io_num = GPIO_NUM_47;
            bus_config.scl_io_num = GPIO_NUM_48;
            bus_config.clk_source = I2C_CLK_SRC_DEFAULT;
            bus_config.glitch_ignore_cnt = 7;
            bus_config.flags.enable_internal_pullup = true;

            i2c_master_bus_handle_t bus_handle;
            if (i2c_new_master_bus(&bus_config, &bus_handle) != ESP_OK) return;

            // 2. Add the PMIC device to the bus
            i2c_device_config_t dev_config = {};
            dev_config.dev_addr_length = I2C_ADDR_BIT_LEN_7;
            dev_config.device_address = 0x6E;
            dev_config.scl_speed_hz = 100000;

            i2c_master_dev_handle_t dev_handle;
            if (i2c_master_bus_add_device(bus_handle, &dev_config, &dev_handle) != ESP_OK) {
              i2c_del_master_bus(bus_handle);
              return;
            }

            // 3. Helper function for Read-Modify-Write using driver_ng
            auto update_reg = [&](uint8_t reg, uint8_t set_bits, uint8_t clear_bits) {
                uint8_t val = 0;
                if (i2c_master_transmit_receive(dev_handle, &reg, 1, &val, 1, 1000) == ESP_OK) {
                    val |= set_bits;
                    val &= ~clear_bits;
                    uint8_t write_buf[2] = {reg, val};
                    i2c_master_transmit(dev_handle, write_buf, 2, 1000);
                }
            };

            // --- STEP 1: Enable 5V Boost (Register 0x06, Bit 3) ---
            update_reg(0x06, 0x08, 0x00);
            
            // --- STEP 2: Configure PMIC GPIO2 for L3B_EN ---
            update_reg(0x10, 0x04, 0x00); // Set Output Mode
            update_reg(0x13, 0x00, 0x04); // Set Push-Pull
            update_reg(0x11, 0x04, 0x00); // Drive HIGH

            // 4. Safely destroy the v5 hardware handle to completely free the port!
            i2c_master_bus_rm_device(dev_handle);
            i2c_del_master_bus(bus_handle);
            
            // Allow 150ms for the Grove/HAT sensor and L3B rail to boot and release the SCL lines
            vTaskDelay(pdMS_TO_TICKS(150));

esp32:
# ESP32-S3-PICO-1-N8R8 @ Dual-core processor, up to 240MHz
# PSRAM: 8MB Octal
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      # Memory allocation rules for display buffers
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
    type: ${device.framework.type}

psram:
  mode: octal
  speed: 80MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

logger:
  logs:
    remote_receiver: DEBUG
    remote_transmitter: DEBUG
    infrared: DEBUG

# https://github.com/ccsmart/M5SS3-esphome
# external_components:
#   - source:
#       type: local
#       path: components
#     components: [ m5pm1 ]

# m5pm1:
#   id: pmic_m5pm1
#   i2c_id: i2c_internal
#   address: 0x6E
#   update_interval: 30s
#   battery_voltage:
#     id: m5pm1_battery_volt
#     name: "M5PM1 Battery Voltage"
#     entity_category: diagnostic
#     disabled_by_default: true
#   on_battery:
#     id: m5pm1_onbattery
#     name: "M5PM1 On Battery"
#     entity_category: diagnostic
#     disabled_by_default: true
#   on_usb:
#     id: m5pm1_onusb
#     name: "M5PM1 On USB"
#     entity_category: diagnostic
#     disabled_by_default: true

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}

# I2S Bus Configuration
i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin: ${pin.audio.i2s_lrclk}
  i2s_bclk_pin: ${pin.audio.i2s_bclk}
  i2s_mclk_pin: ${pin.audio.i2s_mclk}

output:
  # TFT Backlight
  - platform: ledc
    id: backlight_output
    pin: ${pin.light.disp_bl}

light:
  # TFT Backlight
  - platform: monochromatic
    output:  backlight_output
    id: backlight_light
    default_transition_length: 100ms
    restore_mode: RESTORE_AND_ON
    initial_state:
      state: on
      brightness: 25%
    name: "Backlight"
    entity_category: config

# 1.14 inch, 135*240 Colorful TFT LCD, ST7789P3
display:
  - platform: mipi_spi
    id: display_lcd
    model: st7789v
    cs_pin: ${pin.int.spi.disp.cs}
    dc_pin:
      number: ${pin.int.spi.disp.dc}
      ignore_strapping_warning: true
    reset_pin: ${pin.int.spi.disp.rst}
    dimensions:
      height: 240
      width: 135
      offset_height: 40
      offset_width: 52
    invert_colors: true
    auto_clear_enabled: false
    update_interval: 10s

audio_dac:
  - platform: es8311
    i2c_id: ${module.internal.i2c_bus}
    id: dac_es8311
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    id: i2s_mic
    i2s_din_pin: ${pin.audio.mic}
    bits_per_sample: 16bit
    sample_rate: 16000
    adc_type: external

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    id: i2s_speaker
    i2s_dout_pin: ${pin.audio.i2s_dout}
    dac_type: external
    audio_dac: dac_es8311
    use_apll: true
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo

media_player:
  - platform: speaker
    name: "StickS3 Player"
    id: stick_s3_player
    volume_initial: 0.1
    volume_max: 0.6
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: i2s_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1

binary_sensor:
  # Side Button
  - platform: gpio
    id: button_side
    pin:
      number: ${pin.btn.side}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Side Button Pressed
    name: Side Button
    entity_category: diagnostic
  # Front Button
  - platform: gpio
    id: button_front
    pin:
      number: ${pin.btn.front}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Front Button Pressed
    name: Front Button
    entity_category: diagnostic

sensor:
  - platform: sound_level
    id: sound_level_sensor
    passive: false
    measurement_duration: 1250ms
    rms:
      name: "Noise Level"
      id: average_loudness
      filters:
        - multiply: -1

switch:
  - platform: template
    id: mic_mute
    name: Microphone Mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
        - microphone.unmute:
    on_turn_on:
        - microphone.mute:

remote_transmitter:
  id: ir_tx
  pin:
    number: ${pin.light.ir.tx}
    ignore_strapping_warning: true
  carrier_duty_percent: 50%
  rmt_symbols: ${device.rmt_symbols_block}

remote_receiver:
  id: ir_rx
  pin: ${pin.light.ir.rx}
  rmt_symbols: ${device.rmt_symbols_block}
  dump: raw

# Infrared platform — creates infrared entities
infrared:
  - platform: ir_rf_proxy
    name: IR Transmitter
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: IR Receiver
    receiver_frequency: 38kHz
    remote_receiver_id: ir_rx

