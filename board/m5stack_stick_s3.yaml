labels: [esp32s3, psram, ST7789P3, microphone]
---
# Base functions for:
# M5Stack StickS3
#

# Pins for this model
packages:
  pins: !include pins/m5stack_stick_s3.yaml
# Limit of 2 i2c buses on ESP32-S3, one already used for M5PM1 (and IMU)
# Include Grove *OR* HAT i2c in top level config
  i2c_int: !include extension/internal_i2c.yaml
  imu: !include module/chip_imu_bmi270.yaml

substitutions:
  screen_width: "135"
  screen_height: "240"
  hat_shared: "false"
  grove_shared: "false"
  device:
    model: "M5Stack StickS3"
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    psram: "true"
    screen:
      width: ${screen_width}
      height: ${screen_height}
  feature:
    audio:
      volume_min: '0.4'
      volume_max: '0.8'
      boot_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_triple_press.flac


esphome:
  project:
    name: "M5Stack.StickS3"
    version: "1.0.0"
  on_boot:
    - priority: 1200
      then:
        - lambda: |-
            // 1. Configure the new ESP-IDF v5 Master Bus
            i2c_master_bus_config_t bus_config = {};
            bus_config.i2c_port = -1; // Auto-allocate a free hardware port
            bus_config.sda_io_num = GPIO_NUM_47;
            bus_config.scl_io_num = GPIO_NUM_48;
            bus_config.clk_source = I2C_CLK_SRC_DEFAULT;
            bus_config.glitch_ignore_cnt = 7;
            bus_config.flags.enable_internal_pullup = true;

            i2c_master_bus_handle_t bus_handle;
            if (i2c_new_master_bus(&bus_config, &bus_handle) != ESP_OK) return;

            // 2. Add the PMIC device to the bus
            i2c_device_config_t dev_config = {};
            dev_config.dev_addr_length = I2C_ADDR_BIT_LEN_7;
            dev_config.device_address = 0x6E;
            dev_config.scl_speed_hz = 100000;

            i2c_master_dev_handle_t dev_handle;
            if (i2c_master_bus_add_device(bus_handle, &dev_config, &dev_handle) != ESP_OK) {
              i2c_del_master_bus(bus_handle);
              return;
            }

            // 3. Helper function for Read-Modify-Write using driver_ng
            auto update_reg = [&](uint8_t reg, uint8_t set_bits, uint8_t clear_bits) {
                uint8_t val = 0;
                if (i2c_master_transmit_receive(dev_handle, &reg, 1, &val, 1, 1000) == ESP_OK) {
                    val |= set_bits;
                    val &= ~clear_bits;
                    uint8_t write_buf[2] = {reg, val};
                    i2c_master_transmit(dev_handle, write_buf, 2, 1000);
                }
            };

            // --- STEP 1: Enable 5V Boost (Register 0x06, Bit 3) ---
            update_reg(0x06, 0x08, 0x00);
            
            // --- STEP 2: Configure PMIC GPIO2 for L3B_EN ---
            update_reg(0x10, 0x04, 0x00); // Set Output Mode
            update_reg(0x13, 0x00, 0x04); // Set Push-Pull
            update_reg(0x11, 0x04, 0x00); // Drive HIGH

            // 4. Safely destroy the v5 hardware handle to completely free the port!
            i2c_master_bus_rm_device(dev_handle);
            i2c_del_master_bus(bus_handle);
            
            // Allow 150ms for the Grove/HAT sensor and L3B rail to boot and release the SCL lines
            vTaskDelay(pdMS_TO_TICKS(150));
    - priority: 375
      then:
        # Safety net: if HA never connects.
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
    - priority: -100
      then:
        # Diagnostics: an explicit OFF switch that silences the mic completely.
        # ON = microphone disabled. (This used to be inverted, so the mic was
        # stopped on every boot with the switch in its default OFF position.)
        - if:
            condition:
              switch.is_on: diag_disable_mic
            then:
              - logger.log: "Mic DISABLED for diagnostics"
              - microphone.stop_capture: i2s_mic
            else:
              - logger.log: "Mic enabled"

esp32:
# ESP32-S3-PICO-1-N8R8 @ Dual-core processor, up to 240MHz
# PSRAM: 8MB Octal
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      # Memory allocation rules for display buffers
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
    type: ${device.framework.type}

psram:
  mode: octal
  speed: 80MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

api:
  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
    - lambda: id(init_in_progress) = false;
    # One-shot "ready" chime. It MUST run after micro_wake_word.start above: the
    # speaker is a slave to the mic's I2S clock, so playing before the mic is
    # capturing hangs the announcement (and then wake word stops working). The
    # flag is set first so an HA reconnect can't replay it.
    - if:
        condition:
          - lambda: 'return !id(boot_chime_done);'
          - switch.is_on: boot_sound
          - switch.is_off: diag_disable_mic
        then:
          - lambda: id(boot_chime_done) = true;
          - delay: 1s            # let the mic-master clock settle
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(boot_sound_custom);

logger:
  logs:
    remote_receiver: DEBUG
    remote_transmitter: DEBUG
    infrared: DEBUG

globals:
  - id: mic_is_muted
    type: bool
    restore_value: no          # the switch forces OFF at boot (see on_client_connected)
    initial_value: 'false'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_chime_done
    type: bool
    restore_value: no
    initial_value: 'false'

