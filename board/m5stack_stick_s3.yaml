labels: [esp32s3, psram, ST7789P3, microphone]
---
# Base functions for:
# M5Stack StickS3
#

# Pins for this model
packages:
  pins: !include pins/m5stack_stick_s3.yaml
# Limit of 2 i2c buses on ESP32-S3, one already used for M5PM1 (and IMU)
# Include Grove *OR* HAT i2c in top level config
  i2c_int: !include extension/internal_i2c.yaml
  imu: !include module/chip_imu_bmi270.yaml
  audio: !include
    file: module/audio/${feature.audio.hardware_module | default("m5stack_stick_s3_audio.yaml")}
    condition: ${feature_audio_enabled | default("false")}

substitutions:
  screen_width: "135"
  screen_height: "240"
  hat_shared: "false"
  grove_shared: "false"
  device:
    model: "M5Stack StickS3"
    board: m5stack_stick_s3
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    psram: "true"
    screen:
      width: ${screen_width}
      height: ${screen_height}
  feature:
    audio:
      hardware_module: m5stack_stick_s3_audio.yaml


esphome:
  project:
    name: "M5Stack.StickS3"
    version: "1.0.0"
  # Note: M5PM1 hub initializes at setup_priority::BUS - 1.0f (999.0f),
  # enabling 5V Boost and L3B (GPIO2) rails before hardware sensors probe I2C.

esp32:
# ESP32-S3-PICO-1-N8R8 @ Dual-core processor, up to 240MHz
# PSRAM: 8MB Octal
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      # Memory allocation rules for display buffers
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
    type: ${device.framework.type}

psram:
  mode: octal
  speed: 80MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

logger:
  logs:
    remote_receiver: WARN
    remote_transmitter: INFO
    infrared: INFO

# M5PM1 PMIC (Power Management IC)
external_components:
  - source:
      type: local
      path: components
    components: [ m5pm1 ]

m5pm1:
  id: pmic_m5pm1
  i2c_id: ${module.internal.i2c_bus}
  address: 0x6E
  charge: true
  dcdc: true
  ldo: true
  boost: true
  l3b: true

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}

output:
  # TFT Backlight
  - platform: ledc
    id: backlight_output
    pin: ${pin.light.disp_bl}

light:
  # TFT Backlight
  - platform: monochromatic
    output:  backlight_output
    id: backlight_light
    default_transition_length: 100ms
    restore_mode: RESTORE_AND_ON
    initial_state:
      state: on
      brightness: 25%
    name: "Backlight"
    entity_category: config

# 1.14 inch, 135*240 Colorful TFT LCD, ST7789P3
display:
  - platform: mipi_spi
    id: display_lcd
    model: st7789v
    cs_pin: ${pin.int.spi.disp.cs}
    dc_pin:
      number: ${pin.int.spi.disp.dc}
    reset_pin: ${pin.int.spi.disp.rst}
    dimensions:
      height: ${device.screen.height}
      width: ${device.screen.width}
      offset_height: 40
      offset_width: 52
    invert_colors: true
    auto_clear_enabled: false
    update_interval: 10s

binary_sensor:
  # M5PM1 External Power Status
  - platform: m5pm1
    type: external_power
    name: "M5PM1 On USB"
    entity_category: diagnostic

  # Side Button
  - platform: gpio
    id: button_side
    pin:
      number: ${pin.btn.side}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Side Button Pressed
    name: Side Button
    entity_category: diagnostic
  # Front Button
  - platform: gpio
    id: button_front
    pin:
      number: ${pin.btn.front}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Front Button Pressed
    name: Front Button
    entity_category: diagnostic

sensor:
  # M5PM1 Sensors
  - platform: m5pm1
    type: battery_voltage
    name: "M5PM1 Battery Voltage"
    entity_category: diagnostic
    update_interval: 30s
    force_update: true
  - platform: m5pm1
    type: vin_voltage
    name: "M5PM1 VIN Voltage"
    entity_category: diagnostic
    update_interval: 30s
    force_update: true
  - platform: m5pm1
    type: temperature
    name: "M5PM1 Temperature"
    entity_category: diagnostic
    update_interval: 30s
    disabled_by_default: true
    force_update: true

remote_transmitter:
  id: ir_tx
  pin:
    number: ${pin.light.ir.tx}
    ignore_strapping_warning: true
  carrier_duty_percent: 50%
  rmt_symbols: ${device.rmt_symbols_block}

remote_receiver:
  id: ir_rx
  pin: ${pin.light.ir.rx}
  rmt_symbols: ${device.rmt_symbols_block}

# Infrared platform — creates infrared entities
infrared:
  - platform: ir_rf_proxy
    name: IR Transmitter
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: IR Receiver
    receiver_frequency: 38kHz
    remote_receiver_id: ir_rx

#motion:
#  - id: !extend motion_bmi270
#    axis_map:
#      x: y
#      y: "-x"
#      z: z

text_sensor:
  - platform: m5pm1
    type: power_source
    name: "M5PM1 Power Source"
    entity_category: diagnostic
