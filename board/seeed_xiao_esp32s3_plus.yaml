labels: [esp32s3, psram]
---

# Pins for this model
packages:
  pins: !include pins/seeed_xiao_esp32s3_plus.yaml
  i2c: !include extension/internal_i2c.yaml

substitutions:
  device:
    model: "Seeed XIAO ESP32S3 Plus"
    rmt_symbols_block: 48
    framework:
      type: esp-idf
  extension:
    i2c:
      internal:
        frequency: 200kHz
  module:
    camera:
      pixel_format: JPEG
      resolution: 800x600
      jpeg_quality: 20
      max_framerate: 2fps
      idle_framerate: 0.1fps
      agc_gain_ceiling: 64x
      wb_mode: auto

esp32:
# ESP32-S3 WROOM N16R8
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  watchdog_timeout: 10s
  framework: 
    type: ${device.framework.type}
    advanced:
      compiler_optimization: PERF
      enable_idf_experimental_features: true
      execute_from_psram: true
      loop_task_stack_size: 16384
      assertion_level: DISABLE
      enable_lwip_assert : false
    sdkconfig_options:
      # Caching Optimizations
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      
      # PSRAM Integrations
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      
      # TLS and Logging
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_LOG_DEFAULT_LEVEL: "0"  # prevents "ESP-IDF" Guru Meditation Error
      
      # Camera Specifics
      CONFIG_CAMERA_TASK_STACK_SIZE: "8192"

esphome:
  project:
    name: "Seeed.XIAO ESP32-S3 Plus"
    version: "1.0.0"

psram:
  mode: octal
  speed: 80MHz

wifi:
  output_power: 10dB
  power_save_mode: light
  use_psram: true
  enable_btm: true
  enable_rrm: true

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}

status_led:
  pin: ${pin.light.led}

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    update_interval: 5s
    entity_category: diagnostic