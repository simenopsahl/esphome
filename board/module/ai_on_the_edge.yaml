---
# https://github.com/nliaudat/esphome_ai_component

substitutions:
  module:
    ai_on_the_edge:
      # camera
      camera:
        flash_light: flash_light
        # NOTE: OV2640 + ESP32 camera driver cannot reliably do grayscale AND windowing at the same time.
        # Using JPEG pixel format with the camera; grayscale conversion is done in software by the ImageProcessor
        # when a grayscale model (model_channels == 1) is loaded.
        pixel_format: JPEG  # (cropping implementation is faster with RGB888 format) | Displays: RGB565, RGB888 | Cameras: YUV422, YUV420, RAW | Efficiency: Grayscale, YUV420, JPEG
        ### windowing not available natively in grayscale mode (OV2640) due to driver limitations. The image is forced JPEG and then converted to grayscale in software by the ImageProcessor
        # pixel_format: GRAYSCALE
        resolution: 640x480  # 800x600 #640x480 #https://esphome.io/components/esp32_camera.html
        # jpeg_quality: 10 # From 10 (best) to 63 (worst). | Must be 0 if non JPEG
        jpeg_quality: 20
        max_framerate: 1fps
        idle_framerate: 0.1fps
        agc_gain_ceiling: 8x
        wb_mode: auto
      # Meter settings
      meter:
        # Unit of measurement for the meter (e.g. m³, kWh, L)
        unit: m³
        # device class for the meter (e.g. water, energy, gas)
        device_class: water
        # state class for the meter (e.g. total_increasing, total, measurement)
        state_class: total_increasing
        last_valid_value: "000016909"
      time:
        reboot_days_of_week: MON
        reboot_hours: 5
        reboot_minutes: 0
        reboot_seconds: 0

packages:
  # Component-specific controls (comment to disable individual controls)
  - !include ai_on_the_edge/components/esp32_camera_utils_controls.yaml
  - !include ai_on_the_edge/components/flash_light_controller_controls.yaml
  - !include ai_on_the_edge/components/meter_reader_tflite_controls.yaml
  - !include ai_on_the_edge/components/value_validator_controls.yaml
  # Debug sensors
  - !include ai_on_the_edge/debug_board.yaml
  # camera configs
  - !include ai_on_the_edge/camera_options.yaml
  - !include ai_on_the_edge/esp32_camera.yaml
  - !include ai_on_the_edge/camera_webserver.yaml # generate_preview must be set to true if used

preferences:
  flash_write_interval: 60min

ota:
  allow_partition_access: true

esphome:
  on_boot:
    - priority: 999.0
      then:
        - delay: 500ms
  on_loop:
    - lambda: |-
          if (id(global_espcam_updated)) {
            id(espcam).update_camera_parameters();
            if(id(global_debug)) { id(espcam).dump_config(); }
            id(global_espcam_updated) = false;
          }
  build_flags:
    - "-DBOARD_HAS_PSRAM"
    - "-DTF_LITE_STATIC_MEMORY"  # for tflite micro
    - "-DTF_LITE_DISABLE_X86_NEON"  #for tflite micro
    - "-DMAX_OPERATORS=25"  #default is 30
    - "-DESP_NN"  #use hardware acceleration : https://github.com/espressif/esp-nn (only if using tflite)

# time:
#   - platform: sntp
#     timezone: ${time_timezone}
#     servers: [0.pool.ntp.org, 1.pool.ntp.org, 2.pool.ntp.org]
#     on_time:
#       - seconds: ${time.reboot_seconds}
#         minutes: ${time.reboot_minutes}
#         hours: ${time.reboot_hours}
#         days_of_week: ${time.reboot_days_of_week}
#         then:
#           - button.press: button_restart

api:
  max_send_queue: 20
  batch_delay: 150ms
  reboot_timeout: 0

external_components:
  - source: github://nliaudat/esphome_ai_component
    components:
      # Choose the reader type you need:
      - meter_reader_tflite   # AI-powered digit recognition
      # - ssocr_reader        # Seven-segment OCR (no AI)
      # - analog_reader       # Analog gauge/dial reader (no AI)

      # Supporting components:
      - value_validator       # Validation engine (recommended)
      - tflite_micro_helper   # Required for meter_reader_tflite
      - esp32_camera_utils    # Image processing utilities
      - flash_light_controller
      # - data_collector        # Optional: For collecting training data

# Enable logging
logger:
  logs:
    esp32_camera: INFO
    meter_reader_tflite: DEBUG
    ModelHandler: DEBUG
    ImageProcessor: DEBUG
    tflite_coordinator: DEBUG
    value_validator: DEBUG
    internal_temperature: ERROR
    internal_temperature.esp32: ERROR

globals:
  # the debug parameter determines whether a config dump is done after making changes
  # this is helpful when doing initial setup, but once everything is working, I turn it off
  - id: global_debug
    type: bool
    initial_value: 'true'
  # value to track if camera parameters have been changed
  #   used to trigger the loop() code inserted in 'esphome' section above
  - id: global_espcam_updated
    type: bool
    initial_value: 'false'

  - id: global_crop_zones
    type: std::string
    max_restore_data_length: 254
    # Blank
    initial_value: "\"[]\""
    # Note: The outer quotes are escaped with single quotes + double quotes ("...")

    # 800x600 numbers
#    initial_value: '"[[3,8,49,90],[49,8,93,90],[94,9,138,90],[141,10,186,91],[189,12,233,91],[236,11,279,91],[285,12,326,91],[331,13,373,91],[378,15,422,92]]"'
    
    # 1024x768 numbers
#    initial_value: '"[[3,8,49,90],[49,8,93,90],[94,9,138,90],[141,10,186,91],[189,12,233,91],[236,11,279,91],[285,12,326,91],[331,13,373,91],[378,15,422,92]]"'

tflite_micro_helper:
  debug: false

esp32_camera_utils:
  id: component_espcam_utils
  camera_id: espcam
  debug: false
  ### zoom available for OV2640, OV3660, OV5640, SC101IOT, SC030IOT from crop zones (explicit)
  ### windowing not available natively in grayscale mode (OV2640) due to driver limitations. The image is forced JPEG and then converted to grayscale in software by the ImageProcessor

  # 800x600 crop zone
#  camera_window:
#    offset_x: 480 # multiple of 4
#    offset_y: 500 # multiple of 4
#    width: 432 # multiple of 8
#    height: 104 # multiple of 8

  # 1024x768 crop zone
#  camera_window:
#    offset_x: 464 # multiple of 4
#    offset_y: 488 # multiple of 4
#    width: 440 # multiple of 8
#    height: 104 # multiple of 8
#  camera_window:
#    offset_x: 288 # multiple of 4
#    offset_y: 312 # multiple of 4
#    width: 288 # multiple of 8
#    height: 72 # multiple of 8

  # 1600x1200 crop zone
#  camera_window:
#    offset_x: 464 # multiple of 4
#    offset_y: 488 # multiple of 4
#    width: 440 # multiple of 8
#    height: 112 # multiple of 8

  enable_rotation: false
  # rotation: 270 # 0, 90, 180, 270 (special case built-in "accelerated" for 90, 180, 270 )

  enable_scaler: false
  # scaler:
  #   width: 640
  #   height: 480

  enable_cropper: false
  # cropper:
  #   width: 320
  #   height: 240
  #   offset_x: 0
  #   offset_y: 0
  
  enable_drawing: true # enable drawing subsystem,
  # needed if 
  #meter_reader_tflite:
  #  generate_preview: true
  #  +
  #  show_crop_areas: true

  debug_memory: false

# optional : flash light at taking image
flash_light_controller:
  id: component_flash_controller
  flash_light: ${module.ai_on_the_edge.camera.flash_light}
  flash_pre_time: 19000ms # 19 seconds before update (time to stabilize)
  flash_post_time: 1000ms # 1 second after update
  debug: false

value_validator:
  id: component_value_validator
  validated_value_sensor:
    id: sensor_last_valid_reading
    name: "Water Meter Reading"
    unit_of_measurement: "${module.ai_on_the_edge.meter.unit}"
    accuracy_decimals: 3
    icon: mdi:water-pump
    state_class: ${module.ai_on_the_edge.meter.state_class}
    device_class: ${module.ai_on_the_edge.meter.device_class}
    filters:
      # Converts the raw 12058 into 12.058
      - multiply: 0.001
      # Prevents the AI from sending a wild misread (like 999999) 
      # which would permanently ruin your HA Energy Dashboard stats.
      # Only accepts readings that are greater than or equal to the last valid reading.
      # - filter_out: nan
      # - lambda: |-
      #     static float last_valid_value = 0.0;
      #     if (x >= last_valid_value) {
      #       last_valid_value = x;
      #       return x;
      #     } else {
      #       return {}; // Ignore the reading if it went down
      #     }
  validator_state_sensor:
    id: sensor_validator_logs
    name: "VV State Logs"
    icon: "mdi:text-box-outline"
    entity_category: diagnostic
  # Basic Validation
  enable_dial_correction: false
  # Allow values < previous value (default: false)
  allow_negative_rates: false
  small_negative_tolerance: 15
  # Max allowed absolute change (default: 500)
  max_absolute_diff: 500
  # Max rate change as percentage (default: 15%)
  max_rate_change: 0.15

  # Smart Validation
  # Enable adaptive validation (default: true)
  enable_smart_validation: true
  # Window size for pattern analysis (default: 5)
  smart_validation_window: 10
  max_consecutive_rejections: 20

  # Confidence Thresholds
  # Threshold for high confidence (default: 90%)
  high_confidence_threshold: 0.90
  # Min confidence per digit (default: 85%)
  per_digit_confidence_threshold: 0.70
  # Require all digits meet threshold (default: false)
  strict_confidence_check: false
  first_reading_digit_threshold: 0.70

  # Memory Management
  max_history_size: 50kB               # Max history memory usage (default: 50kB)
  persist_state: true

meter_reader_tflite:
  id: component_meter_reader
  validator: component_value_validator
  # confidence_threshold: 0.85 # Only if validator is disabled
  camera_id: espcam
  camera_resolution: ${module.ai_on_the_edge.camera.resolution}
  # best performance / accuracy
#  model: "board/module/ai_on_the_edge/models/digit_recognizer_v3_quantized_integer_quant_uint8.tflite"
  # 99.46% acc | inference in 4150ms | 263.76 KB memory footprint
#  model: "board/module/ai_on_the_edge/models/digit_recognizer_v16_quantized_integer_quant_uint8.tflite"
  # 97.87% acc | inference in 2300ms | 262.33 KB memory footprint | good with very bad images
#  model: "board/module/ai_on_the_edge/models/digit_recognizer_v23_quantized_integer_quant_uint8.tflite"
  # 98.86% acc | inference in 2600ms | 135.29 KB memory footprint
#  model: "board/module/ai_on_the_edge/models/digit_recognizer_v24_quantized_integer_quant_uint8.tflite"
  # 99.06 acc | inference in 1300ms | 105.91 KB memory footprint
  model: "board/module/ai_on_the_edge/models/digit_recognizer_v40_quantized_integer_quant_uint8.tflite"
  tensor_arena_size: 50KB # 18kb actual | 100kb default
  # From AI-On-The-Edge
#  model: "board/module/ai_on_the_edge/models/dig-class11_1910_s2_q.tflite"
#  model: "board/module/ai_on_the_edge/models/dig-class11_2000_s2_q.tflite"

  output_processing: direct_class

  update_interval: 90s

  # collect_low_confidence: true # [Optional] Default: true. Required for data collector. Defines what is considered "low confidence" (uses confidence_threshold).
  # collect_min_global_confidence: 0.90 # [Optional] Default: 0.90. Low confidence override for data collection (Average < Value). Prerequisite: data_collector.
  # collect_min_digit_confidence: 0.90 # [Optional] Default: 0.90. Low confidence override for data collection (Any Digit < Value). Prerequisite: data_collector.

  debug: false
  debug_image: false # static embedded image (debug.jpg)
  debug_image_out_serial: false
  debug_memory: true
  debug_timing: false

  # Preview of what the AI sees (Rotated Live Cam)
  # Set to true to enable continuous updates, or false for on-demand only (via button)
  generate_preview: false # need web_server: port: 80 (wait for update_interval to be reached) + esp32_camera_utils: enable drawing subsystem
  # show_crop_areas: true # DEV (not ready for production) Draw boxes on preview
  ## other needs :
    # esp32_camera_utils: enable_drawing: true
    # generate_preview: true
    # show_crop_areas: true
    # web_server:
        # port: 80  # commented  uncomment
    # - !include camera_webserver.yaml

  crop_zones_global: global_crop_zones  # Reference the global variables set in globals_AI_component.yaml | To update, use http://[hassio]/developer-tools/action >esphome.[s3cam_tflite]_set_crop_zones | to get, use the tools>draw_regions.py
  flash_light_controller: component_flash_controller

  # data_collector: ${id_prefix}_data_collector
  # collect_low_confidence: true

  value_sensor: tmr_meter_value
  confidence_sensor: tmr_meter_confidence

  inference_logs: tmr_inference_logs
  main_logs: tmr_main_logs

  total_inference_time_sensor: tmr_inference_time
  capture_to_publish_time_sensor: tmr_capture_to_publish_time

  # enable_flash_calibration: false # still in dev

  ### Advanced parameters
  # frame_request_timeout: 15000  # ms (1000-60000)
  # Pool efficiency monitoring (optional, requires DEBUG_METER_READER_MEMORY)
  pool_job_efficiency_sensor: inference_job_pool_efficiency
  pool_result_efficiency_sensor: inference_result_pool_efficiency
  arena_efficiency_sensor: arena_efficiency
  heap_fragmentation_sensor: heap_fragmentation

  unload_button: tmr_unload_btn
  reload_button: tmr_reload_btn
