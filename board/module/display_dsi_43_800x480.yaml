labels: [dsi, display, i2c]
---
# https://docs.freenove.com/projects/fnk0078/en/latest/fnk0078/codes/tutorial/4_3inch.html
# https://www.waveshare.com/wiki/4.3inch_DSI_LCD
# https://docs.waveshare.com/4.3-DSI-TOUCH-A/User-Guide-ESP32-P4
# 4.3" 800x480 mipi dsi Touch LCD

# WIP

packages:
  # --- GUI PACKAGES ---
  colors: !include ../../gui/themes/colors_night_owl.yaml
#  lvgl: !include ../../gui/480x800.yaml

substitutions:
  module:
    touch_i2c_bus: i2c_internal
  display:
    home_page: page_analog_clock

external_components:
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: beta 
    components: [ mipi, mipi_dsi ]

esphome:
  on_boot:
    - priority: 600
      then:
        - globals.set:
            id: display_init_done
            value: "true"

globals:
  - id: display_init_done
    restore_value: 'false'
    type: bool
    initial_value: 'false'

display:
  - platform: mipi_dsi
    id: display_lcd
    model: CUSTOM
    dimensions:
      height: 480
      width: 800
    auto_clear_enabled: false
    update_interval: 10s

    # Copied from a WAVESHARE-P4-NANO-10.1 configuration
    color_depth: 24
    pixel_mode: 24bit
    byte_order: little_endian
    color_order: RGB

    lane_bit_rate: 500Mbps
    lanes: 1
    # From Waveshare4.3DSI.t-xt
    pclk_frequency: 27.777MHz
    hsync_front_porch: 59
    hsync_pulse_width: 2
    hsync_back_porch: 45
    vsync_front_porch: 7
    vsync_pulse_width: 2
    vsync_back_porch: 22

    show_test_card: true
    init_sequence:
      - [ 0x7A, 0x3E ]
      - [ 0x20, 0x20 ]
      - [ 0x21, 0xE0 ]
      - [ 0x22, 0x13 ]
      - [ 0x23, 0x3B ]
      - [ 0x24, 0x02 ]
      - [ 0x25, 0x2D ]
      - [ 0x26, 0x00 ]
      - [ 0x27, 0x07 ]
      - [ 0x28, 0x02 ]
      - [ 0x29, 0x16 ]
      - [ 0x34, 0x80 ]
      - [ 0x36, 0x3B ]
      - [ 0x86, 0x28 ]
      - [ 0x5C, 0xFF ]
      - [ 0x87, 0x00 ]
      - [ 0x2A, 0x00 ]
      - [ 0x56, 0x92 ]
      - [ 0x6B, 0x09 ]
      - [ 0x69, 0x04 ]
      - [ 0x10, 0x40 ]
      - [ 0x11, 0x88 ]
      - [ 0xB6, 0x20 ]
      - [ 0x51, 0x20 ]
      - [ 0x09, 0x10 ]
      - delay 11ms
      - [ 0x7A, 0xC1 ]

i2c_device:
  - id: atmel_i2c
    address: 0x45
  - id: icn6211_i2c
    address: 0x2C

output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: |-
          id(atmel_i2c).write_byte(0x86, static_cast<uint8_t>(state * 255));
          return;

light:
  - platform: monochromatic
    id: backlight_light
    name: "Backlight"
    output: backlight_output
    default_transition_length: 100ms
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: |-
          // Simply push the current requested brightness to the Atmel PWM register
          uint8_t brightness = id(backlight_light).current_values.get_brightness() * 255;
          id(atmel_i2c).write_byte(0x86, brightness);
          return;
    on_turn_off:
      - lambda: |-
          // Drop PWM to 0, but leave the bridge chip and screen actively running
          id(atmel_i2c).write_byte(0x86, 0x00);
          return;

touchscreen:
  - platform: ft5x06
    setup_priority: -90
    i2c_id: ${module.touch_i2c_bus}
    address: 0x38
    id: touchscreen_ft5x06
    display: display_lcd
    transform:
      swap_xy: false
      mirror_y: false
      mirror_x: false
    on_touch:
      - then:
          - logger.log:
              tag: "Touch"
              level: INFO
              format: Touch %d at (%d, %d)
              args: [ 'touch.id', 'touch.x', 'touch.y' ]
          - if:
              condition:
                - light.is_off: backlight_light
              then:
                - light.turn_on:
                    id: backlight_light
                    brightness: 40%

binary_sensor:
  - platform: touchscreen
    id: touch
    name: Touchscreen
    entity_category: diagnostic
    x_min: 0
    x_max: 800
    y_min: 0
    y_max: 480
