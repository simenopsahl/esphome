labels: [PMSA003, particulates, uart]
---
# https://docs.m5stack.com/en/app/PM2.5_Air_Quality_Kit-SHT30
# https://esphome.io/components/sensor/pmsx003.html
# https://github.com/Chill-Division/M5Stack-ESPHome/

substitutions:
  module:
    air_quality_uart_bus: uart_mbus

logger:
  logs:
    pmsx003: DEBUG

# Module Air Quality
sensor:
  - platform: pmsx003
    type: PMSX003
    id: pmsx003_sensor
    uart_id: ${module.air_quality_uart_bus}
    update_interval: 120s
    pm_1_0:
      id: pm1_pmsa003
      name: "PM1 PMSA003"
      device_class: "pm1"
      state_class: "measurement"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 2
            send_every: 1
      on_value:
        - then:
            - lvgl.label.update:
                id: lbl_pm1_value
                text:
                  format: "%.1f"
                  args: [ 'x' ]
    pm_2_5:
      id: pm_25_pmsa003
      name: "PM2.5 PMSA003"
      device_class: "pm25"
      state_class: "measurement"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 2
            send_every: 1
      on_value:
        - then:
            - lvgl.label.update:
                id: lbl_pm25_value
                text:
                  format: "%.1f"
                  args: [ 'x' ]
    pm_10_0:
      id: pm_10_pmsa003
      name: "PM10 PMSA003"
      device_class: "pm10"
      state_class: "measurement"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 2
            send_every: 1
      on_value:
        - then:
            - lvgl.label.update:
                id: lbl_pm10_value
                text:
                  format: "%.1f"
                  args: [ 'x' ]

  - platform: aqi
    name: "Air Quality Index"
    pm_2_5: pm_25_pmsa003
    pm_10_0: pm_10_pmsa003
    calculation_type: AQI
    entity_category: diagnostic

lvgl:
  pages:
    - <<: !include
        file: ../../gui/pages/air_quality/page.yaml
        vars:
          page_title: Luftkvalitet
