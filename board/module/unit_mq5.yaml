labels: [MQ5, combusible_gas, i2c]
---
# https://docs.m5stack.com/en/unit/Unit_MQ
# https://docs.m5stack.com/en/homeassistant/sensor/unit_mq_sensor
# MQ-5 Combustible Gas Sensor

substitutions:
  module:
    mq5_i2c_bus: i2c_grove

globals:
  # Stores the dynamic baseline in memory. 
  # We initialize it at 250.0mV as a starting guess.
  - id: mq5_dynamic_baseline
    type: float
    initial_value: '250.0'

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: m5stack_unit_mq

# UNIT MQ-5
sensor:
  # The device needs to be heated for a period of time before it can output normally
  # (ADC readings generally appear only after heating to around 29 degrees Celsius)
  - platform: m5stack_unit_mq
    i2c_id: ${module.mq5_i2c_bus}
    id: mq5_sensor
    # heat_mode: SWITCH, CONTINUOUS, "OFF"
    heat_mode: "OFF"
#    high_level_time: 45  # Minimum/default is 30
#    low_level_time: 5   # Minimum/default is 5
    update_interval: 5s
    # Temperature data derived from the thermistor reading
    temperature:
      id: mq5_temperature
      name: "MQ-5 Temperature"
      device_class: "temperature"
      state_class: "measurement"
      entity_category: "diagnostic"
      disabled_by_default: true
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 2
            send_every: 1
    # 12-bit MQ ADC reading
#    mq_adc:
#      id: mq5_mq_adc
#      name: "MQ-5 MQ ADC"
#      state_class: "measurement"
#      entity_category: "diagnostic"
#      disabled_by_default: true
    # MQ voltage reading
    mq_voltage:
      id: mq5_mq_voltage
      name: "MQ-5 MQ Voltage"
      device_class: "voltage"
      state_class: "measurement"
      entity_category: "diagnostic"
      disabled_by_default: true
      accuracy_decimals: 1
      on_value:
        - globals.set:
            id: mq5_dynamic_baseline
            value: !lambda |-
              float current = x;
              float baseline = id(mq5_dynamic_baseline);
              float diff = current - baseline;

              // 1. Warm-up override
              if (id(mq5_led).state) return current;
              
              // 2. Massive spike (gas leak detected) -> lock the baseline
              if (diff > 400.0) return baseline;
              
              // 3. Normal tracking using ternary operator:
              // If diff > 0 (drift up), adapt by 1%. Else (cleaner air), adapt by 10%.
              return (diff > 0) ? (baseline + (diff * 0.01)) : (baseline + (diff * 0.10));
    # LED status reading. The LED lights up when the reading is valid
    led:
      id: mq5_led
      name: "MQ-5 Valid Reading"
      device_class: "problem"
      entity_category: "diagnostic"
      filters:
        - invert:
    # 12-bit NTC ADC reading
#    ntc_adc:
#      id: mq5_ntc_adc
#      name: "MQ-5 NTC ADC"
#      state_class: "measurement"
#      entity_category: "diagnostic"
#      disable_by_default: true
    ntc_voltage:
      id: mq5_ntc_voltage
      name: "MQ-5 NTC Voltage"
      device_class: "voltage"
      state_class: "measurement"
      entity_category: "diagnostic"
      disabled_by_default: true
    # NTC resistance value.
    ntc_resistance:
      id: mq5_ntc_resistance
      name: "MQ-5 NTC Resistance"
      state_class: "measurement"
      entity_category: "diagnostic"
      disabled_by_default: true
    # Internal reference voltage
    reference_voltage:
      id: mq5_reference_voltage
      name: "MQ-5 Reference Voltage"
      device_class: "voltage"
      state_class: "measurement"
      entity_category: "diagnostic"
      disabled_by_default: true

# A template sensor so you can actually see the baseline on a graph in Home Assistant
  - platform: template
    id: mq5_baseline_tracker
    name: "MQ-5 Dynamic Baseline"
    device_class: "voltage"
    state_class: "measurement"
    unit_of_measurement: "mV"
    entity_category: "diagnostic"
    disabled_by_default: true
    update_interval: 5s
    accuracy_decimals: 1
    lambda: |-
      return id(mq5_dynamic_baseline);

# Binary GAS DETECTED sensor
binary_sensor:
  - platform: template
    name: "MQ-5 Combustible Gas"
    device_class: gas
    # Triggers if the current reading jumps more than 200mV above our dynamic baseline
    lambda: |-
      // If the reading is invalid (true), completely suppress the alarm
      if (id(mq5_led).state) {
        return false;
      }
      
      // If the reading is valid, evaluate the gas threshold
      return id(mq5_mq_voltage).state > (id(mq5_dynamic_baseline) + 200.0);

# Runtime Heater Controls
select:
  - platform: template
    name: "MQ-5 Heat Mode"
    id: mq5_heat_mode
    icon: "mdi:radiator"
    entity_category: "config"
    options:
      - "Off"
      - "Cycle"
      - "Continuous"
    initial_option: "Off"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (x == "Continuous") {
            id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::CONTINUOUS);
            id(mq5_sensor).write_byte(0x00, 0x01);
            id(mq5_heater).publish_state(true);
            ESP_LOGI("unit_mq5", "MQ-5 Heat Mode set to Continuous");
          } else if (x == "Cycle") {
            id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::SWITCH);
            id(mq5_sensor).write_byte(0x00, 0x10);
            id(mq5_heater).publish_state(true);
            ESP_LOGI("unit_mq5", "MQ-5 Heat Mode set to Cycle");
          } else {
            id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::OFF);
            id(mq5_sensor).write_byte(0x00, 0x00);
            id(mq5_heater).publish_state(false);
            ESP_LOGI("unit_mq5", "MQ-5 Heat Mode set to Off");
          }

switch:
  - platform: template
    name: "MQ-5 Heater"
    id: mq5_heater
    icon: "mdi:radiator"
    entity_category: "config"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          std::string mode = id(mq5_heat_mode).current_option().str();
          if (mode == "Off" || mode.empty()) {
            mode = "Cycle";
            id(mq5_heat_mode).publish_state("Cycle");
          }
          if (mode == "Continuous") {
            id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::CONTINUOUS);
            id(mq5_sensor).write_byte(0x00, 0x01);
          } else {
            id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::SWITCH);
            id(mq5_sensor).write_byte(0x00, 0x10);
          }
          ESP_LOGI("unit_mq5", "MQ-5 heater turned ON (%s)", mode.c_str());
    turn_off_action:
      - lambda: |-
          id(mq5_heat_mode).publish_state("Off");
          id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::OFF);
          id(mq5_sensor).write_byte(0x00, 0x00);
          ESP_LOGI("unit_mq5", "MQ-5 heater turned OFF");

esphome:
  on_boot:
    - priority: -15.0
      then:
        - lambda: |-
            std::string mode = id(mq5_heat_mode).current_option().str();
            if (id(mq5_heater).state && mode != "Off") {
              if (mode == "Continuous") {
                id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::CONTINUOUS);
                id(mq5_sensor).write_byte(0x00, 0x01);
                ESP_LOGI("unit_mq5", "Boot: Restored Continuous heat mode");
              } else {
                id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::SWITCH);
                id(mq5_sensor).write_byte(0x00, 0x10);
                ESP_LOGI("unit_mq5", "Boot: Restored Cycle heat mode");
              }
            } else {
              id(mq5_sensor).set_heat_mode(esphome::unit_mq::HeatMode::OFF);
              id(mq5_sensor).write_byte(0x00, 0x00);
              ESP_LOGI("unit_mq5", "Boot: MQ-5 heater dormant (OFF)");
            }
