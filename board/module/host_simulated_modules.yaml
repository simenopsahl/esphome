labels: [virtual, simulated, cc1101, kmeter, air_quality, lvgl]
---
# Simulated module GUI pages & mock sensor states for virtual (host-sdl) devices.
#
# Appends the hardware module pages (air_quality, dual_kmeter, cc1101 wmbus, and
# cc1101 packet) to `lvgl: pages:` and populates their LVGL widgets on boot
# with realistic sample data so they can be inspected and screenshotted without
# physical I2C/SPI peripherals attached.

substitutions:
  module:
    tank_temp_min: "25.0"
    tank_temp_max: "58.0"
    cc1101:
      water_meter_serial: "12345678"

lvgl:
  pages:
    - <<: !include
        file: ../../gui/pages/air_quality/page.yaml
        vars:
          page_title: "Luftkvalitet"

    - <<: !include
        file: ../../gui/pages/dual_kmeter/page.yaml
        vars:
          page_title: "VVB"

    - <<: !include
        file: ../../gui/pages/cc1101/wmbus.yaml
        vars:
          page_title: "Vannmåler"
      id: page_cc1101_wmbus

    - <<: !include
        file: ../../gui/pages/cc1101/packet.yaml
        vars:
          page_title: "Radio"

    - <<: !include
        file: ../../gui/pages/grid_dashboard/page.yaml
        vars:
          page_id: page_dashboard
          page_title: "Kontrollpanel"

    - <<: !include
        file: ../../gui/pages/climate/page.yaml
        vars:
          page_title: "Varmepumpe"
          page_icon: "\U000F1A43"
          back_page_id: page_dashboard
          show_back_btn: "true"

packages:
  climate_tile: !include
    file: ../../gui/tiles/climate/remote.yaml
    vars:
      page_id: page_dashboard
      uid: tile_varmepumpe
      row: 0
      col: 0
      icon: "\U000F1A43"
      title: "Varmepumpe"
      entity_id: climate.faircon_norgespumpa12_proxy
  room_temp_tile: !include
    file: ../../gui/tiles/sensor/local.yaml
    vars:
      page_id: page_dashboard
      uid: tile_room_temp
      row: 0
      col: 1
      icon: "\U000F050F"
      title: "Temperatur"
      sensor_id: temperature_local
      unit: "°C"
      format: "%.1f"
  humidity_tile: !include
    file: ../../gui/tiles/sensor/local.yaml
    vars:
      page_id: page_dashboard
      uid: tile_humidity
      row: 1
      col: 0
      icon: "\U000F058E"
      title: "Luftfuktighet"
      sensor_id: humidity_local
      unit: "%%"
      format: "%.0f"
  auto_disp_tile: !include
    file: ../../gui/tiles/switch/local.yaml
    vars:
      page_id: page_dashboard
      uid: tile_auto_disp
      row: 1
      col: 1
      icon: "\U000F0335"
      title: "Auto skjerm"
      switch_id: display_auto

esphome:
  on_boot:
    - priority: -200
      then:
        # --- Air Quality Mock Values ---
        - lvgl.label.update:
            id: lbl_temp_local_value
            text: "21.8"
        - lvgl.label.update:
            id: lbl_co2_value
            text: "542"
        - lvgl.label.update:
            id: lbl_pm1_value
            text: "2"
        - lvgl.label.update:
            id: lbl_pm25_value
            text: "4"
        - lvgl.label.update:
            id: lbl_pm10_value
            text: "7"

        # --- Dual KMeter (VVB Water Tank) Mock Values ---
        - lvgl.label.update:
            id: lbl_temp_kmeter_top_shadow
            text: "68.5"
        - lvgl.label.update:
            id: lbl_temp_kmeter_top_value
            text: "68.5"
        - lvgl.label.update:
            id: lbl_temp_kmeter_bottom_shadow
            text: "41.2"
        - lvgl.label.update:
            id: lbl_temp_kmeter_bottom_value
            text: "41.2"
        - lvgl.label.update:
            id: lbl_temp_kmeter_mix_value
            text: "54.8"
        - lvgl.bar.update:
            id: tank_graphic
            min_value: 250
            max_value: 580
            value: 418

        # --- CC1101 wMBus Water Meter Mock Values ---
        - lvgl.label.update:
            id: lbl_water_consumption_value
            text: "248.63"
        - lvgl.label.update:
            id: lbl_water_meter_alarms_value
            text: "Ingen"
        - lvgl.label.update:
            id: lbl_water_meter_status_value
            text: "OK"
        - lvgl.label.update:
            id: lbl_water_meter_rssi_value
            text: "-67"

        # --- CC1101 Radio (Packet) Mock Values ---
        - lvgl.label.update:
            id: lbl_frequency_value
            text: "868.95"
        - lvgl.label.update:
            id: lbl_modulation_value
            text: "2-FSK"
        - lvgl.label.update:
            id: lbl_tx_power_value
            text: "10"
        - lvgl.label.update:
            id: lbl_cc1101_packet
            text: "RX OK"
        - lvgl.label.update:
            id: lbl_rssi_value
            text: "-71"
        - lvgl.label.update:
            id: lbl_lqi_value
            text: "4"

        # --- Climate (Faircon Norgespumpa12 Proxy) Mock Values ---
        - lambda: |-
            id(climate_programmatic_update) = true;
            id(climate_mode) = 1;          // heat
            id(climate_action) = 1;        // heating
            id(climate_target_temp) = 22.5f;
            id(climate_current_temp) = 23.1f;
            id(climate_fan_mode) = 0;      // auto
            id(climate_swing_mode) = 4;    // on
            lv_arc_set_range(id(climate_arc), 180, 300);
            id(climate_programmatic_update) = false;
            // Reveal supported modes/buttons matching Faircon Norgespumpa12
            lv_obj_clear_flag(id(climate_btn_mode_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_mode_cool), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_mode_auto), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_mode_fan_only), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_mode_dry), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_fan_corner_btn), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_fan_auto), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_fan_quiet), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_fan_low), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_fan_medium), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_fan_high), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_swing_corner_btn), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_swing_off), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(climate_btn_swing_on), LV_OBJ_FLAG_HIDDEN);
        - script.execute: climate_sync_state
