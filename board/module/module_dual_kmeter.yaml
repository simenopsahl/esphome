  - platform: combination
    type: median
    id: dual_kmeter_mix_sensor
    name: "Temperature DualKMeter Mix"
    device_class: "temperature"
    state_class: "measurement"
    sources:
      - source: dual_kmeter_1_sensor
      - source: dual_kmeter_2_sensor
    # on_value:
    #   - then:
    #       - lvgl.label.update:
    #           id: lbl_temp_kmeter_mix_value
    #           text:
    #             format: "%.1f"
    #             args: [ 'x' ]

script:
  - id: update_tank_dynamic_min
    parameters:
      current_temp: float
    then:
      - globals.set:
          id: tank_dynamic_min
          value: !lambda |-
            // Abort and retain current global value if the sensor state is NaN
            if (std::isnan(current_temp)) {
              return id(tank_dynamic_min);
            }
            
            float current = current_temp;
            float baseline = id(tank_dynamic_min);
            float diff = current - baseline;
            // Colder: snap immediately. Warmer: drift up by 1%
            return (diff < 0) ? current : (baseline + (diff * 0.01));

  - id: update_tank_dynamic_max
    parameters:
      current_temp: float
    then:
      - globals.set:
          id: tank_dynamic_max
          value: !lambda |-
            // Abort and retain current global value if the sensor state is NaN
            if (std::isnan(current_temp)) {
              return id(tank_dynamic_max);
            }
            
            float current = current_temp;
            float baseline = id(tank_dynamic_max);
            float diff = current - baseline;
            // Hotter: snap immediately. Colder: drift down by 1%
            return (diff > 0) ? current : (baseline + (diff * 0.01));

  - id: update_tank_top
    parameters:
      current_temp: float
    then:
      # Update the shadow label
      - lvgl.label.update:
          id: lbl_temp_kmeter_top_shadow
          text:
            format: "%.1f"
            args: [ 'current_temp' ]
      # Update the main foreground label
      - lvgl.label.update:
          id: lbl_temp_kmeter_top_value
          text:
            format: "%.1f"
            args: [ 'current_temp' ]

  - id: update_tank_bottom
    parameters:
      current_temp: float
    then:
      # Update the shadow label
      - lvgl.label.update:
          id: lbl_temp_kmeter_bottom_shadow
          text:
            format: "%.1f"
            args: [ 'current_temp' ]
      # Update the main foreground label
      - lvgl.label.update:
          id: lbl_temp_kmeter_bottom_value
          text:
            format: "%.1f"
            args: [ 'current_temp' ]
      # Auto-calibrate the dynamic min/max
      - script.execute:
          id: update_tank_dynamic_min
          current_temp: !lambda "return current_temp;"
      - script.execute:
          id: update_tank_dynamic_max
          current_temp: !lambda "return current_temp;"
      # Update the bar graphic using the float globals
      - lvgl.bar.update:
          id: tank_graphic
          # 1. Cast the float globals to integers for LVGL's limits
          min_value: !lambda return (int)round(id(tank_dynamic_min) * 10.0);
          max_value: !lambda return (int)round(id(tank_dynamic_max) * 10.0);
          
          # 2. Calculate the inverted height using integers
          value: !lambda |-
            int current = (int)round(current_temp * 10.0);
            int min_val = (int)round(id(tank_dynamic_min) * 10.0);
            int max_val = (int)round(id(tank_dynamic_max) * 10.0);
            
            // Invert the reading
            int mapped_value = max_val - (current - min_val);
            
            // Safely constrain
            int final_val = std::max(min_val, std::min(max_val, mapped_value));
            
            // Print the variables to the log as a Warning
            ESP_LOGI("tank_bar", "cur: %d | min: %d | max: %d | map: %d | final: %d", 
                      current, min_val, max_val, mapped_value, final_val);
            
            return final_val;

# Same as in ../../gui/240x320.yaml
.sizing:
  - &page_styles
    <<: !include ../../gui/styles/page_styles.yaml
    page_pad_top: 32
    page_pad_bottom: 32
    screen_height: 240
    screen_width: 320
    # Calculate the usable height for the page content area
    # (screen_height - (2 * status_bar_height) - (2 * container_pad))
    # 240 - (2 * 32) - (2 * 1) = 170
    usable_screen_height: 170
    # Calculate the usable width for the page content area
    # (screen_width - (2 * container_pad))
    # 320  (2 * 4) = 312
    usable_screen_width: 312

  - &container_styles
    <<: !include ../../gui/styles/container_styles.yaml
    container_pad_top: 1
    container_pad_bottom: 1
    container_pad_left: 4
    container_pad_right: 4
    container_scrollable: false # prevents scrollbars on pages where space is used up to the last
  
  - &dual_kmeter_styles
    # Tank Graphic Dimensions
    tank_width: 100
    tank_height: 170
    tank_radius: 34
    # Bar widget limits (must be whole numbers)
    tank_temp_min: ${module.tank_temp_min}
    tank_temp_max: ${module.tank_temp_max}

# include lvgl page for dual kmeter
lvgl:
  pages:
    - <<: !include 
        file: ../../gui/pages/dual_kmeter/page.yaml
        vars:
          <<: [*page_styles, *container_styles, *dual_kmeter_styles]
          page_title: VVB
