labels: [es8311, msm381a3729h9bpc, speaker, microphone, sound_level, i2s_audio]
---
# https://docs.m5stack.com/en/atom/Atomic_Voice_Base
# https://docs.m5stack.com/en/homeassistant/voice_assistant/atoms3r_with_atomic_echo_base_voice_assistant
# Atomic Voice Base
# 

substitutions:
  feature:
    audio:
      volume_initial: "0.8"
  pin:
    ext:
      i2c:
        hat:
          sda: ${pin.ext.base.p4.p2}
          scl: ${pin.ext.base.p4.p1}
    audio:
      mic: ${pin.ext.base.p5.p4}
      i2s_lrclk: ${pin.ext.base.p5.p3}
      spk: ${pin.ext.base.p5.p2}
      i2s_bclk: ${pin.ext.base.p5.p5}

packages:
  hat_i2c: !include ../../extension/hat_i2c.yaml
  mic_common: !include common_mic.yaml

# Echo Base GPIO Expander
pi4ioe5v6408:
  - id: hub_pi4ioe5v6408
    i2c_id: i2c_hat

# I2S Bus Configuration
i2s_audio:
  - id: i2s_input
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true
  - id: i2s_output
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [ es8311 ]

audio_dac:
  - platform: es8311
    i2c_id: i2c_hat
    id: dac_es8311
    bits_per_sample: 16bit
    use_microphone: false  # analog microphone here
    mic_gain: 30DB
    use_mclk: false        # no mclk pin is connected

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_input
    id: i2s_mic
    bits_per_sample: 16bit
    channel: left
    adc_type: external
    i2s_din_pin: ${pin.audio.mic}

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_output
    i2s_mode: secondary
    dac_type: external
    audio_dac: dac_es8311
    id: i2s_speaker
    i2s_dout_pin: ${pin.audio.spk}
    channel: left
    buffer_duration: 500ms

switch:
  # NS4150B
  - platform: gpio
    id: amp_enable
    pin:
      pi4ioe5v6408: hub_pi4ioe5v6408
      number: 0
      mode:
        output: true
    restore_mode: ALWAYS_OFF
    name: "Amplifier"
    icon: "mdi:volume-high"
    entity_category: config

