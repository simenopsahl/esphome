labels: [es8311, speaker, microphone, sound_level, i2s_audio]
---
# https://wiki.zectrix.com/en/hardware/note4c/quick-start
# https://github.com/LazyYoun/youn-ink-fourcolor-firmware/tree/2bp/firmware/main/audio
# Zectrix Note4 Audio Module Configuration
# 

packages:
  mic_common: !include common_mic.yaml

# I2S Bus Configuration
i2s_audio:
  - id: i2s_input
    i2s_mclk_pin: ${pin.audio.i2s_mclk}
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true
  - id: i2s_output
    i2s_bclk_pin:
      number: ${pin.audio.i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${pin.audio.i2s_lrclk}
      allow_other_uses: true

audio_dac:
  - platform: es8311
    i2c_id: i2c_internal
    id: dac_es8311
    bits_per_sample: 16bit
    use_microphone: false  # analog microphone here
    mic_gain: 30DB

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_input
    id: i2s_mic
    bits_per_sample: 16bit
    channel: left
    adc_type: external
    i2s_din_pin: ${pin.audio.mic}

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_output
    i2s_mode: secondary
    dac_type: external
    audio_dac: dac_es8311
    id: i2s_speaker
    i2s_dout_pin:
      number: ${pin.audio.spk}
      ignore_strapping_warning: true
    channel: left
    buffer_duration: 500ms

switch:
  - platform: gpio
    id: amp_enable
    pin:
      number: ${pin.audio.amp}
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    name: "Amplifier"
    icon: "mdi:volume-high"
    entity_category: config

