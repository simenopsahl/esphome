labels: [SPI, display, ePaper]
---
# https://wiki.seeedstudio.com/reterminal_e10xx_with_esphome/#basic-for-drawing-in-esphome
# https://esphome.io/components/display/epaper_spi/

# =============================================================================
# reTerminal E1002 — ESPHome Full Hardware Example
# All onboard peripherals enabled in the most basic way
# =============================================================================
#
# Hardware list:
#   1. 7.5" COLOR ePaper display (800x480, SPI)
#      Supported colors: BLACK, RED, GREEN, BLUE, YELLOW
#   2. 3x buttons (GPIO3, GPIO4, GPIO5)
#   3. Buzzer (GPIO45, PWM)
#   4. Onboard LED (GPIO6)
#   5. Battery voltage (GPIO1 ADC + GPIO21 EN)
#   6. SHT4x temp & humidity sensor (I2C)
#   7. PCF8563 RTC (I2C addr 0x51, CR1220 backup)
#   8. PDM Microphone (CLK=42, DATA=41, EN=38)
#   9. MicroSD card slot (SPI + DET=15, EN=16)
#  10. Deep sleep with button wake-up
#
# NOTE: Requires ESPHome >= 2025.11.1 for epaper_spi platform
#
# Serial debug: UART0 via CH340K USB bridge
# =============================================================================

packages:
  epaper: !include ../../features/epaper.yaml

substitutions:
  device:
    model: "Seeed reTerminal E1002"
  display:
    home_page: page_tutorial
    font:
      text_sm: 18
      text_md: 22
      text_lg: 26
      text_xl: 30
      text_xxl: 36
      text_hg: 44
      text_fl: 54
      icons_sm: 28
      icons_md: 40
      icons_lg: 50
      icons_xl: 64
      icons_xxl: 90
  pin:
    light:
      led: GPIO6
    int:
      i2c:
        sda: GPIO19
        scl: GPIO20
    audio:
      i2s_lrclk: GPIO42
      i2s_din: GPIO41
      mic: GPIO41
    ext:
      j2:
        p1: 3v
        p2: gnd
        p3: gpio46 # ADC
        p4: gpio2 # ADC
        p5: gpio17 # u1_tx
        p6: gpio18 # u1_rx
        p7: gpio20 # SCL
        p8: gpio19 # SDA

esphome:
  project:
    name: "Seeed.reTerminal E1002"
    version: "1.0.0"
  on_boot:
    - priority: 600
      then:
        # Turn on SD card power rail
        - output.turn_on: sd_enable
        # Turn on battery measurement circuit
        - output.turn_on: battery_enable
        # Turn on microphone power
        - output.turn_on: mic_power_enable
        # Wait for voltages to stabilize
        - delay: 200ms
        # Take first battery reading
        - component.update: battery_voltage
        - component.update: battery_level
        # Read RTC time on boot
        - pcf8563.read_time:
    - priority: 200.0
      then:
        - component.update: display_eink
        - wait_until:
            condition:
              lambda: 'return id(data_updated) == true;'
        # Wait a bit longer so all the items are received
        - delay: 5s
        - logger.log: "Initial sensor data received: Refreshing display..."
        - lambda: 'id(initial_data_received) = true;'
        - display.page.show: ${display.home_page}
        - script.execute: update_screen

globals:
  - id: !extend epaper_bg_color
    initial_value: 'Color(255, 255, 255, 0)' # Default to white background
  - id: !extend epaper_text_color
    initial_value: 'Color(0, 0, 0, 0)' # Default to black text

# =============================================================================
# [1] ePaper display (7.5" COLOR, 800x480)
# Requires ESPHome >= 2025.11.1
# =============================================================================
display:
  # 800 x 480 resolution
  # Full Color (E Ink® Spectra™ 6)
  - platform: epaper_spi
    id: display_eink
    model: Seeed-reTerminal-E1002
    update_interval: never
    pages:
      - id: page_black
        lambda: |-
          // Fill background.
          it.fill( id(color_black) );
      - id: page_white
        lambda: |-
          // Fill background.
          it.fill( id(color_white) );
      - id: page_tutorial
        lambda: |-
          // Fill background.
          it.fill( id(color_white) );
          // ---- Log all sensor values ----
          ESP_LOGD("display", "=== ePaper display refresh ===");

          // ---- Title (BLUE) ----
          it.printf(400, 15, id(font_md), id(color_blue), TextAlign::TOP_CENTER,
                    "reTerminal E1002 Dashboard");
          it.line(20, 55, 780, 55, id(color_black));

          // ---- RTC Time (BLACK) ----
          auto now = id(time_rtc).now();
          if (now.is_valid()) {
            it.strftime(400, 65, id(font_md), id(color_black), TextAlign::TOP_CENTER,
                        "%Y-%m-%d  %H:%M", now);
            ESP_LOGD("display", "RTC time: %04d-%02d-%02d %02d:%02d",
                    now.year, now.month, now.day_of_month, now.hour, now.minute);
          } else {
            it.printf(400, 65, id(font_md), id(color_black), TextAlign::TOP_CENTER,
                      "RTC: waiting for sync...");
            ESP_LOGW("display", "RTC: not synced yet");
          }

          // ---- Temperature (RED) ----
          if (id(temperature_sht40).has_state()) {
            ESP_LOGD("display", "Temperature: %.1f C", id(temperature_sht40).state);
            it.printf(30, 120, id(font_lg), id(color_red), "Temp: %.1f C", id(temperature_sht40).state);
          } else {
            ESP_LOGW("display", "Temperature: NO DATA");
            it.printf(30, 120, id(font_lg), id(color_red), "Temp: -- C");
          }

          // ---- Humidity (GREEN) ----
          if (id(humidity_sht40).has_state()) {
            ESP_LOGD("display", "Humidity: %.1f %%", id(humidity_sht40).state);
            it.printf(30, 185, id(font_lg), id(color_green), "Hum:  %.1f %%", id(humidity_sht40).state);
          } else {
            ESP_LOGW("display", "Humidity: NO DATA");
            it.printf(30, 185, id(font_lg), id(color_green), "Hum:  -- %%");
          }

          // ---- Battery (YELLOW) ----
          if (id(battery_level).has_state()) {
            ESP_LOGD("display", "Battery: %.0f%%  Voltage: %.2fV",
                    id(battery_level).state, id(battery_voltage).state);
            it.printf(30, 260, id(font_md), id(color_yellow), "Battery: %.0f%%  (%.2fV)",
                      id(battery_level).state, id(battery_voltage).state);
          } else {
            it.printf(30, 260, id(font_md), id(color_yellow), "Battery: --");
          }

          // ---- SD card status (BLACK) ----
          if (id(sd_card_detect).state) {
            it.printf(30, 305, id(font_sm), id(color_black), "SD Card: inserted");
          } else {
            it.printf(30, 305, id(font_sm), id(color_black), "SD Card: not detected");
          }

          // ---- Microphone status (BLACK) ----
          it.printf(30, 335, id(font_sm), id(color_black), "PDM Microphone: enabled (GPIO41/42)");

          // ---- Button hints (BLACK) ----
          it.line(20, 370, 780, 370, id(color_blue));
          it.printf(30, 380, id(font_sm), id(color_green), "KEY0 GPIO3: Green button");
          it.printf(30, 405, id(font_sm), id(color_black), "KEY1 GPIO4: Right button");
          it.printf(30, 430, id(font_sm), id(color_black), "KEY2 GPIO5: Left button");

          // ---- Footer (BLUE) ----
          it.printf(400, 458, id(font_sm), id(color_blue), TextAlign::TOP_CENTER,
                    "Selected reTerminal hardware features enabled");

#    lambda: |-
#      const auto BLACK   = Color(0,   0,   0,   0);
#      const auto WHITE   = Color(255, 255, 255, 0);
#      const auto RED     = Color(255, 0,   0,   0);
#      const auto GREEN   = Color(0,   255, 0,   0);
#      const auto BLUE    = Color(0,   0,   255, 0);
