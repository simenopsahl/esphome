labels: [SPI, display, ePaper]
---
# Schematic reference: "esphome/pinmap/schematics/Seeed reTerminal e1001.pdf"
# https://wiki.seeedstudio.com/reterminal_e10xx_with_esphome/#basic-for-drawing-in-esphome
# YAML example configuration
# https://seeed-projects.github.io/OSHW-reTerminal-Series-E-D/?platform=esphome&device=E1001
# https://esphome.io/components/display/epaper_spi/

# =============================================================================
# reTerminal E1001 — ESPHome Full Hardware Example
# All onboard peripherals enabled in the most basic way
# =============================================================================
#
# Hardware list:
#   1. 7.5" B/W ePaper display (800x480, SPI)
#   2. 3x buttons (GPIO3, GPIO4, GPIO5)
#   3. Buzzer (GPIO45, PWM)
#   4. Onboard LED (GPIO6)
#   5. Battery voltage (GPIO1 ADC + GPIO21 EN)
#   6. SHT4x temp & humidity sensor (I2C)
#   7. PCF8563 RTC (I2C addr 0x51, CR1220 backup)
#   8. PDM Microphone (CLK=42, DATA=41, EN=38)
#   9. MicroSD card slot (SPI + DET=15, EN=16)
#
# NOTE: Requires ESPHome >= 2025.11.1 for epaper_spi platform
#
# Serial debug: UART0 via CH340K USB bridge
# =============================================================================

packages:
  epaper_base: !include ../../gui/epaper/base.yaml
  epaper_theme: !include ../../gui/epaper/themes/bw.yaml
  epaper_fonts: !include ../../gui/epaper/fonts/bw.yaml
  epaper_chrome: !include ../../gui/epaper/chrome/status_bar.yaml
  epaper_nav: !include ../../gui/epaper/chrome/nav_reterminal.yaml
  epaper_info: !include ../../gui/epaper/pages/info_sensors.yaml
  mic: !include audio/common_mic.yaml

substitutions:
  screen_width: "800"
  screen_height: "480"
  epaper_home_page: "page_info"
  epaper_time_id: "time_rtc"
  hint_1: "KEY0 GPIO3: Grønn"
  hint_2: "KEY1 GPIO4: Høyre"
  hint_3: "KEY2 GPIO5: Venstre"
  show_battery_pct: "true"
  show_battery_volt: "true"
  show_temp: "true"
  show_humidity: "true"
  show_sd: "true"
  device:
    model: "Seeed reTerminal E1001"
    rtc: "true"
    screen:
      width: ${screen_width}
      height: ${screen_height}
  pin:
    light:
      led: GPIO6
    int:
      i2c:
        sda: GPIO19
        scl: GPIO20
    audio:
      i2s_lrclk: GPIO42
      i2s_din: GPIO41
      mic: GPIO41
    ext:
      j2:
        p1: 3v
        p2: gnd
        p3: gpio46 # ADC
        p4: gpio2 # ADC
        p5: gpio17 # u1_tx
        p6: gpio18 # u1_rx
        p7: gpio20 # SCL
        p8: gpio19 # SDA

esphome:
  project:
    name: "Seeed.reTerminal E1001"
    version: "1.0.0"
  on_boot:
    - priority: 600
      then:
        # Turn on SD card power rail
        - output.turn_on: sd_enable
        # Turn on battery measurement circuit
        - output.turn_on: battery_enable
        # Turn on microphone power
        - output.turn_on: mic_power_enable
        # Wait for voltages to stabilize
        - delay: 200ms
        # Take first battery reading
        - component.update: battery_voltage
        - component.update: battery_level
        # Read RTC time on boot
        - pcf8563.read_time:
    - priority: 375
      then:
        # Safety net: if HA never connects.
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;

api:
  on_client_connected:
    - lambda: id(init_in_progress) = false;

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: mic_disabled
    type: bool
    restore_value: no
    initial_value: 'false'

# =============================================================================
# [1] ePaper display (7.5" B/W, 800x480)
# Requires ESPHome >= 2025.11.1
# =============================================================================
display:
  # 800 x 480 resolution
  # Monochrome (4-level grayscale)
  - platform: epaper_spi
    id: display_eink
    model: Seeed-reTerminal-E1001
    update_interval: never
    full_update_every: 2

# Enable serial logging
# The reTerminal E series has a CH340K USB-to-UART bridge on UART0.
# Default ESP32-S3 logger uses USB_CDC — won't produce output on the physical port.
logger:
  hardware_uart: UART0

# I2S audio bus — for the onboard PDM microphone
# i2s_lrclk_pin serves as the PDM clock output in PDM mode
i2s_audio:
  i2s_lrclk_pin: ${pin.audio.i2s_lrclk}

output:
  # [9] SD card power enable
  - platform: gpio
    pin: ${pin.reTerminal.e1001.card.sd_power}
    id: sd_enable

  # [5] Battery measurement enable
  - platform: gpio
    pin: ${pin.reTerminal.e1001.battery.enable}
    id: battery_enable

  # [3] Buzzer PWM output
  # 'ledc' is ESP32 hardware PWM
  - platform: ledc
    pin: ${pin.reTerminal.e1001.audio.buzzer}
    id: buzzer

  # [8] Microphone power enable (TPS22916 load switch)
  # Must be HIGH before recording
  - platform: gpio
    pin: ${pin.reTerminal.e1001.audio.mic_power}
    id: mic_power_enable

sensor:
  # --- Battery voltage (ADC on GPIO1) ---
  - platform: adc
    pin: ${pin.reTerminal.e1001.battery.adc}
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      # Compensate for onboard voltage divider (1:2)
      - multiply: 2.0
    on_value:
      - lvgl.label.update:
          id: lbl_ep_info_bat_volt
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), isnan(x) ? "--V" : "%.2fV", x);
            return std::string(buf);
      - lambda: 'id(data_updated) = true;'

  # --- Battery level (percentage) ---
  - platform: template
    name: "Battery"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return id(battery_voltage).state;'
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      - lvgl.label.update:
          id: lbl_ep_info_bat_pct
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), isnan(x) ? "--%%" : "%.0f%%", x);
            return std::string(buf);
      - lambda: 'id(data_updated) = true;'

  # --- SHT4x temperature & humidity (I2C) ---
  - platform: sht4x
    i2c_id: ${module.internal.i2c_bus}
    id: sht40_sensor
    temperature:
      id: temperature_sht40
      name: "SHT40 Temperature"
      disabled_by_default: true
      device_class: "temperature"
      state_class: "measurement"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 6
            send_every: 3
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_ep_info_temp
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), isnan(x) ? "-- °C" : "%.1f °C", x);
                return std::string(buf);
          - lambda: 'id(data_updated) = true;'
    humidity:
      id: humidity_sht40
      name: "SHT40 Humidity"
      disabled_by_default: true
      device_class: "humidity"
      state_class: "measurement"
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 6
            send_every: 3
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_ep_info_hum
              text: !lambda |-
                char buf[16];
                snprintf(buf, sizeof(buf), isnan(x) ? "-- %%" : "%.1f %%", x);
                return std::string(buf);
          - lambda: 'id(data_updated) = true;'
    heater_power: Low
    heater_time: Short
    update_interval: 10s

binary_sensor:
  # KEY0 (GPIO3)
  - platform: gpio
    pin:
      number: ${pin.reTerminal.e1001.btn.green}
      mode: INPUT
      inverted: true
    id: button_green
    name: "Green Button"
    entity_category: diagnostic
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: "KEY0 (GPIO3) pressed"
      - script.execute: buzzer_beep
      - lvgl.page.show: ${epaper_home_page}
      - script.execute: update_screen
    on_release:
      - output.turn_off: buzzer

  # KEY1 (GPIO4)
  - platform: gpio
    pin:
      number: ${pin.reTerminal.e1001.btn.right}
      mode: INPUT
      inverted: true
    id: button_right
    name: "Right Button"
    entity_category: diagnostic
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: "KEY1 (GPIO4) pressed"
      - script.execute: buzzer_beep
      - lvgl.page.next:
      - script.execute: update_screen
    on_release:
      - output.turn_off: buzzer

  # KEY2 (GPIO5)
  - platform: gpio
    pin:
      number: ${pin.reTerminal.e1001.btn.left}
      mode: INPUT
      inverted: true
    id: button_left
    name: "Left Button"
    entity_category: diagnostic
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: "KEY2 (GPIO5) pressed"
      - script.execute: buzzer_beep
      - lvgl.page.previous:
      - script.execute: update_screen
    on_release:
      - output.turn_off: buzzer

  # [9] SD card detect (LOW = card present)
  #
  # NOTE on SD card in ESPHome:
  # ESPHome cannot directly access the SD card file system (read/write files,
  # create directories, etc.) the way Arduino can. In ESPHome, the SD card is
  # used indirectly by specific components:
  #   - online_image: caches downloaded images to SD card
  #   - media_player: plays audio files stored on the card
  #   - Works with PSRAM for large buffer allocation
  # For direct file operations (e.g. recording WAV files), use the Arduino framework.
  - platform: gpio
    pin:
      number: ${pin.reTerminal.e1001.card.detect}
      mode: INPUT_PULLUP
      inverted: true
    id: sd_card_detect
    name: "SD Card Detected"
    entity_category: diagnostic
    disabled_by_default: true
    on_state:
      then:
        - lvgl.label.update:
            id: lbl_ep_info_sd
            text: !lambda 'return x ? "oppdaget" : "ikke oppdaget";'
        - lambda: 'id(data_updated) = true;'


time:
  # PCF8563 is at I2C address 0x51 with a CR1220 coin cell backup.
  # On boot we read the RTC; when HA syncs, we write back to the RTC.
  - platform: pcf8563
    i2c_id: ${module.internal.i2c_bus}
    id: time_rtc
    address: 0x51
    # No periodic re-reads needed; HA sync handles it
    update_interval: never
  - id: !extend time_homeassistant
    on_time_sync:
      - then:
          - pcf8563.write_time:

# =============================================================================
# [8] PDM Microphone / PDM 麦克风
# =============================================================================
# The onboard PDM mic outputs a 1-bit sigma-delta stream.
# ESP32-S3 built-in PDM peripheral decodes it — no external codec needed.
#
# In HA, this microphone can be used with Voice Assistant / Assist Pipeline.
microphone:
  - platform: i2s_audio
    id: i2s_mic
    adc_type: external
    pdm: true
    i2s_din_pin: ${pin.audio.mic}

# Script for buzzer beep
script:
  - id: buzzer_on
    then:
      - output.turn_on: buzzer
      - output.ledc.set_frequency:
          id: buzzer
          frequency: "500Hz"
      - output.set_level:
          id: buzzer
          level: "1%"
  - id: buzzer_beep
    then:
      - output.turn_on: buzzer
      - output.ledc.set_frequency:
          id: buzzer
          frequency: "500Hz"
      - output.set_level:
          id: buzzer
          level: "1%"
      - delay: 30ms
      - output.turn_off: buzzer
