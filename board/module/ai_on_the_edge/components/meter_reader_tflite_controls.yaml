# configure number sliders for these parameters to make them available in HA
number:
  # Update Interval
  - platform: template
    name: "TfL Update Interval"
    id: tmr_meter_update_interval
    icon: "mdi:timer"
    unit_of_measurement: "s"
    device_class: duration
    min_value: 1
    max_value: 3600
    step: 1
    initial_value: 60
    entity_category: config
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (id(component_meter_reader) != nullptr) {
            id(component_meter_reader)->set_update_interval((uint32_t)(x * 1000));
          }

  # Confidence Threshold (only used when no external validator is configured)
  # - platform: template
  #   name: "TfL Confidence Threshold"
  #   id: tmr_confidence_threshold
  #   icon: "mdi:speedometer"
  #   unit_of_measurement: "%"
  #   min_value: 0
  #   max_value: 100
  #   step: 1
  #   initial_value: 85
  #   entity_category: config
  #   optimistic: true
  #   restore_value: true
  #   set_action:
  #     - lambda: |-
  #         if (id(component_meter_reader) != nullptr) {
  #           id(component_meter_reader)->set_confidence_threshold(x / 100.0);
  #         }

  # Frame Request Timeout
  # - platform: template
  #   name: "TfL Frame Request Timeout"
  #   id: tmr_frame_request_timeout
  #   icon: "mdi:timer-alert"
  #   unit_of_measurement: "ms"
  #   device_class: duration
  #   min_value: 1000
  #   max_value: 60000
