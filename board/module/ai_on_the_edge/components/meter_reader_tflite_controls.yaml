  #     - lambda: |-
  #         if (id(component_meter_reader) != nullptr) {
  #           id(component_meter_reader)->start_flash_calibration();
  #         }

  # Unload AI Components
  - platform: template
    name: "TfL Unload AI Components"
    id: tmr_unload_btn
    icon: "mdi:download-off"
    entity_category: config

  # Reload AI Components
  - platform: template
    name: "TfL Reload AI Components"
    id: tmr_reload_btn
    icon: "mdi:reload"
    entity_category: config

sensor:
  # Meter Reading
  - platform: template
    name: "TfL Meter Reading"
    id: tmr_meter_value
    unit_of_measurement: "${meter.unit}"
    accuracy_decimals: 3
    icon: mdi:counter
    state_class: ${meter.state_class}
    device_class: ${meter.device_class}
    entity_category: diagnostic
    filters:
      # Converts the raw 12058 into 12.058
      - multiply: 0.001
      # Prevents the AI from sending a wild misread (like 999999) 
      # which would permanently ruin your HA Energy Dashboard stats.
      # Only accepts readings that are greater than or equal to the last valid reading.
      # - filter_out: nan
      # - lambda: |-
      #     static float last_valid_value = 0.0;
      #     if (x >= last_valid_value) {
      #       last_valid_value = x;
      #       return x;
      #     } else {
      #       return {}; // Ignore the reading if it went down
      #     }

  # Meter Reading Confidence
  - platform: template
    name: "TfL Meter Reading Confidence"
    id: tmr_meter_confidence
    unit_of_measurement: "%"
    accuracy_decimals: 2
    icon: "mdi:percent"
    entity_category: diagnostic

  # Inference Time
  - platform: template
    id: tmr_inference_time
    name: "TfL Inference Time"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    device_class: duration
    state_class: measurement
    icon: mdi:timer-outline
    entity_category: diagnostic

  # Capture to Publish Time
  - platform: template
    id: tmr_capture_to_publish_time
    name: "TfL Capture to Publish Time"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    device_class: duration
    state_class: measurement
    icon: mdi:timer-sand
    entity_category: diagnostic

text:
  # Set Last Valid Value (String) - Supports leading zeros
  - platform: template
    name: "TfL Set Last Valid Value (String)"
    id: tmr_set_last_valid_string
    icon: "mdi:form-textbox"
    mode: text
    entity_category: config
    optimistic: true
    min_length: 1
    max_length: 20
#    initial_value: ${meter.last_valid_value}
    set_action:
      - lambda: |-
          if (id(component_meter_reader) != nullptr) {
            id(component_meter_reader)->set_last_valid_value(x);
          }
      - lambda: |-
          if (id(component_value_validator) != nullptr) {
            id(component_value_validator)->set_last_valid_reading(x);
          }

# API Services
api:
  services:
    # Get Meter Data
    - service: get_meter_data
      then:
        - lambda: |-
            auto val = id(component_meter_reader).get_value_sensor()->state;
            auto conf = id(component_meter_reader).get_confidence_sensor()->state;
            ESP_LOGD("api", "Meter Data: Value=%.2f, Confidence=%.2f", val, conf);

    # Set Crop Zones
    # - service: set_crop_zones
    #   variables:
    #     zones: string
    #   then:
    #     - text_sensor.template.publish:
    #         id: crop_zones_sensor
    #         state: !lambda 'return zones;'
    #     - lambda: |-
    #         id(crop_zones) = zones;
    #         id(tflite_meter_reader).set_crop_zones(zones);

    # Trigger Inference
    - service: trigger_inference
      then:
        - lambda: 'id(component_meter_reader).force_flash_inference();'

    # Start Flash Calibration
    - service: start_flash_calibration
      then:
        - lambda: 'id(component_meter_reader).start_flash_calibration();'

text_sensor:
  # Inference Logs
  - platform: template
    name: "TfL Inference Logs"
    id: tmr_inference_logs
    icon: "mdi:text-box-outline"
    entity_category: diagnostic

  # Main Logs
  - platform: template
    name: "Main Logs"
    id: tmr_main_logs
    icon: "mdi:text-box-multiple-outline"
    entity_category: diagnostic

