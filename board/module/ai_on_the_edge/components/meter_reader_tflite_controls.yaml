# https://github.com/nliaudat/esphome_ai_component

# Meter Reader TFLite Controls for Home Assistant
# Exposes meter_reader_tflite parameters for runtime configuration
switch:
  # Pause AI Processing
  - platform: template
    name: "TfL Pause AI Processing"
    id: tmr_pause_ai_processing
    icon: "mdi:pause"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          if (id(component_meter_reader) != nullptr) {
            id(component_meter_reader)->set_pause_processing(true);
          }
    turn_off_action:
      - lambda: |-
          if (id(component_meter_reader) != nullptr) {
            id(component_meter_reader)->set_pause_processing(false);
          }
  # Setup Mode (Preview)
  - platform: template
    name: "TfL Setup Mode (Preview)"
    id: tmr_setup_mode_preview
    icon: "mdi:camera-cog"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          if (id(component_meter_reader) != nullptr) {
            id(component_meter_reader)->set_generate_preview(true);
          }
    turn_off_action:
      - lambda: |-
          if (id(component_meter_reader) != nullptr) {
            id(component_meter_reader)->set_generate_preview(false);
          }

