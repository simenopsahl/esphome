  #         if (id(component_meter_reader) != nullptr) {
  #           id(component_meter_reader)->set_frame_request_timeout((uint32_t)x);
  #         }

  # Set Last Valid Value
  - platform: template
    name: "TfL Set Last Valid Value"
    id: tmr_set_last_valid
    icon: "mdi:restore"
    min_value: 0
    max_value: 9999999
    step: 1
    initial_value: 0
    entity_category: config
    optimistic: true
    set_action:
      - lambda: |-
          if (id(component_meter_reader) != nullptr) {
            id(component_meter_reader)->set_last_valid_value(x);
          }
      - lambda: |-
          if (id(component_value_validator) != nullptr) {
            id(component_value_validator)->set_last_valid_reading(x);
          }

button:
  # # Start Flash Calibration
  # - platform: template
  #   name: "TfL Start Flash Calibration"
