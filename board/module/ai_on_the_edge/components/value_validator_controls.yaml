---
# https://github.com/nliaudat/esphome_ai_component

# Value Validator Controls for Home Assistant
# Exposes all value_validator parameters for runtime configuration
switch:
  # Allow Negative Rates
  # - platform: template
  #   name: "VV Allow Negative Rates"
  #   id: vv_allow_negative_rates
  #   icon: "mdi:arrow-down-bold"
  #   entity_category: config
  #   optimistic: true
  #   restore_mode: RESTORE_DEFAULT_OFF
  #   turn_on_action:
  #     - lambda: |-
  #         if (id(meter_value_validator) != nullptr) {
  #           id(meter_value_validator)->set_allow_negative_rates(true);
  #         }
  #   turn_off_action:
  #     - lambda: |-
  #         if (id(meter_value_validator) != nullptr) {
  #           id(meter_value_validator)->set_allow_negative_rates(false);
  #         }
  # Enable Smart Validation
  - platform: template
    name: "VV Enable Smart Validation"
    id: vv_enable_smart_validation
    icon: "mdi:brain"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_enable_smart_validation(true);
          }
    turn_off_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_enable_smart_validation(false);
          }
  # Strict Confidence Check
  - platform: template
    name: "VV Strict Confidence Check"
    id: vv_strict_confidence_check
    icon: "mdi:check-decagram"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_strict_confidence_check(true);
          }
    turn_off_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_strict_confidence_check(false);
          }

# configure number sliders for these parameters to make them available in HA
number:
  # Max Absolute Difference
  - platform: template
    name: "VV Max Absolute Difference"
    id: vv_max_absolute_diff_num
    icon: "mdi:delta"
    min_value: 0
    max_value: 2000
    step: 10
    initial_value: 300
    entity_category: config
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_max_absolute_diff((int)x);
          }
  # Max Rate Change (percentage)
  - platform: template
    name: "VV Max Rate Change"
    id: vv_max_rate_change
    icon: "mdi:speedometer"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 15
    entity_category: config
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_max_rate_change(x / 100.0);  // Convert % to decimal
          }
  # Smart Validation Window
  - platform: template
    name: "VV Smart Validation Window"
    id: vv_smart_validation_window
    icon: "mdi:window-open"
    unit_of_measurement: "readings"
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 5
    entity_category: config
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_smart_validation_window((int)x);
          }
  # High Confidence Threshold
  - platform: template
    name: "VV High Confidence Threshold"
    id: vv_high_confidence_threshold
    icon: "mdi:gauge-full"
    unit_of_measurement: "%"
    min_value: 50
    max_value: 100
    step: 1
    initial_value: 90
    entity_category: config
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_high_confidence_threshold(x / 100.0);
          }
  # Per-Digit Confidence Threshold
  - platform: template
    name: "VV Per-Digit Confidence Threshold"
    id: vv_per_digit_confidence_threshold
    icon: "mdi:format-list-numbered"
    unit_of_measurement: "%"
    min_value: 50
    max_value: 100
    step: 1
    initial_value: 90
    entity_category: config
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (id(meter_value_validator) != nullptr) {
            id(meter_value_validator)->set_per_digit_confidence_threshold(x / 100.0);
          }
