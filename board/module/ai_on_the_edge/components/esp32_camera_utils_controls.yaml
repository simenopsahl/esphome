# API Services
api:
  services:
    # Set Camera Window
    - service: set_camera_window
      variables:
        offset_x: int
        offset_y: int
        width: int
        height: int
      then:
        - lambda: |-
            if (offset_x >= 0 && offset_y >= 0 && width > 0 && height > 0) {
              id(component_espcam_utils)->set_camera_window(offset_x, offset_y, width, height);
            }

    # Reset Camera Window
    - service: reset_camera_window
      then:
        - lambda: |-
            int width, height;
            id(component_espcam_utils)->reset_window(width, height);