    name: "CamUtil Enable Drawing"
    id: espcam_enable_drawing
    icon: "mdi:draw"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true


# configure number sliders for these parameters to make them available in HA
number:
  # Camera Window - Offset X
  - platform: template
    name: "CamUtil Window Offset X"
    id: espcam_cam_window_offset_x
    icon: "mdi:arrow-left-right"
    unit_of_measurement: "px"
    min_value: 0
    max_value: 1600
    step: 4
    initial_value: 0
    entity_category: config
    optimistic: true
    restore_value: true
    disabled_by_default: true

  # Camera Window - Offset Y
  - platform: template
    name: "CamUtil Window Offset Y"
    id: espcam_cam_window_offset_y
    icon: "mdi:arrow-up-down"
    unit_of_measurement: "px"
    min_value: 0
    max_value: 1200
    step: 4
    initial_value: 0
    entity_category: config
    optimistic: true
    restore_value: true
    disabled_by_default: true

  # Camera Window - Width
  - platform: template
    name: "CamUtil Window Width"
    id: espcam_cam_window_width
    icon: "mdi:arrow-expand-horizontal"
    unit_of_measurement: "px"
    min_value: 32
    max_value: 1600
    step: 16
    initial_value: 640
    entity_category: config
    optimistic: true
    restore_value: true
    disabled_by_default: true

  # # Camera Window - Height
  - platform: template
    name: "CamUtil Window Height"
    id: espcam_cam_window_height
    icon: "mdi:arrow-expand-vertical"
    unit_of_measurement: "px"
    min_value: 32
    max_value: 1200
    step: 16
    initial_value: 480
    entity_category: config
    optimistic: true
    restore_value: true
    disabled_by_default: true

  # Image Rotation
  - platform: template
    name: "CamUtil Camera Rotation"
    id: espcam_camera_rotation
    icon: "mdi:rotate-3d-variant"
    unit_of_measurement: "°"
    min_value: 0
    max_value: 270
    step: 90
    initial_value: 0
    entity_category: config
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (id(component_espcam_utils) != nullptr) {
            id(component_espcam_utils)->set_rotation(x);
          }
    disabled_by_default: true

