  # Option List for White Balance
  - platform: template
    name: "Cam White Balance Mode"
    id: espcam_wb
    icon: mdi:white-balance-auto
    options:
      - "Auto"
      - "Sunny"
      - "Cloudy"
      - "Office"
      - "Home"
    initial_option: "Auto"
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_wb_mode((esphome::esp32_camera::ESP32WhiteBalanceMode)id(espcam_wb).active_index().value());
        id(espcam_updated) = true;
  # Option list for AEC mode
  - platform: template
    name: "Cam Auto Exposure Mode"
    id: espcam_aec
    icon: mdi:auto-fix
    options:
      - "Manual"
      - "Auto"
    initial_option: "Auto"
    optimistic: True
    on_value:
      lambda: |-
        // Note: AEC uses the Enum defined for Gain_control, since both have "auto" & "manual"
        id(espcam).set_aec_mode((esphome::esp32_camera::ESP32GainControlMode)id(espcam_aec).active_index().value());
        id(espcam_updated) = true;
  # Option list for Gain Control Mode
  - platform: template
    name: "Cam Gain Control Mode"
    id: espcam_gc
    icon: mdi:auto-fix
    options:
      - "Manual"
      - "Auto"
    initial_option: "Auto"
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_agc_mode((esphome::esp32_camera::ESP32GainControlMode)id(espcam_gc).active_index().value());
        id(espcam_updated) = true;
  # Option list for Gain Ceiling (apparently this is somewhat equivilant to ISO settings)
  - platform: template
    name: "Cam Gain Ceiling"
    id: espcam_g_ceiling
    options:
      - "2x"
      - "4x"
      - "8x"
      - "16x"
      - "32x"
      - "64x"
      - "128x"
    initial_option: "2x"
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_agc_gain_ceiling((esphome::esp32_camera::ESP32AgcGainCeiling)id(espcam_g_ceiling).active_index().value());
        id(espcam_updated) = true;

# configure number sliders for these parameters to make them available in HA
number:
  # While the sliders for Contrast, Brightness, and Saturation all work and change the parameters of the sensor
  # they do not seem to make any difference to the image output
  - platform: template
    name: "Cam Contrast"
    id: espcam_contrast
    icon: mdi:contrast-box
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_contrast(id(espcam_contrast).state);
        id(espcam_updated) = true;
  # Number Slider for Brightness
  - platform: template
    name: "Cam Brightness"
    id: espcam_brightness
    icon: mdi:brightness-6
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_brightness(id(espcam_brightness).state);
        id(espcam_updated) = true;
  # Number Slider for Saturation
  - platform: template
    name: "Cam Saturation"
    id: espcam_saturation
    icon: mdi:palette-outline
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_saturation(id(espcam_saturation).state);
        id(espcam_updated) = true;
  # Number Slider for Gain Value
  - platform: template
    name: "Cam Gain Value"
    id: espcam_g_value
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_agc_value(id(espcam_g_value).state);
        id(espcam_updated) = true;
  # Number slider for AE Level
  - platform: template
    name: "Cam AE Level"
    id: espcam_ae_level
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_ae_level(id(espcam_ae_level).state);
        id(espcam_updated) = true;
  # Number Slider for AE Value (step set to 10)
  # I tried using steps of 1 (too fine to control) and 100 (to coarse for the values) and settled on 10
  - platform: template
    name: "Cam AE Value"
    id: espcam_ae_value
    min_value: 0
    max_value: 1200
    step: 10
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_aec_value(id(espcam_ae_value).state);
        id(espcam_updated) = true;
