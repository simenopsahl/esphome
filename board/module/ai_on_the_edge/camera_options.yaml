---
# https://github.com/nliaudat/esphome_ai_component

# create switches for turning a parameter on or off
switch:
  # on/off switch for Vertical Flip (my default = on, therefore: RESTORE_DEFAULT_ON)
  - platform: template
    name: "Cam Vertical Flip"
    id: espcam_v_flip
    icon: mdi:swap-vertical
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      lambda: |-
        id(espcam).set_vertical_flip(true);
        id(espcam_updated) = true;
    turn_off_action:
      lambda: |-
        id(espcam).set_vertical_flip(false);
        id(espcam_updated) = true;
  # on/off switch for Horizontal Mirror (my default = on, therefore: RESTORE_DEFAULT_ON)
  - platform: template
    name: "Cam Horizontal Mirror"
    id: espcam_h_mirror
    icon: mdi:reflect-horizontal
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      lambda: |-
        id(espcam).set_horizontal_mirror(true);
        id(espcam_updated) = true;
    turn_off_action:
      lambda: |-
        id(espcam).set_horizontal_mirror(false);
        id(espcam_updated) = true;
  # on/off switch for Auto Exposure 2 (my default = on, therefore: RESTORE_DEFAULT_ON)
  - platform: template
    name: "Cam Auto Exposure 2"
    id: espcam_aec_2
    icon: mdi:auto-fix
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      lambda: |-
        id(espcam).set_aec2(true);
        id(espcam_updated) = true;
    turn_off_action:
      lambda: |-
        id(espcam).set_aec2(false);
        id(espcam_updated) = true;

