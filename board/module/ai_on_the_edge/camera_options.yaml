---
# https://github.com/nliaudat/esphome_ai_component

# configure selects for these parameters to make them available in HA
select:
  # Option List for White Balance
  - platform: template
    name: "Cam White Balance Mode"
    id: espcam_wb
    icon: mdi:white-balance-auto
    options:
      - "Auto"
      - "Sunny"
      - "Cloudy"
      - "Office"
      - "Home"
    initial_option: ${module.camera.wb_mode | capitalize}
    optimistic: True
    entity_category: config
    disabled_by_default: true
    on_value:
      lambda: |-
        id(espcam).set_wb_mode((esphome::esp32_camera::ESP32WhiteBalanceMode)id(espcam_wb).active_index().value());
        id(global_espcam_updated) = true;
  # Option list for Gain Ceiling (apparently this is somewhat equivilant to ISO settings)
  - platform: template
    name: "Cam Gain Ceiling"
    id: espcam_g_ceiling
    options:
      - "2x"
      - "4x"
      - "8x"
      - "16x"
      - "32x"
      - "64x"
      - "128x"
    initial_option: ${module.camera.agc_gain_ceiling}
    optimistic: True
    entity_category: config
    disabled_by_default: true
    on_value:
      lambda: |-
        id(espcam).set_agc_gain_ceiling((esphome::esp32_camera::ESP32AgcGainCeiling)id(espcam_g_ceiling).active_index().value());
        id(global_espcam_updated) = true;

# configure number sliders for these parameters to make them available in HA
number:
  # Number slider for AE Level
  - platform: template
    name: "Cam AE Level"
    id: espcam_ae_level
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 2
    mode: SLIDER
    optimistic: True
    entity_category: config
    disabled_by_default: true
    on_value:
      lambda: |-
        id(espcam).set_ae_level(id(espcam_ae_level).state);
        id(global_espcam_updated) = true;
