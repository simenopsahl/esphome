labels: [esp32p4, psram, i2c, mipi_csi, mipi_dsi]
---
# https://docs.waveshare.com/ESP32-P4-WIFI6
# Base functions for:
# Waveshare ESP32-P4-Wifi6
# --
# For REVISION 1.3
# --

# Pins for this model
packages:
  pins: !include pins/waveshare_p4_wifi6.yaml
  i2c_int: !include extension/internal_i2c.yaml
  audio: !include
    file: module/audio/${feature.audio.hardware_module | default("waveshare_p4_audio.yaml")}
    condition: ${feature_audio_enabled | default("false")}

substitutions:
  extension:
    i2c:
      internal:
        frequency: 400kHz
  device:
    model: 'Waveshare P4-Wifi6'
    board: waveshare_p4_wifi6
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    psram: 'true'
  feature:
    audio:
      hardware_module: waveshare_p4_audio.yaml

esphome:
  project:
    name: 'Waveshare.ESP32-P4-Wifi6'
    version: "1.3"

esp32:
# ESP32-P4R32
# PSRAM: 32MB
#  board: esp32-p4-evboard
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
      enable_idf_experimental_features: true

      ringbuf_in_iram: True
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU1: "y"
      CONFIG_LWIP_SO_RCVBUF: "y"
      CONFIG_LWIP_MAX_SOCKETS: "32"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
    type: ${device.framework.type}
    version: 6.1.0

logger:
  hardware_uart: UART0

ota:
  - platform: esphome
    allow_partition_access: true

psram:
  speed: 200MHz

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

preferences:
  flash_write_interval: 5min

http_request:  # Needed by esp32_hosted-update and any JSON stuff
  buffer_size_rx: 2048

esp_ldo:
  # For display
  - id: ldo_dsi_power
    channel: 3
    voltage: 2.5V
  # For SD card
#  - id: ldo_sd_power
#    channel: 4
#    voltage: 2.7V

# Network hardware
esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: ${pin.int.c6_hosted.rst}
  clk_pin: ${pin.int.c6_hosted.clk}
  cmd_pin: ${pin.int.c6_hosted.cmd}
  d0_pin: ${pin.int.c6_hosted.d0}
  d1_pin: ${pin.int.c6_hosted.d1}
  d2_pin: ${pin.int.c6_hosted.d2}
  d3_pin: ${pin.int.c6_hosted.d3}
  use_psram: true

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: "C6 CoProcessor Update"
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

sensor:
  # CPU Temperature
  - platform: internal_temperature
    name: "CPU Temperature"
    id: cpu_temperature
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer"
    update_interval: 5s
    entity_category: diagnostic
