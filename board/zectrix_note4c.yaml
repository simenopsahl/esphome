labels: [esp32s3, ePaper, display]
---
# https://wiki.zectrix.com/en/hardware/note4c/quick-start
# ESP-IDF Firmwares
# https://github.com/itopinion/zectrix-note4-epd-demo/blob/main/components/zectrix_board/include/zectrix_board_config.h
# https://github.com/LazyYoun/youn-ink-fourcolor-firmware

# https://github.com/fiedoruk/emini-home/blob/main/docs/HARDWARE.md
# Schematic reference: "esphome/pinmap/schematics/esp32s3 Zectrix Note4.pdf"
# Base functions for:
# Zectrix Note4C
#

# Pins and modular GUI packages for this model
packages:
  pins: !include pins/zectrix_note4.yaml
  i2c: !include extension/internal_i2c.yaml
  epaper_base: !include ../gui/epaper/base.yaml
  epaper_theme: !include ../gui/epaper/themes/bwry4.yaml
  epaper_fonts: !include ../gui/epaper/fonts/color_gray.yaml
  epaper_chrome: !include ../gui/epaper/chrome/status_bar.yaml
  epaper_nav: !include ../gui/epaper/chrome/nav_zectrix.yaml
  epaper_info: !include ../gui/epaper/pages/info_sensors.yaml
  audio: !include
    file: module/audio/${feature.audio.hardware_module | default("zectrix_note4_audio.yaml")}
    condition: ${feature_audio_enabled | default("false")}

substitutions:
  screen_width: "300"
  screen_height: "400"
  epaper_home_page: "page_info"
  epaper_time_id: "time_rtc"
  hint_1: "GPIO0: OK (Hjem)"
  hint_2: "GPIO39: Opp (Neste)"
  hint_3: "GPIO18: Ned (Forrige / 3s Av)"
  show_battery_pct: "true"
  show_battery_volt: "true"
  time_timezone: "Europe/Oslo"
  module:
    internal:
      i2c_bus: i2c_internal
  device:
    model: "Zectrix Note4C"
    board: zectrix_note4c
    rmt_symbols_block: 48
    rtc: "true"
    psram: "true"
    framework:
      type: esp-idf
    screen:
      width: ${screen_width}
      height: ${screen_height}
  feature:
    audio:
      hardware_module: zectrix_note4_audio.yaml
      volume_initial: "0.8"

esp32:
# ESP32-S3 N16R8
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
    type: ${device.framework.type}

esphome:
  project:
    name: "Zectrix.Note4C"
    version: "1.0.0"
  on_boot:
    - priority: 800
      then:
        # Release any pad hold on GPIO17 (managed by sw_pwr_latch) and latch AVDD_3V3 audio/I2C rail (GPIO42)
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_17);
            gpio_hold_dis(GPIO_NUM_42);
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_42, 1);
            gpio_hold_en(GPIO_NUM_42);
            gpio_deep_sleep_hold_en();
    - priority: 600
      then:
        - delay: 200ms
        - pcf8563.read_time:

psram:
  mode: octal

wifi:
  use_psram: true
  enable_btm: true
  enable_rrm: true

time:
  - platform: pcf8563
    i2c_id: ${module.internal.i2c_bus}
    id: time_rtc
    address: 0x51
    update_interval: never
  - id: !extend time_homeassistant
    on_time_sync:
      - then:
          - pcf8563.write_time:

spi:
  clk_pin: ${pin.int.spi.clk}
  mosi_pin: ${pin.int.spi.mosi}

display:
  # Physical 400x300 panel (4-color B/W/Red/Yellow); LVGL portrait rotation is handled in device YAML.
  - platform: epaper_spi
    id: display_eink
    model: jd79660
    cs_pin: ${pin.display.cs}
    dc_pin: ${pin.display.dc}
    reset_pin: ${pin.display.reset}
    busy_pin:
      number: ${pin.display.busy}
      inverted: true
      mode:
        input: true
        pullup: true
    enable_pin: ${pin.display.pwr}
    init_sequence:
      - [0xE9, 0x01]
      - [0x04]
    dimensions:
      width: 400
      height: 300
    full_update_every: 1
    update_interval: never

binary_sensor:
  # Stick Up
  - platform: gpio
    id: button_up
    pin:
      number: ${pin.btn.up}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Button Up
      - lvgl.page.next:
      - script.execute: update_screen
    name: Button Up
    entity_category: diagnostic
    disabled_by_default: true
  # Button Press
  - platform: gpio
    id: button_ok
    pin:
      number: ${pin.btn.ok}
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Button OK
      - lvgl.page.show: ${epaper_home_page}
      - script.execute: update_screen
    name: Button OK
    entity_category: diagnostic
    disabled_by_default: true
  # Button Down (SW1 - also hardware power button)
  - platform: gpio
    id: button_down
    pin:
      number: ${pin.btn.down}
      inverted: true
    filters:
      - delayed_off: 10ms
    on_press:
      - logger.log: Button Down
      - lvgl.page.previous:
      - script.execute: update_screen
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - logger.log: "Button Down held for 3s - releasing battery power latch"
          - switch.turn_off: sw_pwr_latch
    name: Button Down
    entity_category: diagnostic
    disabled_by_default: true
  # Battery Charging (CHRG_L, active-low)
  - platform: gpio
    id: bat_charging
    pin:
      number: ${pin.int.bat_charging}
      inverted: true
    filters:
      - delayed_on_off: 100ms
    name: "Battery Charging"
    device_class: battery_charging
    entity_category: diagnostic
    disabled_by_default: true
  # Battery Full (STDBY_H, active-high)
  - platform: gpio
    id: bat_full
    pin:
      number: ${pin.int.bat_full}
      inverted: false
    filters:
      - delayed_on_off: 100ms
    name: "Battery Full"
    entity_category: diagnostic
    disabled_by_default: true
  # NFC Field Detection (NT3H1101/NT3H2111 NTAG I2C @ 0x55, FD pin active-low)
  - platform: gpio
    id: nfc_field
    pin:
      number: ${pin.nfc.irq}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 200ms
    on_press:
      - logger.log: "NFC RF field detected"
    name: "NFC Field"
    icon: "mdi:nfc-tap"
    entity_category: diagnostic
    disabled_by_default: true

switch:
  # Keep device powered on battery
  - platform: gpio
    pin: ${pin.int.bat_latch}
    id: sw_pwr_latch
    name: "Power Latch"
    icon: "mdi:power"
    entity_category: config
    disabled_by_default: true
    restore_mode: ALWAYS_ON
  # Power VCC for onboard NT3H1101/NT3H2111 NTAG I2C tag (0x55)
  - platform: gpio
    pin: ${pin.nfc.pwr}
    id: sw_nfc_pwr
    name: "NFC Tag Power"
    icon: "mdi:nfc"
    entity_category: config
    disabled_by_default: true
    restore_mode: ALWAYS_OFF

sensor:
  # Battery voltage
  - platform: adc
    pin: ${pin.int.bat_feedback}
    id: battery_voltage
    attenuation: 12db
    update_interval: 10s
    samples: 10
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 7
    name: "Battery Voltage"
    entity_category: diagnostic
    disabled_by_default: true
    device_class: voltage
    unit_of_measurement: V
    on_value:
      - lvgl.label.update:
          id: lbl_ep_info_bat_volt
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), isnan(x) ? "--V" : "%.2fV", x);
            return std::string(buf);
      - lambda: 'id(data_updated) = true;'
  # Battery Percent
  - platform: template
    name: "Battery"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return id(battery_voltage).state;'
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      - lvgl.label.update:
          id: lbl_ep_info_bat_pct
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), isnan(x) ? "--%%" : "%.0f%%", x);
            return std::string(buf);
      - lambda: 'id(data_updated) = true;'

status_led:
  pin:
    number: ${pin.light.led}
    ignore_strapping_warning: true
