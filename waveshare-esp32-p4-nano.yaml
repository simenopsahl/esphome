packages:
  # --- COMMON PACKAGES ---
#  <<: !include_dir_named common
#  <<: !include_dir_named bluetooth

  # --- BOARD AND MODULES ---
#  board: !include board/waveshare_esp32p4_nano.yaml
  pins: !include board/pins/waveshare_esp32p4_nano.yaml

substitutions:
  common:
    log_level: DEBUG
#    log_baud_rate: "115200"
  device2:
    name: waveshare-p4-nano
    location: "Storage"
    framework:
      type: esp-idf

      
  extension:
    i2c:
      internal:
        frequency: 400kHz
  device:
    model: 'Waveshare P4-Nano'
    rmt_symbols_block: 48
    framework:
      type: esp-idf
    name: waveshare-p4-nano
    location: "Storage"

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}
  
  project:
    name: 'Waveshare.ESP32-P4-Nano'
    version: "3.1"

esp32:
#  framework:
#    type: ${device.framework.type}

#  board: esp32-p4-evboard  
#  board: esp32-p4_r3-evboard

#  toolchain: platformio
  variant: esp32p4
#  engineering_sample: false

  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: ${device.framework.type}
    sdkconfig_options:
      CONFIG_ESP32P4_SELECTS_REV_LESS_V3: "n"
      CONFIG_ESP32P4_REV_MIN_301: "y"

#logger:
#  hardware_uart: UART0
