packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common
#  <<: !include_dir_named bluetooth

  # --- BOARD AND MODULES ---
  board: !include board/m5stack_air_quality.yaml
  grove_i2c: !include board/extension/grove_i2c.yaml
  env_iv: !include board/module/unit_env_iv.yaml

  # --- FEATURE PACKAGES ---
  combined_env_sensors: !include features/combined_env_sensors.yaml

  # --- E-PAPER PAGE BINDINGS ---
  epaper_aq_sensors: !include gui/epaper/pages/air_quality_sensors.yaml
  epaper_local_sensors: !include
    file: gui/epaper/pages/temp_single_local_sensors.yaml
    vars:
      uid: aq_local
      sensor_id: temperature_local
      value_fmt: "%.0f"
  epaper_room_series: !include
    file: gui/epaper/sections/rolling_graph_remote_series.yaml
    vars:
      uid: aq_room
      entity_id: sensor.etg2_gang_temperature
      history_attribute: temp_gang_history
      value_fmt: "%.0f"
      min_span: "2.0"

substitutions:
  common:
    log_level: WARN
#    log_baud_rate: "115200"
  device:
    name: m5s-air-quality-b62db0
    location: "Gang"
    framework:
      type: esp-idf
  epaper_rotation: "180"
  epaper_home_page: "page_local"

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
#  use_address: 192.168.69.56
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.50

lvgl:
  pages:
    - !include
      file: gui/epaper/pages/temp_single.yaml
      vars:
        uid: aq_local
        page_id: page_local
        title: "Enhet"
        invert_colors: "true"
        show_top_row: "true"
        top_left_text: "--.-"
        top_center_text: "Enhet"
        top_right_text: "--.-"
        unit: ""
    - !include gui/epaper/pages/air_quality.yaml
    - !include
      file: gui/epaper/pages/temp_single.yaml
      vars:
        uid: aq_room
        page_id: page_room
        title: "Rom"
        show_graph: "true"
        show_top_row: "true"
        top_left_text: "Rom"
        top_right_text: "°C"
        unit: ""

# Check if person is home
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.etg2_occupancy
    id: presence_detected

sensor:
  # Update top corner sub-sensor readouts on page_local (SCD40 left, SEN55 right)
  - id: !extend aq_scd40_sensor
    temperature:
      on_value:
        - lambda: |-
            char buf[16];
            if (isnan(x)) snprintf(buf, sizeof(buf), "--.-");
            else snprintf(buf, sizeof(buf), "%.1f", x);
            lv_label_set_text(id(aq_local_top_left), buf);
            id(data_updated) = true;
  - id: !extend sen55_sensor
    temperature:
      on_value:
        - lambda: |-
            char buf[16];
            if (isnan(x)) snprintf(buf, sizeof(buf), "--.-");
            else snprintf(buf, sizeof(buf), "%.1f", x);
            lv_label_set_text(id(aq_local_top_right), buf);
            id(data_updated) = true;

  # Combine sensors
  - id: !extend temperature_local
    sources:
      # Base BTC
#      - source: temperature_sht30_base_btc
      # HAT ENV III
#      - source: temperature_sht30_hat_env
#      - source: temperature_qmp6988_hat_env
      # Unit ENV III
#      - source: temperature_sht30_unit_env
#      - source: temperature_qmp6988_unit_env
      # Unit ENV IV
      - source: temperature_bmp280_unit_env
      - source: temperature_sht40_unit_env
      # Unit ENV Pro
#      - source: temperature_bme688
      # Unit CO2
#      - source: temperature_scd40_unit_co2
      # Gyro
#      - source: temperature_mpu6886
      # AirQuality
      - source: temperature_sen55
      - source: temperature_scd40_aq
    on_value:
      then:
        - lambda: 'id(data_updated) = true;'

  - id: !extend humidity_local
    sources:
      # Base BTC
#      - source: humidity_sht30_base_btc
      # HAT ENV III
#      - source: humidity_sht30_hat_env
      # Unit ENV III
#      - source: humidity_sht30_unit_env
      # Unit ENV IV
      - source: humidity_sht40_unit_env
      # Unit ENV Pro
#      - source: humidity_bme688
      # Unit CO2
#      - source: humidity_scd40_unit_co2
      # AirQuality
      - source: humidity_sen55
      - source: humidity_scd40_aq
    on_value:
      then:
        - lambda: 'id(data_updated) = true;'

  - id: !extend pressure_local
    sources:
      # HAT ENV III
#      - source: pressure_qmp6988_hat_env
      # Unit ENV III
#      - source: pressure_qmp6988_unit_env
      # Unit ENV IV
      - source: pressure_bmp280_unit_env
      # Unit ENV Pro
#      - source: pressure_bme688
    on_value:
      then:
        - lambda: 'id(data_updated) = true;'