packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common
  <<: !include_dir_named bluetooth

  # --- BOARD AND MODULES ---
  board: !include board/m5stack_core_s3se.yaml
  mbus_i2c: !include board/extension/mbus_i2c.yaml
  grove_i2c: !include board/extension/grove_i2c.yaml
  mbus_uart: !include board/extension/mbus_uart.yaml
  dual_kmeter: !include board/module/module_dual_kmeter.yaml
  module_air_quality: !include board/module/module_air_quality.yaml
  base_btc: !include board/module/base_btc.yaml
  env_iv: !include board/module/unit_env_iv.yaml
  co2: !include board/module/unit_co2.yaml
#  mic: !include board/module/chip_cs3se_mic.yaml

  # --- FEATURE PACKAGES ---
  combined_env_sensors: !include features/combined_env_sensors.yaml

  # --- GUI PACKAGES ---
  colors: !include gui/themes/colors_night_owl.yaml
  lvgl: !include gui/240x320.yaml

  # --- LVGL WIDGET PACKAGES ---
  room_temperature_widget_sensors: !include { file: gui/widgets/labels/number_sensor.yaml, vars: {
    uid: room_temp_value,
    entity_id: sensor.etg1_bad_temperature
  }}

substitutions:
  common:
    log_level: WARN
#    log_baud_rate: "115200"
  device:
    name: m5s-c3se-3e3740
    location: "Bad"
    framework:
      type: esp-idf
  module:
    internal:
      i2c_bus: i2c_mbus
  display:
    home_page: page_kmeter

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}

wifi:
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.67

# --- LVGL CLOCKS ---
time:
  - id: !extend time_rtc
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: lvgl_time_update

lvgl:
  buffer_size: 40%
  rotation: 180

binary_sensor:
  # Call sensors from HA.
  - platform: homeassistant
    entity_id: binary_sensor.etg2_simen_occupancy
    id: presence1
  - platform: homeassistant
    entity_id: binary_sensor.etg2_gang_occupancy
    id: presence2
  # Turn on display while room is occupied
  - id: !extend presence_detected
    lambda: !lambda |-
      if ( (id(presence1).state) or (id(presence2).state) ) {
        return true;
      } else {
        return false;
      }

sensor:
  # Combine sensors
  - id: !extend temperature_local
    sources:
      # Base BTC
      - source: temperature_sht30_base_btc
      # HAT ENV III
#      - source: temperature_sht30_hat_env
#      - source: temperature_qmp6988_hat_env
      # Unit ENV III
#      - source: temperature_sht30_unit_env
#      - source: temperature_qmp6988_unit_env
      # Unit ENV IV
      - source: temperature_bmp280_unit_env
      - source: temperature_sht40_unit_env
      # Unit ENV Pro
#      - source: temperature_bme688
      # Unit CO2
      - source: temperature_scd40_unit_co2
    on_value: 
      then:
        - lvgl.label.update:
            id:
              - lbl_temp_local_value
            text:
              format: "%.1f"
              args: [ 'x' ]

  - id: !extend humidity_local
    sources:
      # Base BTC
      - source: humidity_sht30_base_btc
      # HAT ENV III
#      - source: humidity_sht30_hat_env
      # Unit ENV III
#      - source: humidity_sht30_unit_env
      # Unit ENV IV
      - source: humidity_sht40_unit_env
      # Unit ENV Pro
#      - source: humidity_bme688
      # Unit CO2
      - source: humidity_scd40_unit_co2

  - id: !extend pressure_local
    sources:
      # HAT ENV III
#      - source: pressure_qmp6988_hat_env
      # Unit ENV III
#      - source: pressure_qmp6988_unit_env
      # Unit ENV IV
      - source: pressure_bmp280_unit_env
      # Unit ENV Pro
#      - source: pressure_bme688

  # extend sensors to update lvgl
  - id: !extend unit_co2_scd40_sensor
    co2:
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_co2_value
              text:
                format: "%.0f"
                args: [ 'x' ]

  - platform: homeassistant
    entity_id: sensor.etg1_bad_vvb_temperature_bottom
    id: vvb_temperature_bottom
    on_value:
      - then:
          # Update the shadow label
          - lvgl.label.update:
              id: lbl_temp_kmeter_bottom_shadow
              text:
                format: "%.1f"
                args: [ 'x' ]
          # Update the main foreground label
          - lvgl.label.update:
              id: lbl_temp_kmeter_bottom_value
              text:
                format: "%.1f"
                args: [ 'x' ]
          # Auto-calibrate the dynamic minimum
          - globals.set:
              id: tank_dynamic_min
              value: !lambda return std::min(id(tank_dynamic_min), (int)round(x * 10.0));
          # Update the bar graphic using the new dynamic globals
          - lvgl.bar.update:
              id: tank_graphic
              mode: RANGE
              # 1. Update the physical scale of the widget
              min_value: !lambda return id(tank_dynamic_min);
              max_value: !lambda return id(tank_dynamic_max);
              # 2. Keep the red indicator anchored to the top of our new dynamic max
              value: !lambda return id(tank_dynamic_max);
              # 3. Calculate the inverted thermocline using the dynamic limits
              start_value: !lambda |-
                int current = (int)round(x * 10.0);
                int min_val = id(tank_dynamic_min);
                int max_val = id(tank_dynamic_max);
                // Invert the reading
                int mapped_start = max_val - (current - min_val);
                // Safely constrain
                return std::max(min_val, std::min(max_val, mapped_start));
  - platform: homeassistant
    entity_id: sensor.etg1_bad_vvb_temperature_top
    id: vvb_temperature_top
    on_value:
      - then:
          # Update the shadow label
          - lvgl.label.update:
              id: lbl_temp_kmeter_top_shadow
              text:
                format: "%.1f"
                args: [ 'x' ]
          # Update the main foreground label
          - lvgl.label.update:
              id: lbl_temp_kmeter_top_value
              text:
                format: "%.1f"
                args: [ 'x' ]
          # Auto-calibrate the dynamic maximum
          - globals.set:
              id: tank_dynamic_max
              value: !lambda return std::max(id(tank_dynamic_max), (int)round(x * 10.0));
  - platform: homeassistant
    entity_id: sensor.etg1_bad_vvb_temperature_mix
    id: vvb_temperature_mix
    on_value:
      - then:
          - lvgl.label.update:
              id: lbl_temp_kmeter_mix_value
              text:
                format: "%.1f"
                args: [ 'x' ]
