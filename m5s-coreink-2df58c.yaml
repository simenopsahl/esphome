packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common

  # --- BOARD AND MODULES ---
  board: !include board/m5stack_coreink.yaml

  # --- EPAPER DASHBOARD PACKAGES ---
  epaper_room: !include
    file: gui/epaper/pages/temperature/remote.yaml
    vars:
      uid: t22_room
      page_id: page_room
      area_label: "Rom"
      entity_id: sensor.t22_temperature
      value_fmt: "%.0f"
      min_span: "2.0"

substitutions:
  common:
    log_level: DEBUG
#    log_baud_rate: "115200"
  device:
    name: m5s-coreink-2df58c
    location: "Storage"
    framework:
      type: esp-idf
  display:
    rotation: "90"
    home_page: "page_room"

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
  use_address: ${device.name}.local
  manual_ip:
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.74

# Check if person is home
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.etg2_occupancy
    id: ha_presence_detected
  - id: !extend presence_detected
    lambda: 'return id(ha_presence_detected).state;'
