---
# 
# Common functions for devices with an epaper display
#

substitutions:
  display:
    home_page: page_content

esphome:
  on_boot:
    - priority: -100.0
      then:
        - component.update: display_eink
        - wait_until:
            condition:
              lambda: 'return id(data_updated) == true;'
        # Wait a bit longer so all the items are received
        - delay: 10s
        - logger.log: "Initial sensor data received: Refreshing display..."
        - lambda: 'id(initial_data_received) = true;'
        - display.page.show: ${display.home_page}
        - script.execute: update_screen

time:
  - id: !extend time_homeassistant
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - if:
              condition:
                lambda: 'return id(data_updated) == true;'
              then:
                - if:
                    condition:
                      binary_sensor.is_on: presence_detected
                    then:
                      - logger.log: "Sensor data updated and activity in home detected: Refreshing display..."
                      - script.execute: update_screen
                    else:
                      - logger.log: "Sensor data updated but no activity in home - skipping display refresh."
              else:
                - logger.log: "No sensors updated - skipping display refresh."

globals:
  # Detecting if the display needs to be refreshed.
  - id: data_updated
    type: bool
    restore_value: no
    initial_value: 'false'
  # Tracking if initial data has been received.
  - id: initial_data_received
    type: bool
    restore_value: no
    initial_value: 'false'
  # Tracking display refresh count
  - id: recorded_display_refresh
    type: int
    restore_value: yes
    initial_value: '0'

  - id: epaper_bg_color
    type: Color
    restore_value: yes
    max_restore_data_length: 16
    initial_value: 'COLOR_OFF' # Default to white background
  - id: epaper_text_color
    type: Color
    restore_value: yes
    max_restore_data_length: 16
    initial_value: 'COLOR_ON' # Default to black text
  
  - id: epaper_accent1_color
    type: Color
    restore_value: yes
    max_restore_data_length: 16
    initial_value: 'Color(0, 255, 0, 0)' # Default to green (Complementary to red)
  - id: epaper_accent2_color
    type: Color
    restore_value: yes
    max_restore_data_length: 16
    initial_value: 'Color(0, 0, 255, 0)' # Default to blue (Complementary to yellow)
  - id: epaper_accent3_color
    type: Color
    restore_value: yes
    max_restore_data_length: 16
    initial_value: 'Color(255, 0, 0, 0)' # Default to red (Complementary to green)

color:
  - id: color_black
    red_int: 0
    green_int: 0
    blue_int: 0
    white_int: 0
  - id: color_white
    red_int: 255
    green_int: 255
    blue_int: 255
    white_int: 0
  - id: color_red
    red_int: 255
    green_int: 0
    blue_int: 0
    white_int: 0
  - id: color_green
    red_int: 0
    green_int: 255
    blue_int: 0
    white_int: 0
  - id: color_blue
    red_int: 0
    green_int: 0
    blue_int: 255
    white_int: 0
  - id: color_yellow
    red_int: 255
    green_int: 255
    blue_int: 0
    white_int: 0

sensor:
  # Create sensors for monitoring remotely.
  - platform: template
    name: "Display Last Update"
    device_class: timestamp
    entity_category: "diagnostic"
    id: display_last_update
  - platform: template
    id: recorded_display_refresh_sensor
    name: "Recorded Display Refresh"
    accuracy_decimals: 0
    unit_of_measurement: "Refreshes"
    state_class: "total_increasing"
    entity_category: "diagnostic"
    lambda: 'return id(recorded_display_refresh);'
    # Alternate epaper colors
    on_value:
      - then:
          - lambda: |-
              // This C++ logic updates the color globals
              if (((int)x) % 5 == 0) {
                // On refreshes 0, 5, 10, etc., set Black background, White text
                id(epaper_bg_color) = COLOR_ON;
                id(epaper_text_color) = COLOR_OFF;
                id(epaper_accent1_color) = Color(255, 0, 0, 0);
                id(epaper_accent2_color) = Color(255, 255, 0, 0);
                id(epaper_accent3_color) = Color(0, 255, 0, 0);
              } else {
                // On all other refreshes, set White background, Black text
                id(epaper_bg_color) = COLOR_OFF;
                id(epaper_text_color) = COLOR_ON;
                id(epaper_accent1_color) = Color(0, 255, 0, 0);
                id(epaper_accent2_color) = Color(0, 0, 255, 0);
                id(epaper_accent3_color) = Color(255, 0, 0, 0);
              }

# Buttons in Home Assistant
button:
  - platform: template
    id: btn_refresh_screen
    name: "Refresh Screen"
    entity_category: config
    on_press:
      - then:
          - script.execute: update_screen

  - platform: template
    id: btn_repair_screen
    name: "Repair Screen"
    entity_category: config
    on_press:
      - then:
          - script.wait: update_screen
          - logger.log: "Trying to repair screen"
          - repeat: 
              count: 5
              then:
                - script.wait: update_screen
                - script.wait: repair_script
                - script.execute: repair_script
          - script.wait: repair_script
          - logger.log: "Repair script finished"
          - display.page.show: ${display.home_page}

script:
  # Script for updating screen - Refresh display and publish refresh count and time.
  - id: update_screen
    then:
      - lambda: 'id(data_updated) = false;'
      - component.update: display_eink
      - lambda: 'id(recorded_display_refresh) += 1;'
      - lambda: 'id(display_last_update).publish_state(id(time_homeassistant).now().timestamp);'

  - id: repair_script
    then:
      - display.page.show: page_black
      - component.update: display_eink
      - lambda: 'id(recorded_display_refresh) += 1;'
      - logger.log: "Black screen"
      - delay: 20s
      - display.page.show: page_white
      - component.update: display_eink
      - lambda: 'id(recorded_display_refresh) += 1;'
      - logger.log: "White screen"
      - delay: 20s
      - display.page.show: page_black
      - component.update: display_eink
      - lambda: 'id(recorded_display_refresh) += 1;'
      - logger.log: "Black screen"
      - delay: 20s
