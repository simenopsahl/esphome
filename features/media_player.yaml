# https://esphome.io/components/i2s_audio/
# https://esphome.io/components/media_player/speaker/
# https://esphome.io/components/speaker/mixer/
# https://esphome.io/components/speaker/resampler/
# https://esphome.io/components/sensor/sound_level/

# Media Player package for devices with an i2s_speaker (and optional i2s_mic via common_mic.yaml)

substitutions:
  feature_audio_enabled: "true"
  sound_file_boot_default: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_triple_press.flac
  sound_file_speaker_enable_default: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac

esphome:
  on_boot:
    - priority: 375
      then:
        # Safety net: if HA never connects.
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;

api:
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: play_boot_chime

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_chime_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: mic_disabled
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the phase of the voice assistant (1=idle, 2=waiting, 3=listening, 4=thinking, 5=replying, 10=not_ready, 11=error).
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: '10'
  # Global variable storing if a timer is active
  - id: is_timer_active
    type: bool
    restore_value: false
    initial_value: 'false'

speaker:
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    task_stack_in_psram: ${device.psram | default("false")}
    num_channels: ${feature.audio.channels | default("1")}
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # The mixer needs both inputs at one sample rate; these resample if needed.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    task_stack_in_psram: ${device.psram | default("false")}
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    task_stack_in_psram: ${device.psram | default("false")}

media_player:
  - platform: speaker
    id: speaker_media_player
    name: None
    internal: False
    task_stack_in_psram: ${device.psram | default("false")}
    buffer_size: ${feature.audio.buffer_size | default("1000000")}
    volume_increment: 0.01
    volume_initial: ${feature.audio.volume_initial | default("0.6")}
    volume_min: ${feature.audio.volume_min | default("0.4")}
    volume_max: ${feature.audio.volume_max | default("0.8")}
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      # stereo is pointless for announcements
      num_channels: 1
      sample_rate: 48000        # what Music Assistant serves
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      # media stream could benefit from multiple channels if available
      num_channels: ${feature.audio.channels | default("1")}
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      # Amp follows playback: turn it on the instant audio starts. It stays on
      # afterwards (the speaker then holds the line at clean silence), so there
      # is no per-sound clicking - only the boot window is silent.
      - if:
          condition:
            or:
              - media_player.is_announcing:
              - lambda: 'return id(speaker_media_player)->state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - if:
                condition:
                  switch.is_off: amp_enable
                then:
                  - switch.turn_on: amp_enable
      - if:
          condition:
            - not:
                media_player.is_announcing:
            - lambda: 'return !(${feature.voice.ducking_guard_expr | default("false")});'
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
    files:
      - id: boot_sound_custom
        file: ${feature.audio.sound_file_boot | default(sound_file_boot_default)}
      - id: speaker_enable_sound
        file: ${feature.audio.sound_file_speaker_enable | default(sound_file_speaker_enable_default)}

switch:
  - id: !extend amp_enable
    on_turn_on:
      - if:
          condition:
            - lambda: 'return id(boot_chime_done);'
            - lambda: 'return !id(init_in_progress);'
            - switch.is_on: boot_sound
            - lambda: 'return !id(mic_disabled);'
            - not:
                media_player.is_announcing: speaker_media_player
            - lambda: 'return id(speaker_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - delay: 250ms            # let the amplifier settle
            - script.execute:
                id: play_sound
                priority: false
                sound_file: !lambda return id(speaker_enable_sound);

  - platform: template
    id: boot_sound
    name: Boot sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

script:
  # Optional hook executed whenever voice_assistant_phase or timer state changes.
  # Boards with status LEDs or displays can !extend this script to update their UI.
  - id: on_voice_assistant_phase_change
    mode: restart
    then:
      - lambda: |-
          ESP_LOGD("voice_assistant", "Phase -> %d", id(voice_assistant_phase));

  # One-shot "ready" chime. On mic+speaker boards it runs after the mic is
  # turned on: the speaker is a slave to the mic's I2S clock, so playing before
  # the mic is capturing hangs the announcement.
  - id: play_boot_chime
    mode: single
    then:
      - if:
          condition:
            - lambda: 'return !id(boot_chime_done);'
          then:
            - if:
                condition:
                  - switch.is_on: boot_sound
                  - lambda: 'return !id(mic_disabled);'
                  - lambda: 'return !(${feature.audio.mute_boot_chime_expr | default("false")});'
                then:
                  - delay: 1s            # let the I2S clock settle
                  - script.execute:
                      id: play_sound
                      priority: true
                      sound_file: !lambda return id(boot_sound_custom);
                  - delay: 2s            # wait for boot chime to finish playing!
            - lambda: id(boot_chime_done) = true;

  # ESPHome 2026.10 made audio files const; 2026.8/2026.9 still take a mutable
  # pointer in play_file(). A const parameter accepts both, and the const_cast
  # below keeps play_file() compiling on either. The type is spelled with
  # add_const_t because script parameter types may not contain spaces.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: "std::add_const_t<audio::AudioFile>*"
    then:
      - lambda: |-
          if (priority) {
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(speaker_media_player)->state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(speaker_media_player)->play_file(const_cast<audio::AudioFile *>(sound_file), true, false);
          }
