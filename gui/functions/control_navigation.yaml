# Display navigation from Home Assistant

esphome:
  on_boot:
    - priority: -500
      then:
        - script.execute: go_home

script:
  # Optional post-navigation hook (extended by `gui/epaper/base.yaml` to trigger `update_screen`)
  - id: on_page_navigate
    then:
      - lambda: ""

button:
  # Previous page button
  - platform: template
    id: btn_previous_page
    name: "Previous page"
    icon: mdi:page-previous
    entity_category: config
    on_press:
      - then:
          - lvgl.page.previous:
          - script.execute: on_page_navigate
  # Home page button
  - platform: template
    id: btn_home_page
    name: "Home page"
    icon: mdi:home-variant
    entity_category: config
    on_press:
      - then:
          - script.execute: go_home
          - script.execute: on_page_navigate
  # Next page button
  - platform: template
    id: btn_next_page
    name: "Next page"
    icon: mdi:page-next
    entity_category: config
    on_press:
      - then:
          - lvgl.page.next:
          - script.execute: on_page_navigate

text_sensor:
  # Current page text sensor (updated by `set_page_title` in chrome/base & epaper/base)
  - platform: template
    id: sensor_current_page
    name: "Current page"
    icon: mdi:page-layout-header
    entity_category: diagnostic
