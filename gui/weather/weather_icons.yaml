---
# Weather icons
# https://github.com/manifestinteractive/weather-underground-icons.git

substitutions:
  suffix: "${size}"

image:
  - platform: file
    file: gui/img/weather/yr_svg_darkmode/nt_clear.svg
    id: clear_night_${suffix}
    resize: ${size}x${size}
    type: RGB565
    transparency: alpha_channel

  - platform: file
    file: gui/img/weather/yr_svg_darkmode/cloudy.svg
    id: cloudy_${suffix}
    resize: ${size}x${size}
    type: RGB565
    transparency: alpha_channel

  - platform: file
