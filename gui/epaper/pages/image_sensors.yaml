# Companion image assets & cycling script for `gui/epaper/pages/image.yaml`
# Override `epaper_image_dir` (e.g. `gui/img/eink/spectra6` on Spectra 6 boards).

substitutions:
  epaper_image_dir: "gui/img/eink"
  epaper_image_type: "RGB565"

globals:
  - id: epaper_image_index
    type: int
    restore_value: no
    initial_value: "0"

image:
  - platform: file
    id: i_selma_1
    file: ${epaper_image_dir}/selma_1_480x800.png
    type: ${epaper_image_type}
  - platform: file
    id: i_selma_2
    file: ${epaper_image_dir}/selma_2_480x800.png
    type: ${epaper_image_type}
  - platform: file
    id: i_selma_3
    file: ${epaper_image_dir}/selma_3_480x800.png
    type: ${epaper_image_type}

script:
  - id: epaper_next_image
    mode: single
    then:
      - lambda: |-
          const int idx = id(epaper_image_index) % 3;
          id(epaper_image_index) = (idx + 1) % 3;
      - if:
          condition:
            lambda: 'return id(epaper_image_index) == 1;'
          then:
            - lvgl.image.update:
                id: img_ep_photo
                src: i_selma_1
      - if:
          condition:
            lambda: 'return id(epaper_image_index) == 2;'
          then:
            - lvgl.image.update:
                id: img_ep_photo
                src: i_selma_2
      - if:
          condition:
            lambda: 'return id(epaper_image_index) == 0;'
          then:
            - lvgl.image.update:
                id: img_ep_photo
                src: i_selma_3
