# Companion image assets & cycling script for `gui/epaper/pages/image/page.yaml`
# Override `display.page.image.dir` (e.g. `gui/img/eink/spectra6` on Spectra 6 boards).

packages:
  picture_assets: !include
    file: ../../sections/picture/assets.yaml
    condition: ${ "false" if (epaper_image_assets_loaded | default("false")) == "true" else "true" }

globals:
  - id: epaper_image_index
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: epaper_next_image
    mode: single
    then:
      - lambda: |-
          const int idx = id(epaper_image_index) % 3;
          id(epaper_image_index) = (idx + 1) % 3;
      - if:
          condition:
            lambda: 'return id(epaper_image_index) == 1;'
          then:
            - lvgl.image.update:
                id: img_ep_photo
                src: i_selma_1
      - if:
          condition:
            lambda: 'return id(epaper_image_index) == 2;'
          then:
            - lvgl.image.update:
                id: img_ep_photo
                src: i_selma_2
      - if:
          condition:
            lambda: 'return id(epaper_image_index) == 0;'
          then:
            - lvgl.image.update:
                id: img_ep_photo
                src: i_selma_3
