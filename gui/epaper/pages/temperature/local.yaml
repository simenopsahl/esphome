# Self-contained local ESPHome temperature e-Paper page package
# (`gui/epaper/pages/temperature/local.yaml`).
# Binds a local sensor (`sensor_id`) to `page.yaml` without a 36-point rolling graph ring buffer.
#
# Required vars: `uid`, `sensor_id`
# Optional vars: `page_id` ("page_room"), `area_label` ("Rom"), `icon` ("\U000F050F"),
#                `unit` ("°C"), `value_fmt` ("%.0f"), `invert_colors` ("false")

lvgl:
  pages:
    - !include page.yaml

sensor:
  - id: !extend ${sensor_id}
    on_value:
      - lambda: |-
          char buf[24];
          if (isnan(x)) {
            snprintf(buf, sizeof(buf), "--");
          } else {
            const char *fmt = "${value_fmt | default('%.0f')}";
            float clean_val = x;
            if ((strcmp(fmt, "%.0f") == 0 && fabsf(x) < 0.5f) ||
                (strcmp(fmt, "%.1f") == 0 && fabsf(x) < 0.05f)) {
              clean_val = 0.0f;
            }
            snprintf(buf, sizeof(buf), fmt, clean_val);
          }
          lv_label_set_text(id(${uid}_value), buf);
          id(data_updated) = true;
      - script.execute: epaper_mark_initial_data
