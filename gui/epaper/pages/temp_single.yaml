# Reusable single-temperature e-Paper LVGL page (`gui/epaper/pages/temp_single.yaml`).
# Designed for 200x200 panels (`m5s-air-quality`, `m5s-coreink`) and scales cleanly via theme fonts.
#
# Optional vars:
#   uid:              "temp_single"   # Unique widget ID prefix per page instance
#   page_id:          "page_room"     # LVGL page ID
#   title:            "Rom"           # Chrome title passed to set_page_title
#   icon:             "\U000F050F"    # Chrome icon glyph (default MDI thermometer)
#   unit:             "°C"            # Hero side unit label ("" hides side unit)
#   show_graph:       "false"         # Top rolling 12h graph strip (`${uid}_plot_box` + `${uid}_line`)
#   graph_height:     auto            # Graph strip height in px (default 46 on <=240px)
#   show_top_row:     "false"         # Optional 3-slot top row (`${uid}_top_left`/`_top_center`/`_top_right`)
#   top_left_text:    ""              # Initial left sub-label ("" keeps hidden)
#   top_center_text:  ""              # Initial center sub-label ("" keeps hidden)
#   top_right_text:   ""              # Initial right sub-label ("" keeps hidden)
#   show_thermometer: auto            # Left thermometer glyph beside hero value
#   invert_colors:    "false"         # Polarity invert (e.g. black background on AQ `page_local`)
#   value_font:       "font_fl"       # Hero temperature font

id: ${page_id | default("page_room")}
styles: epaper_page_style
pad_top: >-
  ${ (epaper_header_h|int) + (epaper_nav_pad_top|int)
     if (epaper_show_header | default("true")) == "true"
     else ((epaper_nav_pad_top|int) if (show_graph | default("false")) == "true"
     else ((epaper_pad_y|int) + (epaper_nav_pad_top|int))) }
pad_bottom: ${ (epaper_footer_h|int) + (epaper_nav_pad_bottom|int) }
pad_left: >-
  ${ (epaper_nav_pad_left|int)
     if (show_graph | default("false")) == "true"
     else ((epaper_pad_x|int) + (epaper_nav_pad_left|int)) }
pad_right: >-
  ${ (epaper_nav_pad_right|int)
     if (show_graph | default("false")) == "true"
     else ((epaper_pad_x|int) + (epaper_nav_pad_right|int)) }
scrollbar_mode: "OFF"
on_load:
  - script.execute:
      id: set_page_title
      title: "${title | default('Rom')}"
      icon: "${icon | default('\U000F050F')}"
  - lambda: |-
      bool want_inv = (std::string("${invert_colors | default('false')}") == "true");
      if (id(epaper_page_inverted) != want_inv) {
        id(epaper_page_inverted) = want_inv;
      }
  - script.execute: apply_epaper_theme_refresh
  - script.execute: epaper_refresh_rolling_graphs
on_unload:
  - lambda: |-
      if (id(epaper_page_inverted)) {
        id(epaper_page_inverted) = false;
      }
  - script.execute: apply_epaper_theme_refresh
layout:
  type: flex
  flex_flow: COLUMN
  flex_align_main: SPACE_BETWEEN
  flex_align_cross: CENTER
  pad_row: 0
widgets:
  # Optional top rolling 12h polyline graph strip (compatible with `_rolling_graph_core.yaml`)
  - obj:
      id: ${uid | default("temp_single")}_plot_box
      width: 100%
      height: ${ graph_height | default("46" if ([screen_width|int, screen_height|int]|max) <= 240 else "90") }
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollbar_mode: "OFF"
      hidden: ${ "false" if (show_graph | default("false")) == "true" else "true" }
      widgets:
        - line:
            id: ${uid | default("temp_single")}_line
            styles: epaper_line_style
            width: 100%
            height: 100%
            align: TOP_LEFT
            pad_all: 0
            line_width: ${ line_width | default("4" if ([screen_width|int, screen_height|int]|min) <= 300 else "6") }
            points:
              - x: 0
                y: 20
              - x: 100
                y: 20

  # Optional top label/sub-sensor row (`Enhet` + twin temps, or `Rom` + `°C`)
  - obj:
      id: ${uid | default("temp_single")}_top_row
      width: 100%
      height: SIZE_CONTENT
      bg_opa: TRANSP
      border_width: 0
      pad_top: 0
      pad_bottom: 0
      pad_left: ${ (epaper_pad_x|int) if (show_graph | default("false")) == "true" else 0 }
      pad_right: ${ (epaper_pad_x|int) if (show_graph | default("false")) == "true" else 0 }
      scrollbar_mode: "OFF"
      hidden: ${ "false" if (show_top_row | default("false")) == "true" else "true" }
      layout:
        type: flex
        flex_flow: ROW
        flex_align_main: SPACE_BETWEEN
        flex_align_cross: CENTER
      widgets:
        - label:
            id: ${uid | default("temp_single")}_top_left
            styles: epaper_fg_text_style
            text: "${top_left_text | default('')}"
            text_font: ${top_side_font | default("font_lg")}
            hidden: ${ "false" if (top_left_text | default("")) else "true" }
        - label:
            id: ${uid | default("temp_single")}_top_center
            styles: epaper_fg_text_style
            text: "${top_center_text | default('')}"
            text_font: ${top_center_font | default("font_xl")}
            hidden: ${ "false" if (top_center_text | default("")) else "true" }
        - label:
            id: ${uid | default("temp_single")}_top_right
            styles: epaper_fg_text_style
            text: "${top_right_text | default('')}"
            text_font: ${top_right_font | default(top_side_font | default("font_lg"))}
            hidden: ${ "false" if (top_right_text | default("")) else "true" }

  # Centered hero temperature row
  - obj:
      id: ${uid | default("temp_single")}_hero
      width: 100%
      flex_grow: 1
      bg_opa: TRANSP
      border_width: 0
      pad_top: 0
      pad_bottom: 0
      pad_left: ${ (epaper_pad_x|int) if (show_graph | default("false")) == "true" else 0 }
      pad_right: ${ (epaper_pad_x|int) if (show_graph | default("false")) == "true" else 0 }
      scrollbar_mode: "OFF"
      layout:
        type: flex
        flex_flow: ROW
        flex_align_main: >-
          ${ "SPACE_BETWEEN"
             if ((show_thermometer | default("false" if (show_top_row | default("false")) == "true" else "true")) == "true"
                 and (unit | default("°C")) != ""
                 and (show_top_row | default("false")) == "false")
             else "CENTER" }
        flex_align_cross: CENTER
        pad_column: 4
      widgets:
        - label:
            id: ${uid | default("temp_single")}_thermometer
            styles: epaper_fg_text_style
            text: "\U000F050F"
            text_font: mdi_lg
            hidden: >-
              ${ "false"
                 if (show_thermometer | default("false" if (show_top_row | default("false")) == "true" else "true")) == "true"
                 else "true" }
        - label:
            id: ${uid | default("temp_single")}_value
            styles: epaper_fg_text_style
            text: "--"
            text_font: ${value_font | default("font_fl")}
        - label:
            id: ${uid | default("temp_single")}_unit
            styles: epaper_fg_text_style
            text: "${unit | default('°C')}"
            text_font: ${unit_font | default("font_xl")}
            hidden: >-
              ${ "false"
                 if ((unit | default("°C")) != "" and (show_top_row | default("false")) == "false")
                 else "true" }
