# Two-column Daily Info Bento page — Large Panel layout (`gui/epaper/pages/daily/page_large.yaml`)
# Automatically selected by `gui/epaper/pages/daily/main.yaml` when `max(width, height) > 960`
# (e.g. Seeed reTerminal E1003 `1872x1404`):
#   Left column:  Weather forecast -> Divider -> FolloRen -> Divider -> Bus departures
#   Right column: NordPool graph   -> Divider -> Picture  -> Divider -> Car status

id: ${epaper_daily_page_id | default("page_daily")}
styles: epaper_page_style
pad_top: ${ (epaper_header_h|int) + 14 + (epaper_nav_pad_top|int) }
pad_bottom: ${ (epaper_footer_h|int) + 14 + (epaper_nav_pad_bottom|int) }
pad_left: ${ (epaper_pad_x|int) + (epaper_nav_pad_left|int) }
pad_right: ${ (epaper_pad_x|int) + (epaper_nav_pad_right|int) }
scrollbar_mode: "OFF"
on_load:
  - script.execute:
      id: set_page_title
      icon: "\U000F02DC"
      title: "${page_title | default('Info')}"
  - script.execute: epaper_update_nordpool_chart
widgets:
  - obj:
      id: cont_ep_daily_root
      width: 100%
      height: 100%
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollbar_mode: "OFF"
      layout:
        type: grid
        grid_columns: [FR(1), CONTENT, FR(1)]
        grid_rows: [FR(1)]
        pad_column: 24
      widgets:
        # Left Column: Weather, FolloRen, Transit
        - obj:
            id: col_ep_daily_left
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: SPACE_BETWEEN
            widgets:
              - !include ../../sections/weather_forecast/section.yaml
              - obj:
                  width: 100%
                  height: 4
                  styles: epaper_accent2_style
              - !include ../../sections/folloren/section.yaml
              - obj:
                  width: 100%
                  height: 4
                  styles: epaper_accent3_style
              - !include ../../sections/bus_departures/section.yaml

        # Center vertical divider
        - obj:
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            grid_cell_y_align: STRETCH
            width: 4
            height: 100%
            styles: epaper_accent1_style

        # Right Column: NordPool graph, Picture, Car status
        - obj:
            id: col_ep_daily_right
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: SPACE_BETWEEN
            widgets:
              - !include ../../sections/nordpool_graph/section.yaml
              - obj:
                  width: 100%
                  height: 4
                  styles: epaper_accent2_style
              - !include ../../sections/picture/section.yaml
              - obj:
                  width: 100%
                  height: 4
                  styles: epaper_accent3_style
              - !include ../../sections/car_status/section.yaml
