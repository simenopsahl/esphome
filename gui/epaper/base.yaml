# Core LVGL engine, e-Paper refresh pipeline, top-layer overlays, and shared automation.
#
# Replaces `features/epaper.yaml` for LVGL-migrated e-Paper devices.
# Automatically includes the board-configured theme (`display.theme`), font pack (`display.fonts`),
# status bar chrome, bezel navigation (`display.nav`), and optional `page_info` (`display.page.info.include`).

packages:
  epaper_defaults: !include _defaults.yaml
  epaper_theme: !include themes/${epaper.theme}.yaml
  epaper_fonts: !include fonts/${epaper.fonts}.yaml
  epaper_nav: !include chrome/nav_${epaper.nav}.yaml
  epaper_chrome: !include chrome/status_bar.yaml
  epaper_info: !include pages/info/sensors.yaml
  control_navigation: !include ../functions/control_navigation.yaml

substitutions:
  epaper:
    theme: "bw"
    fonts: "bw"
    nav: "none"

  # Flat internal bridges for cross-package ESPHome Jinja expressions
  _ep_rtc: "${device.rtc}"
  _ep_time_id: ${ "time_rtc" if _ep_rtc == "true" else "time_homeassistant" }
  _ep_rotation: "${display.rotation}"
  _ep_show_header: "${display.chrome.header}"
  _ep_status_in_footer: "${display.chrome.status_in_footer}"
  _ep_temp_area_label: "${display.page.temperature.area_label}"
  _ep_info_skip: "${display.page.info.skip}"
  _ep_info_bat_pct: "${display.page.info.show_battery_pct}"
  _ep_info_bat_volt: "${display.page.info.show_battery_volt}"
  _ep_info_temp: "${display.page.info.show_temp}"
  _ep_info_hum: "${display.page.info.show_humidity}"
  _ep_info_sd: "${display.page.info.show_sd}"
  _ep_info_hint_1: "${display.page.info.hint_1}"
  _ep_info_hint_2: "${display.page.info.hint_2}"
  _ep_info_hint_3: "${display.page.info.hint_3}"

  # Effective logical screen dimensions after display.rotation
  screen_width: ${ panel_height if (_ep_rotation|string) in ["90", "270"] else panel_width }
  screen_height: ${ panel_width if (_ep_rotation|string) in ["90", "270"] else panel_height }

  # Responsive chrome geometry derived from logical display dimensions
  epaper_header_h: >-
    ${ 24 if ([screen_width|int, screen_height|int]|max) <= 240 else
       (34 if ([screen_width|int, screen_height|int]|min) <= 300 else
       (44 if ([screen_width|int, screen_height|int]|max) <= 960 else 88)) }
  epaper_footer_h: >-
    ${ 20 if ([screen_width|int, screen_height|int]|max) <= 240 else
       (26 if ([screen_width|int, screen_height|int]|min) <= 300 else
       (32 if ([screen_width|int, screen_height|int]|max) <= 960 else 56)) }
  epaper_pad_x: >-
    ${ 4 if ([screen_width|int, screen_height|int]|max) <= 240 else
       (14 if ([screen_width|int, screen_height|int]|max) <= 400 else
       (20 if ([screen_width|int, screen_height|int]|max) <= 960 else 40)) }
  epaper_pad_y: >-
    ${ 4 if ([screen_width|int, screen_height|int]|max) <= 240 else
       (8 if ([screen_width|int, screen_height|int]|max) <= 400 else
       (14 if ([screen_width|int, screen_height|int]|max) <= 960 else 28)) }

globals:
  - id: data_updated
    type: bool
    restore_value: no
    initial_value: "false"
  - id: initial_data_received
    type: bool
    restore_value: no
    initial_value: "false"
  - id: recorded_display_refresh
    type: int
    restore_value: yes
    initial_value: "0"

api:
  on_client_connected:
    - delay: 1500ms
    - script.execute: epaper_on_api_connected

esphome:
  on_boot:
    - priority: -100
      then:
        - wait_until:
            condition:
              lambda: 'return id(data_updated) && id(initial_data_received);'
        - lvgl.widget.hide: epaper_boot_overlay
        - script.execute: go_home
        - script.execute: update_screen

binary_sensor:
  # Occupancy gate for scheduled /5 min refreshes (override with !extend in device YAML)
  - platform: template
    id: presence_detected
    lambda: 'return true;'

sensor:
  - platform: template
    id: display_last_update
    name: "Siste oppdatering"
    device_class: timestamp
    entity_category: diagnostic

  - platform: template
    id: recorded_display_refresh_sensor
    name: "Antall oppdateringer"
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: 'return id(recorded_display_refresh);'

button:
  - platform: template
    id: btn_refresh_screen
    name: "Oppdater skjerm"
    icon: "mdi:refresh"
    on_press:
      - script.execute: update_screen

  - platform: template
    id: btn_repair_screen
    name: "Reparer skjerm"
    icon: "mdi:broom"
    entity_category: config
    on_press:
      - script.execute: repair_script

time:
  - id: !extend ${_ep_time_id}
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - if:
              condition:
                and:
                  - binary_sensor.is_on: presence_detected
                  - lambda: 'return id(data_updated) && id(initial_data_received);'
              then:
                - script.execute: update_screen

script:
  - id: go_home
    then:
      - lvgl.page.show:
          id: ${display.home_page}
          animation: NONE
          time: 0ms

  - id: !extend on_page_navigate
    then:
      - script.execute: update_screen

  # Safe base defaults extended by `gui/epaper/chrome/status_bar.yaml`
  - id: set_page_title
    parameters:
      title: string
      icon: string
    then:
      - lambda: |-
          (void) icon;
      - if:
          condition:
            lambda: 'return !title.empty();'
          then:
            - text_sensor.template.publish:
                id: sensor_current_page
                state: !lambda 'return title;'

  - id: epaper_refresh_status
    mode: single
    then:
      - lambda: ""

  - id: epaper_hide_chrome
    mode: queued
    max_runs: 2
    then:
      - lambda: ""

  - id: epaper_show_chrome
    mode: queued
    max_runs: 2
    then:
      - lambda: ""

  # Dispatcher extended by each `rolling_graph` instance to trigger layout draw on page load
  - id: epaper_refresh_rolling_graphs
    mode: single
    then:
      - lambda: ""

  # Dispatcher extended by `rolling_graph/remote_series.yaml` after HA API connects and subscribes to actions
  - id: epaper_on_api_connected
    mode: single
    then:
      - lambda: ""

  # Latches `initial_data_received` shortly after the first Home Assistant display push arrives
  - id: epaper_mark_initial_data
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(initial_data_received);'
          then:
            - delay: 1s
            - lambda: |-
                id(initial_data_received) = true;
                id(data_updated) = true;

  # Single-shot LVGL render + physical e-Paper flush
  - id: update_screen
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(initial_data_received);'
          then:
            - lvgl.widget.hide: epaper_boot_overlay
          else:
            - lvgl.widget.show: epaper_boot_overlay
      - globals.set:
          id: data_updated
          value: "false"
      - lambda: |-
          id(recorded_display_refresh) += 1;
          id(recorded_display_refresh_sensor).publish_state(id(recorded_display_refresh));
      - script.execute: apply_epaper_theme_refresh
      - script.execute: epaper_refresh_status
      - lvgl.resume:
          lvgl_id: lvgl_comp
      - wait_until:
          condition:
            lvgl.is_paused:
              lvgl_id: lvgl_comp
          timeout: 2s
      - component.update: display_eink
      - lambda: |-
          auto t = id(${_ep_time_id}).now();
          if (t.is_valid()) {
            id(display_last_update).publish_state(t.timestamp);
          }

  # Anti-burn-in full-panel scrubber cycling Black <-> White on `top_layer`
  - id: repair_script
    mode: single
    then:
      - lvgl.widget.show: epaper_scrubber_overlay
      - lambda: 'lv_obj_move_foreground(id(epaper_scrubber_overlay));'
      - repeat:
          count: ${display.scrubber_cycles}
          then:
            - lvgl.style.update:
                id: epaper_scrubber_style
                bg_color: c_black
            - lvgl.resume:
                lvgl_id: lvgl_comp
            - wait_until:
                condition:
                  lvgl.is_paused:
                    lvgl_id: lvgl_comp
                timeout: 2s
            - component.update: display_eink
            - delay: 5s
            - lvgl.style.update:
                id: epaper_scrubber_style
                bg_color: c_white
            - lvgl.resume:
                lvgl_id: lvgl_comp
            - wait_until:
                condition:
                  lvgl.is_paused:
                    lvgl_id: lvgl_comp
                timeout: 2s
            - component.update: display_eink
            - delay: 5s
      - lvgl.widget.hide: epaper_scrubber_overlay
      - script.execute: update_screen

lvgl:
  id: lvgl_comp
  displays:
    - display_eink
  rotation: ${display.rotation}
  buffer_size: ${display.buffer_size}
  default_font: font_md
  paused: true
  resume_on_input: false
  theme: !include themes/lvgl_theme.yaml
  style_definitions: !include styles/main.yaml
  on_draw_end:
    - then:
        - lvgl.pause:
            show_snow: false
  top_layer:
    widgets:
      - obj:
          id: epaper_scrubber_overlay
          width: 100%
          height: 100%
          hidden: true
          styles: epaper_scrubber_style
      - container:
          id: epaper_boot_overlay
          width: 100%
          height: 100%
          hidden: false
          styles: epaper_overlay_style
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_main: CENTER
            flex_align_cross: CENTER
            flex_align_track: CENTER
            pad_row: 8
          widgets:
            - label:
                id: lbl_epaper_boot_title
                text: "Venter på data..."
                text_font: font_lg
            - label:
                id: lbl_epaper_boot_device
                text: "${device.name}"
                text_font: font_sm
                styles: epaper_muted_style
  pages:
    - !include pages/info/page.yaml
