# 16-level Grayscale e-Paper theme (e.g. Seeed reTerminal E1003 IT8951).

substitutions:
  epaper_invert_every_5th: "false"
  epaper_invert_accents: "true"

packages:
  epaper_theme_base: !include { file: _base.yaml }

color:
  - id: c_ep_bg
    hex: "FFFFFF"
  - id: c_ep_fg
    hex: "000000"
  - id: c_ep_muted
    hex: "555555"
  - id: c_ep_divider
    hex: "000000"
  - id: c_ep_accent_1
    hex: "222222"
  - id: c_ep_accent_2
    hex: "777777"
  - id: c_ep_accent_3
    hex: "444444"
  - id: c_ep_wifi
    hex: "000000"
  - id: c_ep_ha
    hex: "000000"
  - id: c_ep_home
    hex: "000000"
