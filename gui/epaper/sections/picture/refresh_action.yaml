# Action list executed on every display refresh when `img_ep_daily_photo` is present (> 960px panels).
- lambda: |-
    const int idx = id(epaper_daily_image_index) % 3;
    id(epaper_daily_image_index) = (idx + 1) % 3;
- if:
    condition:
      lambda: 'return id(epaper_daily_image_index) == 1;'
    then:
      - lvgl.image.update:
          id: img_ep_daily_photo
          src: i_selma_1
- if:
    condition:
      lambda: 'return id(epaper_daily_image_index) == 2;'
    then:
      - lvgl.image.update:
          id: img_ep_daily_photo
          src: i_selma_2
- if:
    condition:
      lambda: 'return id(epaper_daily_image_index) == 0;'
    then:
      - lvgl.image.update:
          id: img_ep_daily_photo
          src: i_selma_3
