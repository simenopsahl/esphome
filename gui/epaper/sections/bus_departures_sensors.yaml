# Companion sensor bindings for `gui/epaper/sections/bus_departures.yaml`

substitutions:
  epaper_data_entity: "sensor.epaper_data_general"

text_sensor:
  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: bus_bregnefaret_line_0
    id: ep_bus_line_0
    internal: true
    on_value:
      - lambda: |-
          std::string s = "510 Drøbak";
          if (!x.empty() && x != "unknown" && x != "unavailable") {
            s += (x[0] == ' ' ? "" : " ") + x;
          }
          lv_label_set_text(id(lbl_ep_bus_line_0), s.c_str());
          id(data_updated) = true;

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: bus_bregnefaret_line_1
    id: ep_bus_line_1
    internal: true
    on_value:
      - lambda: |-
          std::string s = "510 Drøbak";
          if (!x.empty() && x != "unknown" && x != "unavailable") {
            s += (x[0] == ' ' ? "" : " ") + x;
          }
          lv_label_set_text(id(lbl_ep_bus_line_1), s.c_str());
          id(data_updated) = true;

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: bus_bregnefaret_line_2
    id: ep_bus_line_2
    internal: true
    on_value:
      - lambda: |-
          std::string s = "510 Drøbak";
          if (!x.empty() && x != "unknown" && x != "unavailable") {
            s += (x[0] == ' ' ? "" : " ") + x;
          }
          lv_label_set_text(id(lbl_ep_bus_line_2), s.c_str());
          id(data_updated) = true;

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: bus_bregnefaret_time_0
    id: ep_bus_time_0
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_ep_bus_time_0
          text: !lambda 'return x;'
      - lambda: 'id(data_updated) = true;'
      - script.execute: epaper_mark_initial_data

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: bus_bregnefaret_time_1
    id: ep_bus_time_1
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_ep_bus_time_1
          text: !lambda 'return x;'
      - lambda: 'id(data_updated) = true;'

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: bus_bregnefaret_time_2
    id: ep_bus_time_2
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_ep_bus_time_2
          text: !lambda 'return x;'
      - lambda: 'id(data_updated) = true;'
