# Bind a remote Home Assistant entity attribute (`entity_id` + `attribute`) to `rolling_graph.yaml` (`uid`).
# Useful for multi-attribute display helpers such as `sensor.epaper_data_general`.
#
# Required vars: `uid`, `entity_id`, `attribute`
# Optional vars: `min_span`, `value_fmt`, `sample_interval`

packages:
  core: !include
    file: _rolling_graph_core.yaml
    vars:
      uid: ${uid}
      min_span: ${min_span | default("2.0")}
      value_fmt: ${value_fmt | default("%.0f")}
      sample_interval: ${sample_interval | default("10min")}

sensor:
  - platform: homeassistant
    entity_id: ${entity_id}
    attribute: ${attribute}
    id: ${uid}_sensor
    internal: true
    on_value:
      - script.execute:
          id: epaper_on_val_${uid}
          val: !lambda 'return x;'
