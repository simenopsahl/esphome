    entity_id: ${epaper_data_entity}
    attribute: weather_condition_now
    id: ep_weather_cond_now
    internal: true
    on_value:
      - script.execute:
          id: epaper_set_weather_icon
          slot: -1
          cond: !lambda 'return x;'
      - script.execute: epaper_mark_initial_data

