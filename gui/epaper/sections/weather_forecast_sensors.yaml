# Companion sensor & script bindings for `gui/epaper/sections/weather_forecast.yaml`

substitutions:
  epaper_data_entity: "sensor.epaper_data_general"

script:
  - id: epaper_set_weather_icon
    mode: parallel
    max_runs: 12
    parameters:
      slot: int
      cond: string
    then:
      - lambda: |-
          static const struct {
            const char *name;
            const char *glyph;
          } kWeatherMap[] = {
            {"clear-night", "\U000F0594"},
            {"night", "\U000F0594"},
            {"cloudy", "\U000F0590"},
            {"cloudy-alert", "\U000F0F2F"},
            {"cloudy-arrow-right", "\U000F0E6E"},
            {"exceptional", "\U000F0F38"},
            {"fog", "\U000F0591"},
            {"hail", "\U000F0592"},
            {"hazy", "\U000F0F30"},
            {"hurricane", "\U000F0898"},
            {"lightning", "\U000F0593"},
            {"lightning-rainy", "\U000F067E"},
            {"partlycloudy", "\U000F0595"},
            {"night-partly-cloudy", "\U000F0F31"},
            {"partly-lightning", "\U000F0F32"},
            {"partly-rainy", "\U000F0F33"},
            {"partly-snowy", "\U000F0F34"},
            {"partly-snowy-rainy", "\U000F0F35"},
            {"pouring", "\U000F0596"},
            {"rainy", "\U000F0597"},
            {"snowy", "\U000F0598"},
            {"snowy-heavy", "\U000F0F36"},
            {"snowy-rainy", "\U000F067F"},
            {"sunny", "\U000F0599"},
            {"sunny-alert", "\U000F0F37"},
            {"sunny-off", "\U000F14E4"},
            {"tornado", "\U000F0F38"},
            {"windy", "\U000F059D"},
            {"windy-variant", "\U000F059E"},
          };
          const char *glyph = "\U000F0590";
          for (const auto &entry : kWeatherMap) {
            if (cond == entry.name) {
              glyph = entry.glyph;
              break;
            }
          }
          lv_obj_t *lbl = nullptr;
          switch (slot) {
            case -1: lbl = id(lbl_ep_w_icon_now); break;
            case 0:  lbl = id(lbl_ep_w_icon_0);   break;
            case 1:  lbl = id(lbl_ep_w_icon_1);   break;
            case 2:  lbl = id(lbl_ep_w_icon_2);   break;
            case 3:  lbl = id(lbl_ep_w_icon_3);   break;
            case 4:  lbl = id(lbl_ep_w_icon_4);   break;
            default: break;
          }
          if (lbl != nullptr) {
            lv_label_set_text(lbl, glyph);
          }
          id(data_updated) = true;

sensor:
  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: temp_measured
    id: ep_temp_measured
    internal: true
    on_value:
      - lambda: |-
          char buf[16];
          if (isnan(x)) {
            snprintf(buf, sizeof(buf), "--°C");
          } else {
            snprintf(buf, sizeof(buf), "%d°C", (int) lroundf(x));
          }
          lv_label_set_text(id(lbl_ep_w_temp_measured), buf);
          id(data_updated) = true;
      - script.execute: epaper_mark_initial_data

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: temp_forecast
    id: ep_temp_forecast
    internal: true
    on_value:
      - lambda: |-
          char buf[16];
          if (isnan(x)) {
            snprintf(buf, sizeof(buf), "--°C");
          } else {
            snprintf(buf, sizeof(buf), "%d°C", (int) lroundf(x));
          }
          lv_label_set_text(id(lbl_ep_w_temp_forecast), buf);
          id(data_updated) = true;

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: weather_temperature_0
    id: ep_weather_temp_0
    internal: true
    on_value:
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), isnan(x) ? "--°C" : "%d°C", isnan(x) ? 0 : (int) lroundf(x));
          lv_label_set_text(id(lbl_ep_w_temp_0), buf);
          id(data_updated) = true;

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: weather_temperature_1
    id: ep_weather_temp_1
    internal: true
    on_value:
      - lambda: |-
