# Companion sensor & script bindings for `gui/epaper/sections/nordpool_graph.yaml`
# Measures `ep_np_plot_box` at runtime (`lv_obj_get_content_width/height`) to plot 9 hourly stepped bars (18 points).

substitutions:
  epaper_nordpool_entity: "sensor.epaper_data_nordpool_future_offset"

globals:
  - id: ep_np_prices
    type: std::array<float, 9>
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0, 0, 0}'
  - id: ep_np_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: ep_np_px
    type: std::array<int, 18>
    restore_value: no
    initial_value: '{0}'
  - id: ep_np_py
    type: std::array<int, 18>
    restore_value: no
    initial_value: '{0}'

script:
  - id: epaper_update_nordpool_chart
    mode: single
    then:
      - lambda: |-
          lv_obj_t *box = id(ep_np_plot_box);
          if (box == nullptr) return;
          int n = id(ep_np_count);
          if (n <= 0) return;
          lv_obj_update_layout(box);
          int box_w = lv_obj_get_content_width(box);
          int box_h = lv_obj_get_content_height(box);
          if (box_w <= 4 || box_h <= 4) return;

          float p_min = id(ep_np_prices)[0];
          float p_max = id(ep_np_prices)[0];
          for (int i = 1; i < n; i++) {
            if (id(ep_np_prices)[i] < p_min) p_min = id(ep_np_prices)[i];
            if (id(ep_np_prices)[i] > p_max) p_max = id(ep_np_prices)[i];
          }
          float span = p_max - p_min;
          if (span < 4.0f) {
            float mid = (p_max + p_min) * 0.5f;
            p_min = mid - 2.0f;
            p_max = mid + 2.0f;
            span = 4.0f;
          }

          const int pad_x = 2;
          const int pad_y = (${screen_width} > 960 || ${screen_height} > 960) ? 10 : 6;
          const int plot_w = box_w - (pad_x * 2);
          const int plot_h = box_h - (pad_y * 2);
          if (plot_w <= 4 || plot_h <= 4) return;

          for (int i = 0; i < 9; i++) {
            int idx = (i < n) ? i : (n - 1);
            int x0 = pad_x + (plot_w * i) / 9;
            int x1 = pad_x + (plot_w * (i + 1)) / 9;
            float norm = (p_max - id(ep_np_prices)[idx]) / span;
            int y = pad_y + (int) lroundf(norm * plot_h);
            id(ep_np_px)[i * 2] = x0;
            id(ep_np_py)[i * 2] = y;
            id(ep_np_px)[i * 2 + 1] = x1;
            id(ep_np_py)[i * 2 + 1] = y;
          }
      - lvgl.line.update:
          id: ep_np_line
          points:
            - x: !lambda 'return id(ep_np_px)[0];'
              y: !lambda 'return id(ep_np_py)[0];'
            - x: !lambda 'return id(ep_np_px)[1];'
              y: !lambda 'return id(ep_np_py)[1];'
            - x: !lambda 'return id(ep_np_px)[2];'
              y: !lambda 'return id(ep_np_py)[2];'
            - x: !lambda 'return id(ep_np_px)[3];'
              y: !lambda 'return id(ep_np_py)[3];'
            - x: !lambda 'return id(ep_np_px)[4];'
              y: !lambda 'return id(ep_np_py)[4];'
            - x: !lambda 'return id(ep_np_px)[5];'
              y: !lambda 'return id(ep_np_py)[5];'
            - x: !lambda 'return id(ep_np_px)[6];'
              y: !lambda 'return id(ep_np_py)[6];'
            - x: !lambda 'return id(ep_np_px)[7];'
              y: !lambda 'return id(ep_np_py)[7];'
            - x: !lambda 'return id(ep_np_px)[8];'
              y: !lambda 'return id(ep_np_py)[8];'
            - x: !lambda 'return id(ep_np_px)[9];'
              y: !lambda 'return id(ep_np_py)[9];'
            - x: !lambda 'return id(ep_np_px)[10];'
              y: !lambda 'return id(ep_np_py)[10];'
            - x: !lambda 'return id(ep_np_px)[11];'
              y: !lambda 'return id(ep_np_py)[11];'
            - x: !lambda 'return id(ep_np_px)[12];'
              y: !lambda 'return id(ep_np_py)[12];'
            - x: !lambda 'return id(ep_np_px)[13];'
              y: !lambda 'return id(ep_np_py)[13];'
            - x: !lambda 'return id(ep_np_px)[14];'
              y: !lambda 'return id(ep_np_py)[14];'
            - x: !lambda 'return id(ep_np_px)[15];'
              y: !lambda 'return id(ep_np_py)[15];'
            - x: !lambda 'return id(ep_np_px)[16];'
              y: !lambda 'return id(ep_np_py)[16];'
            - x: !lambda 'return id(ep_np_px)[17];'
              y: !lambda 'return id(ep_np_py)[17];'

text_sensor:
  - platform: homeassistant
    entity_id: ${epaper_nordpool_entity}
    attribute: prices
    id: ep_np_prices_text
    internal: true
    on_value:
      - lambda: |-
          const char *p = x.c_str();
          int count = 0;
          while (*p && count < 9) {
            while (*p && (*p == ' ' || *p == ',' || *p == '[' || *p == ']')) p++;
            if (!*p) break;
            char *end = nullptr;
            float v = strtof(p, &end);
            if (end == p) { p++; continue; }
            id(ep_np_prices)[count++] = v;
            p = end;
          }
          if (count <= 0) return;
          id(ep_np_count) = count;
          char buf[16];
          snprintf(buf, sizeof(buf), "%d Øre", (int) lroundf(id(ep_np_prices)[0]));
          if (id(lbl_ep_np_p0) != nullptr) lv_label_set_text(id(lbl_ep_np_p0), buf);
          if (count > 4 && id(lbl_ep_np_p4) != nullptr) {
            snprintf(buf, sizeof(buf), "%d Øre", (int) lroundf(id(ep_np_prices)[4]));
            lv_label_set_text(id(lbl_ep_np_p4), buf);
          }
          if (count > 8 && id(lbl_ep_np_p8) != nullptr) {
            snprintf(buf, sizeof(buf), "%d Øre", (int) lroundf(id(ep_np_prices)[8]));
            lv_label_set_text(id(lbl_ep_np_p8), buf);
          }
          id(data_updated) = true;
      - script.execute: epaper_update_nordpool_chart
      - script.execute: epaper_mark_initial_data

  - platform: homeassistant
    entity_id: ${epaper_nordpool_entity}
    attribute: times
    id: ep_np_times_text
    internal: true
    on_value:
      - lambda: |-
          if (x.empty() || x == "unavailable" || x == "unknown") return;
          std::vector<std::string> times;
          size_t start = 0;
          while (start < x.size() && times.size() < 9) {
            size_t comma = x.find(',', start);
            std::string tok = (comma == std::string::npos) ? x.substr(start) : x.substr(start, comma - start);
            size_t a = tok.find_first_not_of(" \t\r\n[]'\"");
            size_t b = tok.find_last_not_of(" \t\r\n[]'\"");
            if (a != std::string::npos) times.push_back(tok.substr(a, b - a + 1));
            if (comma == std::string::npos) break;
            start = comma + 1;
          }
          if (times.empty()) return;
          if (id(lbl_ep_np_t0) != nullptr) lv_label_set_text(id(lbl_ep_np_t0), times[0].c_str());
          if (times.size() > 4 && id(lbl_ep_np_t4) != nullptr) lv_label_set_text(id(lbl_ep_np_t4), times[4].c_str());
          if (times.size() > 8 && id(lbl_ep_np_t8) != nullptr) lv_label_set_text(id(lbl_ep_np_t8), times[8].c_str());
          id(data_updated) = true;
