    entity_id: ${epaper_nordpool_entity}
    attribute: time0
    id: ep_np_time_0
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_ep_np_t0
          text: !lambda 'return x;'
      - lambda: 'id(data_updated) = true;'

