# Companion sensor & script bindings for `gui/epaper/sections/weather_header.yaml`
# Tracks `weather_condition_now` and `weather_condition_0` from `${epaper_data_entity}`.

substitutions:
  epaper_data_entity: "sensor.epaper_data_general"

globals:
  - id: ep_wh_cond_now
    type: std::string
    restore_value: no
    initial_value: '"cloudy"'
  - id: ep_wh_cond_next
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  - id: epaper_update_weather_header
    mode: single
    then:
      - lambda: |-
          static const struct {
            const char *name;
            const char *glyph;
          } kWeatherMap[] = {
            {"clear-night", "\U000F0594"},
            {"night", "\U000F0594"},
            {"cloudy", "\U000F0590"},
            {"cloudy-alert", "\U000F0F2F"},
            {"cloudy-arrow-right", "\U000F0E6E"},
            {"exceptional", "\U000F0F38"},
            {"fog", "\U000F0591"},
            {"hail", "\U000F0592"},
            {"hazy", "\U000F0F30"},
            {"hurricane", "\U000F0898"},
            {"lightning", "\U000F0593"},
            {"lightning-rainy", "\U000F067E"},
            {"partlycloudy", "\U000F0595"},
            {"night-partly-cloudy", "\U000F0F31"},
            {"partly-lightning", "\U000F0F32"},
            {"partly-rainy", "\U000F0F33"},
            {"partly-snowy", "\U000F0F34"},
            {"partly-snowy-rainy", "\U000F0F35"},
            {"pouring", "\U000F0596"},
            {"rainy", "\U000F0597"},
            {"snowy", "\U000F0598"},
            {"snowy-heavy", "\U000F0F36"},
            {"snowy-rainy", "\U000F067F"},
            {"sunny", "\U000F0599"},
            {"sunny-alert", "\U000F0F37"},
            {"sunny-off", "\U000F14E4"},
            {"tornado", "\U000F0F38"},
            {"windy", "\U000F059D"},
            {"windy-variant", "\U000F059E"},
          };
          auto lookup = [&](const std::string &cond) -> const char * {
            for (const auto &entry : kWeatherMap) {
              if (cond == entry.name) return entry.glyph;
            }
            return "\U000F0590";
          };
          lv_label_set_text(id(lbl_ep_wh_now), lookup(id(ep_wh_cond_now)));
          const std::string &next = id(ep_wh_cond_next);
          if (!next.empty() && next != id(ep_wh_cond_now)) {
            lv_label_set_text(id(lbl_ep_wh_next), lookup(next));
            lv_obj_clear_flag(id(lbl_ep_wh_arrow), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_ep_wh_next), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_ep_wh_arrow), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_ep_wh_next), LV_OBJ_FLAG_HIDDEN);
          }
          id(data_updated) = true;

text_sensor:
  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: weather_condition_now
    id: ep_wh_condition_now
    internal: true
    on_value:
      - lambda: 'id(ep_wh_cond_now) = x;'
      - script.execute: epaper_update_weather_header
      - script.execute: epaper_mark_initial_data

  - platform: homeassistant
    entity_id: ${epaper_data_entity}
    attribute: weather_condition_0
    id: ep_wh_condition_next
    internal: true
    on_value:
      - lambda: 'id(ep_wh_cond_next) = x;'
      - script.execute: epaper_update_weather_header
