# Bezel navigation hints for M5Stack CoreInk (200x200) top dial & button.
# Anchors Home / Refresh / Next icons to the physical top-left keys across all LVGL
# display rotations (`epaper_rotation`: 0, 90, 180, 270) while keeping glyphs upright.

substitutions:
  epaper_status_in_footer: "true"
  epaper_nav_pad_top: "0"
  epaper_nav_pad_left: ${ "24" if (epaper_rotation|string) == "90" else "0" }
  epaper_nav_pad_bottom: ${ "22" if (epaper_rotation|string) == "180" else "0" }
  epaper_nav_pad_right: ${ "24" if (epaper_rotation|string) == "270" else "0" }

script:
  - id: !extend epaper_hide_chrome
    then:
      - lvgl.widget.hide: ep_nav_coreink

  - id: !extend epaper_show_chrome
    then:
      - lvgl.widget.show: ep_nav_coreink

lvgl:
  top_layer:
    widgets:
      - container:
          id: ep_nav_coreink
          styles: epaper_fg_text_style
          align: >-
            ${ "BOTTOM_LEFT" if (epaper_rotation|string) == "90"
               else ("BOTTOM_RIGHT" if (epaper_rotation|string) == "180"
               else ("TOP_RIGHT" if (epaper_rotation|string) == "270"
               else "TOP_LEFT")) }
          x: >-
            ${ -(epaper_pad_x|int) if (epaper_rotation|string) == "180"
               else (epaper_pad_x if (epaper_rotation|string) == "0" else 0) }
          y: >-
            ${ -(epaper_pad_x|int) if (epaper_rotation|string) == "90"
               else (-(epaper_footer_h|int) if (epaper_rotation|string) == "180"
               else (epaper_pad_x if (epaper_rotation|string) == "270" else 0)) }
          width: ${ 24 if (epaper_rotation|string) in ["90", "270"] else "SIZE_CONTENT" }
          height: >-
            ${ epaper_header_h if (epaper_rotation|string) == "0"
               else (22 if (epaper_rotation|string) == "180" else "SIZE_CONTENT") }
          pad_all: 0
          layout:
            type: FLEX
            flex_flow: >-
              ${ "COLUMN_REVERSE" if (epaper_rotation|string) == "90"
                 else ("ROW_REVERSE" if (epaper_rotation|string) == "180"
                 else ("COLUMN" if (epaper_rotation|string) == "270"
                 else "ROW")) }
            flex_align_main: START
            flex_align_cross: CENTER
            pad_column: ${ 10 if (epaper_rotation|string) in ["0", "180"] else 0 }
            pad_row: ${ 10 if (epaper_rotation|string) in ["90", "270"] else 0 }
          widgets:
            - label:
                text: "\U000F02DC" # home
                text_font: mdi_sm
            - label:
                text: "\U000F0450" # refresh
                text_font: mdi_sm
            - label:
                text: "\U000F0055" # arrow-right-thick
                text_font: mdi_sm
