# Bezel navigation hints for M5Stack CoreInk (200x200) top dial & button.
# Anchors Home / Refresh / Next icons to the physical top-left keys across all LVGL
# display rotations (`epaper_rotation`: 0, 90, 180, 270) while keeping glyphs upright.

substitutions:
  display:
    chrome:
      status_in_footer: "true"
  epaper_nav_pad_top: "0"
  epaper_nav_pad_left: ${ _ep_defer if "$" in (display.rotation|string) else ("24" if (display.rotation|string) == "180" else "0") }
  epaper_nav_pad_bottom: ${ _ep_defer if "$" in (display.rotation|string) else ("22" if (display.rotation|string) == "270" else "0") }
  epaper_nav_pad_right: ${ _ep_defer if "$" in (display.rotation|string) else ("24" if (display.rotation|string) == "0" else "0") }

script:
  - id: !extend epaper_hide_chrome
    then:
      - lvgl.widget.hide: ep_nav_coreink

  - id: !extend epaper_show_chrome
    then:
      - lvgl.widget.show: ep_nav_coreink

lvgl:
  top_layer:
    widgets:
      - container:
          id: ep_nav_coreink
          styles: epaper_fg_text_style
          align: >-
            ${ "TOP_LEFT" if (_ep_rotation|string) == "90"
               else ("BOTTOM_LEFT" if (_ep_rotation|string) == "180"
               else ("BOTTOM_RIGHT" if (_ep_rotation|string) == "270"
               else "TOP_RIGHT")) }
          x: >-
            ${ -(epaper_pad_x|int) if (_ep_rotation|string) == "270"
               else (epaper_pad_x if (_ep_rotation|string) == "90" else 0) }
          y: >-
            ${ -(epaper_pad_x|int) if (_ep_rotation|string) == "180"
               else (epaper_pad_x if (_ep_rotation|string) == "0" else 0) }
          width: ${ 24 if (_ep_rotation|string) in ["0", "180"] else "SIZE_CONTENT" }
          height: >-
            ${ epaper_header_h if (_ep_rotation|string) == "90"
               else (22 if (_ep_rotation|string) == "270" else "SIZE_CONTENT") }
          pad_all: 0
          layout:
            type: FLEX
            flex_flow: >-
              ${ "ROW" if (_ep_rotation|string) == "90"
                 else ("COLUMN_REVERSE" if (_ep_rotation|string) == "180"
                 else ("ROW_REVERSE" if (_ep_rotation|string) == "270"
                 else "COLUMN")) }
            flex_align_main: START
            flex_align_cross: CENTER
            pad_column: ${ 10 if (_ep_rotation|string) in ["90", "270"] else 0 }
            pad_row: ${ 10 if (_ep_rotation|string) in ["0", "180"] else 0 }
          widgets:
            - label:
                text: "\U000F02DC" # home
                text_font: mdi_sm
            - label:
                text: "\U000F0450" # refresh
                text_font: mdi_sm
            - label:
                text: "\U000F0055" # arrow-right-thick
                text_font: mdi_sm
