# Bezel navigation hints for Elecrow CrowPanel e-Paper (4.2" 400x300 & 5.79" 792x272).
# Anchors the 5 physical bezel icons to their hardware edge across all LVGL display
# rotations (`epaper_rotation`: 0, 90, 180, 270) and reserves the matching margin.

substitutions:
  epaper_status_in_footer: "true"
  epaper_nav_pad_top: ${ "36" if (epaper_rotation|string) == "90" else "0" }
  epaper_nav_pad_right: ${ "36" if (epaper_rotation|string) == "0" else "0" }
  epaper_nav_pad_bottom: ${ "36" if (epaper_rotation|string) == "270" else "0" }
  epaper_nav_pad_left: ${ "36" if (epaper_rotation|string) == "180" else "0" }

script:
  - id: !extend epaper_hide_chrome
    then:
      - lvgl.widget.hide: ep_nav_crowpanel

  - id: !extend epaper_show_chrome
    then:
      - lvgl.widget.show: ep_nav_crowpanel

lvgl:
  top_layer:
    widgets:
      - container:
          id: ep_nav_crowpanel
          styles: epaper_fg_text_style
          align: >-
            ${ "TOP_MID" if (epaper_rotation|string) == "90"
               else ("LEFT_MID" if (epaper_rotation|string) == "180"
               else ("BOTTOM_MID" if (epaper_rotation|string) == "270"
               else "RIGHT_MID")) }
          width: ${ "100%" if (epaper_rotation|string) in ["90", "270"] else 34 }
          height: ${ 34 if (epaper_rotation|string) in ["90", "270"] else "100%" }
          pad_left: ${ 6 if (epaper_rotation|string) in ["90", "270"] else 0 }
          pad_right: ${ 6 if (epaper_rotation|string) in ["90", "270"] else 0 }
          pad_top: ${ 0 if (epaper_rotation|string) in ["90", "270"] else 6 }
          pad_bottom: ${ 0 if (epaper_rotation|string) in ["90", "270"] else 6 }
          layout:
            type: FLEX
            flex_flow: >-
              ${ "ROW" if (epaper_rotation|string) == "90"
                 else ("COLUMN_REVERSE" if (epaper_rotation|string) == "180"
                 else ("ROW_REVERSE" if (epaper_rotation|string) == "270"
                 else "COLUMN")) }
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
          widgets:
            - label:
                text: "\U000F02DC" # home
                text_font: mdi_sm
            - label:
                text: "\U000F004E" # arrow-left-thick
                text_font: mdi_sm
            - label:
                text: "\U000F0450" # refresh
                text_font: mdi_sm
            - label:
                text: "\U000F0055" # arrow-right-thick
                text_font: mdi_sm
            - label:
                text: "\U000F0206" # exit-to-app
                text_font: mdi_sm
