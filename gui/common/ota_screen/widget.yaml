# OTA progress screen overlay widget (uses responsive substitutions from boot_screen/sensors.yaml)

# widgets:
  - container:
      id: ota_screen
      x: 0
      y: 0
      bg_color: 0x000000
      bg_opa: COVER
      hidden: true
      widgets:
        - image:
            src: boot_logo
            align: CENTER
            y: -${logo_offset}
        - bar:
            id: lvgl_ota_progress
            align: CENTER
            y: ${spinner_offset}
#            height: ${spinner_size}
            width: 80%
            bg_color: c_dark_gray
            indicator:
              bg_color: 0x18bcf2
