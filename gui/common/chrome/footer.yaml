# Bottom navigation bar overlay package (`navbar` on `lvgl: top_layer`).
#
# Requires `gui/chrome/base.yaml` to be included.
# Can be omitted on tiny/round displays (where `chrome_footer: "false"` sets
# `page_pad_bottom: 0`), or included unconditionally when `navbar` is hidden
# at runtime if `chrome_footer == "false"`.

lvgl:
  top_layer:
    widgets:
      - container:
          id: navbar
          height: ${chrome_h}
          bg_color: c_black
          bg_opa: COVER
          align: BOTTOM_MID
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
            pad_column: 1
          widgets:
            - button: # prev page
                height: 90%
                bg_color: c_black
                border_width: 0
                radius: 10
                flex_grow: 1
                on_press:
                  - lvgl.page.previous:
                      animation: OUT_RIGHT
                      time: 200ms
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0141"
                      text_font: mdi_lg
            - button: # home page
                id: home_btn
                height: 90%
                bg_color: c_black
                border_width: 0
                radius: 10
                flex_grow: 1
                on_press:
                  - script.execute: go_home
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02DC"
                      text_font: mdi_lg
            - button: # next page
                height: 90%
                bg_color: c_black
                border_width: 0
                radius: 10
                flex_grow: 1
                on_press:
                  - lvgl.page.next:
                      animation: OUT_LEFT
                      time: 200ms
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0142"
                      text_font: mdi_lg

esphome:
  on_boot:
    - priority: -150
      then:
        - if:
            condition:
              lambda: 'return std::string("${chrome_footer}") == "false";'
            then:
              - lvgl.widget.hide: navbar
