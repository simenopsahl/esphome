# Boot screen overlay widget (uses responsive substitutions from boot_screen/sensors.yaml)

# widgets:
  - container:
      id: boot_screen
      x: 0
      y: 0
      bg_color: 0x000000
      bg_opa: COVER
      clickable: true
      widgets:
        - image:
            src: boot_logo
            align: CENTER
            y: -${logo_offset}
        - spinner:
            align: CENTER
            y: ${spinner_offset}
            height: ${spinner_size}
            width: ${spinner_size}
            spin_time: 1s
            arc_length: 60deg
            arc_width: ${spinner_arc}
            arc_color: c_dark_gray
            indicator:
              arc_color: 0x18bcf2
              arc_width: ${spinner_arc}
      on_press:
        - then:
            - lvgl.widget.hide: boot_screen
