# Modular Local Binary Sensor Tile
#
# Read-only indicator tile showing state of an on-device ESPHome binary sensor.
#
# Usage via packages:
#   my_motion_tile: !include
#     file: gui/tiles/binary_sensor/local.yaml
#     vars:
#       page_id: page_dashboard
#       uid: tile_motion
#       row: 1
#       col: 0
#       icon: "\U000F039E" # motion-sensor
#       title: "Bevegelse"
#       binary_sensor_id: presence_detected
#       state_on: "PÅ"
#       state_off: "AV"
#       click_page: page_status # optional

substitutions:
  page_id: page_dashboard
  col_span: "1"
  row_span: "1"
  icon_font: mdi_lg
  title_font: font_sm
  state_font: font_sm
  state_on: "PÅ"
  state_off: "AV"

lvgl:
  pages:
    - id: !extend ${page_id | default("page_dashboard")}
      widgets:
        - obj:
            id: ${uid}_card
            radius: 12
            grid_cell_column_pos: ${col}
            grid_cell_row_pos: ${row}
            grid_cell_column_span: ${col_span}
            grid_cell_row_span: ${row_span}
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            width: 100%
            height: 100%
            pad_all: 4
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 2
            clickable: ${ "true" if (click_page | default("")) != "" else "false" }
            on_short_click:
              - lvgl.page.show:
                  id: ${ click_page if (click_page | default("")) != "" else (page_id | default("page_dashboard")) }
                  animation: OUT_LEFT
                  time: 200ms
            widgets:
              - label:
                  id: ${uid}_icon
                  text: ${icon}
                  text_font: ${icon_font}
                  text_color: c_text_s
                  align: CENTER
              - label:
                  id: ${uid}_label
                  text: ${title}
                  text_font: ${title_font}
                  text_color: c_text_s
                  text_align: CENTER
                  align: CENTER
              - label:
                  id: ${uid}_state
                  text: "--"
                  text_font: ${state_font}
                  text_color: c_text_s
                  text_align: CENTER
                  align: CENTER

binary_sensor:
  - id: !extend ${binary_sensor_id}
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.label.update:
                id: ${uid}_icon
                text_color: c_yellow
            - lvgl.label.update:
                id: ${uid}_state
                text: ${state_on}
                text_color: c_text_p
          else:
            - lvgl.label.update:
                id: ${uid}_icon
                text_color: c_text_s
            - lvgl.label.update:
                id: ${uid}_state
                text: ${state_off}
                text_color: c_text_s

