# Modular Local Button Tile (ESPHome Action)
#
# Adds a touch button to a grid dashboard page and executes a local ESPHome script on click.
#
# Usage via packages:
#   my_btn: !include
#     file: gui/tiles/button/local.yaml
#     vars:
#       page_id: page_dashboard
#       uid: btn_screen_toggle
#       row: 0
#       col: 1
#       icon: "\U000F0425"
#       title: "Skjerm"
#       script_id: display_on_off

substitutions:
  page_id: page_dashboard
  col_span: "1"
  row_span: "1"
  icon_font: mdi_lg
  title_font: font_sm

lvgl:
  pages:
    - id: !extend ${page_id | default("page_dashboard")}
      widgets:
        - button:
            id: ${uid}_btn
            grid_cell_column_pos: ${col}
            grid_cell_row_pos: ${row}
            grid_cell_column_span: ${col_span}
            grid_cell_row_span: ${row_span}
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            width: 100%
            height: 100%
            pad_all: 4
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 2
            on_click:
              - script.execute: ${script_id}
            widgets:
              - label:
                  id: ${uid}_icon
                  text: ${icon}
                  text_font: ${icon_font}
                  text_color: c_text_p
                  align: CENTER
              - label:
                  id: ${uid}_label
                  text: ${title}
                  text_font: ${title_font}
                  text_color: c_text_s
                  text_align: CENTER
                  align: CENTER

