# Modular Remote Light Tile (Home Assistant Light Entity)
#
# Interactive touch tile that controls and displays the state + brightness (%)
# of a Home Assistant `light.*` entity.
# - Short click: toggles the Home Assistant light (`light.toggle`).
# - Can be extended later to open a dedicated `page_light` popup/page on long press.
#
# Usage via packages:
#   my_light_tile: !include
#     file: gui/tiles/light/remote.yaml
#     vars:
#       page_id: page_dashboard
#       uid: tile_stue_lys
#       row: 0
#       col: 0
#       icon: "\U000F0335" # lightbulb
#       title: "Stue"
#       entity_id: light.stue_tak

substitutions:
  page_id: page_dashboard
  col_span: "1"
  row_span: "1"
  icon: "\U000F0335"
  icon_font: mdi_lg
  title_font: font_sm
  value_font: font_md
  state_on: "PÅ"
  state_off: "AV"
  service: "light.toggle"

lvgl:
  pages:
    - id: !extend ${page_id | default("page_dashboard")}
      widgets:
        - button:
            id: ${uid}_btn
            radius: 12
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${col}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${col_span | default(1)}
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            pad_all: 6
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              pad_row: 2
            on_click:
              - homeassistant.service:
                  service: ${service | default("light.toggle")}
                  data:
                    entity_id: ${entity_id}
            widgets:
              - container:
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_column: 6
                  widgets:
                    - label:
                        id: ${uid}_icon
                        text: "${icon | default('\U000F0335')}"
                        text_font: ${icon_font | default("mdi_lg")}
                        text_color: c_text_s
                    - label:
                        id: ${uid}_value
                        text: "${state_off}"
                        text_font: ${value_font | default("font_md")}
                        text_color: c_text_p
              - label:
                  id: ${uid}_title
                  text: "${title}"
                  text_font: ${title_font | default("font_sm")}
                  text_color: c_text_s
                  text_align: CENTER
                  width: 100%
                  long_mode: DOT

binary_sensor:
  - platform: homeassistant
    id: ${uid}_ha_state
    entity_id: ${entity_id}
    on_state:
      - lvgl.widget.update:
          id: ${uid}_btn
          state:
            checked: !lambda "return x;"
      - if:
          condition:
            lambda: "return x;"
          then:
            - lvgl.label.update:
                id: ${uid}_icon
                text_color: c_yellow
            - lvgl.label.update:
                id: ${uid}_value
                text: !lambda |-
                  if (!std::isnan(id(${uid}_ha_brightness).state) && id(${uid}_ha_brightness).state > 0.0f) {
                    int pct = (int) roundf(id(${uid}_ha_brightness).state / 255.0f * 100.0f);
                    char buf[16];
                    snprintf(buf, sizeof(buf), "%d%%", pct);
                    return std::string(buf);
                  }
                  return std::string("${state_on}");
          else:
            - lvgl.label.update:
                id: ${uid}_icon
                text_color: c_text_s
            - lvgl.label.update:
                id: ${uid}_value
                text: "${state_off}"

sensor:
  - platform: homeassistant
    id: ${uid}_ha_brightness
    entity_id: ${entity_id}
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: "return id(${uid}_ha_state).state && !std::isnan(x) && x > 0.0f;"
          then:
            - lvgl.label.update:
                id: ${uid}_value
                text: !lambda |-
                  int pct = (int) roundf(x / 255.0f * 100.0f);
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%d%%", pct);
                  return std::string(buf);

