# Modular Local Text Sensor Tile
#
# Displays string state from an on-device ESPHome text sensor on a grid dashboard page.
#
# Usage via packages:
#   my_wifi_tile: !include
#     file: gui/tiles/text_sensor/local.yaml
#     vars:
#       page_id: page_dashboard
#       uid: tile_wifi_ip
#       row: 1
#       col: 0
#       icon: "\U000F05A9"
#       title: "IP"
#       text_sensor_id: wifi_ip_address
#       click_page: page_status # optional

substitutions:
  page_id: page_dashboard
  col_span: "1"
  row_span: "1"
  unit: ""
  value_font: font_md
  icon_font: mdi_md
  title_font: font_sm

lvgl:
  pages:
    - id: !extend ${page_id | default("page_dashboard")}
      widgets:
        - obj:
            id: ${uid}_card
            radius: 12
            grid_cell_column_pos: ${col}
            grid_cell_row_pos: ${row}
            grid_cell_column_span: ${col_span}
            grid_cell_row_span: ${row_span}
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            width: 100%
            height: 100%
            pad_all: 4
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 2
            clickable: ${ "true" if (click_page | default("")) != "" else "false" }
            on_short_click:
              - lvgl.page.show:
                  id: ${ click_page if (click_page | default("")) != "" else (page_id | default("page_dashboard")) }
                  animation: OUT_LEFT
                  time: 200ms
            widgets:
              - container:
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_column: 4
                  widgets:
                    - label:
                        id: ${uid}_icon
                        text: ${icon}
                        text_font: ${icon_font}
                        text_color: c_text_s
                    - label:
                        id: ${uid}_title
                        text: ${title}
                        text_font: ${title_font}
                        text_color: c_text_s
              - label:
                  id: ${uid}_value
                  text: "--"
                  text_font: ${value_font}
                  text_color: c_text_p
                  align: CENTER

text_sensor:
  - id: !extend ${text_sensor_id}
    on_value:
      - lvgl.label.update:
          id: ${uid}_value
          text: !lambda |-
            if (x.empty()) return std::string("--");
            std::string u = "${unit}";
            return u.empty() ? x : x + " " + u;
