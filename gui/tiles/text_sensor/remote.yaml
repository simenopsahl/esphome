# Modular Remote Text Sensor Tile (Home Assistant Text Sensor)
#
# Displays string state from a Home Assistant text entity or sensor.
#
# Usage via packages:
#   my_status_tile: !include
#     file: gui/tiles/text_sensor/remote.yaml
#     vars:
#       page_id: page_dashboard
#       uid: tile_alarm_state
#       row: 1
#       col: 1
#       icon: "\U000F04A4"
#       title: "Alarm"
#       entity_id: sensor.alarm_status
#       attribute: HA attribute to display instead of state (optional, default: state)

substitutions:
  page_id: page_dashboard
  col_span: "1"
  row_span: "1"
  unit: ""
  value_font: font_md
  icon_font: mdi_md
  title_font: font_sm

lvgl:
  pages:
    - id: !extend ${page_id | default("page_dashboard")}
      widgets:
        - obj:
            id: ${uid}_card
            radius: 12
            grid_cell_column_pos: ${col}
            grid_cell_row_pos: ${row}
            grid_cell_column_span: ${col_span}
            grid_cell_row_span: ${row_span}
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            width: 100%
            height: 100%
            pad_all: 4
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 2
            widgets:
              - container:
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_column: 4
                  widgets:
                    - label:
                        id: ${uid}_icon
                        text: ${icon}
                        text_font: ${icon_font}
                        text_color: c_text_s
                    - label:
                        id: ${uid}_title
                        text: ${title}
                        text_font: ${title_font}
                        text_color: c_text_s
              - label:
                  id: ${uid}_value
                  text: "--"
                  text_font: ${value_font}
                  text_color: c_text_p
                  align: CENTER

text_sensor:
  - platform: homeassistant
    id: ${uid}_ha_text
    entity_id: ${entity_id}
    attribute: ${attribute | default("")}
    on_value:
      - lvgl.label.update:
          id: ${uid}_value
          text: !lambda |-
            if (x.empty() || x == "unavailable" || x == "unknown") return std::string("--");
            std::string u = "${unit}";
            return u.empty() ? x : x + " " + u;
