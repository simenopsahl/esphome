                        - label:
                            align: CENTER
                            text: "STILLE"
                            text_font: ${climate_dropdown_font}
                            text_color: c_pink
                      on_click:
                        then:
                          - lvgl.widget.hide: climate_fan_dropdown
                          - lvgl.widget.hide: climate_dismiss_overlay
                          - lvgl.widget.show: climate_content
