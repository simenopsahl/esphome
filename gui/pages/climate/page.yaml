                  - button:
                      id: climate_btn_fan_medium
                      hidden: true
                      width: 100%
                      flex_grow: 1
                      bg_color: c_bg_p
                      radius: 10
                      pad_all: 2
                      widgets:
                        - label:
                            align: CENTER
                            text: "MIDDELS"
                            text_font: ${climate_dropdown_font}
