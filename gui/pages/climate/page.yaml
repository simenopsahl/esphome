                  - button:
                      id: climate_btn_mode_cool
                      hidden: true
                      width: 100%
                      flex_grow: 1
                      bg_color: c_bg_p
                      radius: 10
                      pad_all: 2
                      widgets:
                        - label:
                            align: CENTER
                            text: "KJØLE"
                            text_font: ${climate_dropdown_font}
                            text_color: c_blue
                      on_click:
                        then:
                          - lvgl.widget.hide: climate_mode_dropdown
                          - lvgl.widget.hide: climate_dismiss_overlay
                          - lvgl.widget.show: climate_content
