                      radius: 10
                      pad_all: 2
                      widgets:
                        - label:
                            align: CENTER
                            text: "TØRKE"
                            text_font: ${climate_dropdown_font}
                            text_color: c_yellow
                      on_click:
                        then:
                          - lvgl.widget.hide: climate_mode_dropdown
                          - lvgl.widget.hide: climate_dismiss_overlay
