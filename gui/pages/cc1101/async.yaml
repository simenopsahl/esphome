# LVGL CC1101 Radio async mode page (M5Stack Core 320x240)
#
# Optional vars:
# - page_title (e.g. "Radio")

    id: page_cc1101
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F04C9"
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - container:
          styles: container_style
          align: CENTER
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
            flex_align_track: CENTER
            pad_row: 0
            pad_column: 0
          widgets:
            # --- Row 1: Frequency ---
            - container:
                # This is a container for a single row
                height: SIZE_CONTENT
                pad_left: ${container_pad_left}
                pad_right: ${container_pad_right}
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: SPACE_BETWEEN
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_frequency_l
                      text: "Frekvens: "
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_frequency_value
                      text: "?"
                      text_font: font_md
                      text_color: c_text_p
                  # Unit Label
                  - label:
                      id: lbl_frequency_unit
                      text: "Mhz"
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s

            # --- Row 2: Modulation & Tx Power ---
            - container:
                height: SIZE_CONTENT
                pad_left: ${container_pad_left}
                pad_right: ${container_pad_right}
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: SPACE_BETWEEN
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  - container:
                      width: 65%
                      height: SIZE_CONTENT
                      pad_left: 0
                      pad_right: 10
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: START
                        flex_align_cross: CENTER
                        pad_row: 0
                        pad_column: 0
                      widgets:
                        # Descriptor Label
                        - label:
                             id: lbl_modulation_l
                             text: "Protokoll: "
                             pad_left: ${container_pad_left}
                             pad_right: ${container_pad_right}
                             text_font: font_sm
                             text_color: c_text_s
                        # Value Label
                        - label:
                             id: lbl_modulation_value
                             text: "?"
                             pad_right: ${container_pad_right}
                             text_font: font_md
                             text_color: c_text_p
                  - container:
                      width: 35%
                      height: SIZE_CONTENT
                      pad_left: 10
                      pad_right: 0
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: END
                        flex_align_cross: CENTER
                        pad_row: 0
                        pad_column: 0
                      widgets:
                        # Value Label
                        - label:
                             id: lbl_tx_power_value
                             text: "?"
                             pad_left: ${container_pad_left}
                             pad_right: ${container_pad_right}
                             text_font: font_sm
                             text_color: c_text_p
                        # Unit Label
                        - label:
                             id: lbl_tx_power_unit
                             text: "dBm"
                             pad_right: ${container_pad_right}
                             text_font: font_sm
                             text_color: c_text_s

            # --- Row 3: Transmit/Receive ---
            - container:
                height: SIZE_CONTENT
                pad_top: 10
                pad_bottom: 10
                pad_left: ${container_pad_left}
                pad_right: ${container_pad_right}
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: SPACE_BETWEEN
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_cc1101_state
                      text: "Mottar..."
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_md
                      text_color: c_text_s
                  # Value Label
                  - led:
                      id: led_cc1101_state
                      color: c_green
                      height: 6
                      width: 26
                      radius: 3
                      shadow_width: 6
                      shadow_spread: 2
                  # Unit Label
                  - label:
                      id: lbl_cc1101_packet
                      text: "     "
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
