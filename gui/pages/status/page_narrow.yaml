# LVGL device status page (narrow layout)
#
# Optional vars:
# - page_title (e.g. "Enhet")

    id: page_status
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F02FC"
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - obj:
          styles: container_style
          align: CENTER
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
            flex_align_track: CENTER
            pad_row: 0
            pad_column: 0
          widgets:
            - label:
                id: lbl_name
                text: ${device.name}
                text_align: CENTER
                width: 100%
                text_font: font_sm
                text_color: c_text_p
                pad_all: 0
            - label:
                id: lbl_build
                text_align: CENTER
                width: 100%
                text_font: font_sm
                text_color: c_text_p
                text:
                    format: "%s - %s"
                    args: [__DATE__, __TIME__]
                pad_all: 0
            - label:
                id: lbl_ssid
                text: "?"
                text_align: CENTER
                width: 100%
                text_font: font_sm
                text_color: c_text_p
                pad_all: 0
            - label:
                id: lbl_ip
                text: "?"
                text_align: CENTER
                width: 100%
                text_font: font_sm
                text_color: c_text_p
                pad_all: 0
            - label:
                id: lbl_mac
                text: "?"
                text_align: CENTER
                width: 100%
                text_font: font_sm
                text_color: c_text_p
                pad_all: 0