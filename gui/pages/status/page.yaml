# LVGL device status page (responsive across standard and narrow displays)
#
# Optional vars:
# - page_title (e.g. "Enhet")

    id: page_status
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F02FC"
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - container:
          styles: container_style
          align: CENTER
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
            flex_align_track: CENTER
            pad_row: 0
            pad_column: 0
          widgets:
            # --- Row 1: Device Name ---
            - container:
                height: SIZE_CONTENT
                pad_left: ${ 0 if (screen_width|int < 180) else container_pad_left }
                pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: ${ "CENTER" if (screen_width|int < 180) else "SPACE_BETWEEN" }
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_name_l
                      text: "ID: "
                      hidden: ${ "true" if (screen_width|int < 180) else "false" }
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_name
                      text: ${device.name}
                      pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                      text_font: ${ "font_sm" if (screen_width|int < 180) else "font_md" }
                      text_color: c_text_p

            # --- Row 2: Build Info ---
            - container:
                height: SIZE_CONTENT
                pad_left: ${ 0 if (screen_width|int < 180) else container_pad_left }
                pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: ${ "CENTER" if (screen_width|int < 180) else "SPACE_BETWEEN" }
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_build_l
                      text: "Build: "
                      hidden: ${ "true" if (screen_width|int < 180) else "false" }
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_build
                      pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                      text_font: ${ "font_sm" if (screen_width|int < 180) else "font_md" }
                      text_color: c_text_p
                      text:
                        format: "%s - %s"
                        args: [__DATE__, __TIME__]

            # --- Row 3: SSID ---
            - container:
                height: SIZE_CONTENT
                pad_left: ${ 0 if (screen_width|int < 180) else container_pad_left }
                pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: ${ "CENTER" if (screen_width|int < 180) else "SPACE_BETWEEN" }
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_ssid_l
                      text: "SSID: "
                      hidden: ${ "true" if (screen_width|int < 180) else "false" }
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_ssid
                      text: "?"
                      pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                      text_font: ${ "font_sm" if (screen_width|int < 180) else "font_md" }
                      text_color: c_text_p

            # --- Row 4: IP Address ---
            - container:
                height: SIZE_CONTENT
                pad_left: ${ 0 if (screen_width|int < 180) else container_pad_left }
                pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: ${ "CENTER" if (screen_width|int < 180) else "SPACE_BETWEEN" }
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_ip_l
                      text: "IP: "
                      hidden: ${ "true" if (screen_width|int < 180) else "false" }
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_ip
                      text: "?"
                      pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                      text_font: ${ "font_sm" if (screen_width|int < 180) else "font_md" }
                      text_color: c_text_p

            # --- Row 5: MAC Address ---
            - container:
                height: SIZE_CONTENT
                pad_left: ${ 0 if (screen_width|int < 180) else container_pad_left }
                pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: ${ "CENTER" if (screen_width|int < 180) else "SPACE_BETWEEN" }
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_mac_l
                      text: "MAC: "
                      hidden: ${ "true" if (screen_width|int < 180) else "false" }
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_mac
                      text: "?"
                      pad_right: ${ 0 if (screen_width|int < 180) else container_pad_right }
                      text_font: ${ "font_sm" if (screen_width|int < 180) else "font_md" }
                      text_color: c_text_p
