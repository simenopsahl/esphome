# Functions to update the NordPool LVGL page

substitutions:
  nordpool_entity: "sensor.epaper_data_nordpool_future_offset"
  nordpool_line_width: >-
    ${2 if ( [screen_width|int, screen_height|int]|min <= 128 )
      else (4 if ( [screen_width|int, screen_height|int]|min <= 160 )
      else (5 if ( [screen_width|int, screen_height|int]|min <= 200 )
      else (6 if ( [screen_width|int, screen_height|int]|min <= 240 )
      else (8 if ( [screen_width|int, screen_height|int]|min <= 320 )
      else 10))))}

globals:
  # These arrays store the coordinates and values for the line graph's points.
  - id: nordpool_prices
    type: std::array<float, 9>
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0, 0, 0, 0, 0}'
  - id: nordpool_price_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: nordpool_points_y
    type: int[9]
    restore_value: no
    initial_value: '{0, 10, 20, 30, 40, 50, 60, 70, 80}'
  - id: nordpool_points_x
    type: int[9]
    restore_value: no
    initial_value: '{0, 10, 20, 30, 40, 50, 60, 70, 80}'

esphome:
  # On boot, run the script to calculate the initial graph layout.
  on_boot:
    - priority: -10.0 # Run before the display subsystem starts
      then:
        - script.execute:
            id: nordpool_initialize_graph_layout

script:
  - id: nordpool_initialize_graph_layout
    then:
      - lambda: |-
          // This script runs on boot to set the initial X and Y coordinates from the runtime container size.
          if (id(nordpool_graph_area) == nullptr) { return; }
          lv_obj_update_layout(id(nordpool_graph_area));
          const float graph_container_w = lv_obj_get_content_width(id(nordpool_graph_area));
          const float graph_container_h = lv_obj_get_content_height(id(nordpool_graph_area));
          const float line_w = ${nordpool_line_width};
          if (graph_container_w <= line_w || graph_container_h <= line_w) { return; }

          const float graph_drawable_h = graph_container_h - line_w;
          const float graph_drawable_w = graph_container_w - line_w;
          const float inset = line_w / 2.0f;
          const int mid_y = (int)round(inset + graph_drawable_h / 2.0f);

          // Calculate and store initial X and Y points
          for (int i = 0; i < 9; ++i) {
            float x_coord = i * (graph_drawable_w - 1.0f) / 8.0f;
            id(nordpool_points_x)[i] = (int)round(inset + x_coord);
            id(nordpool_points_y)[i] = mid_y;
          }

  - id: nordpool_update_chart
    mode: single
    then:
      - lambda: |-
          // STEP 1: Measure the graph container and calculate all X and Y coordinates.
          if (id(nordpool_graph_area) == nullptr) { return; }
          const int n = id(nordpool_price_count);
          if (n <= 0) { return; }
          lv_obj_update_layout(id(nordpool_graph_area));
          const float graph_container_w = lv_obj_get_content_width(id(nordpool_graph_area));
          const float graph_container_h = lv_obj_get_content_height(id(nordpool_graph_area));
          const float line_w = ${nordpool_line_width};
          if (graph_container_w <= line_w || graph_container_h <= line_w) { return; }

          const float inset = line_w / 2.0f;
          const float graph_drawable_w = graph_container_w - line_w;
          const float graph_drawable_h = graph_container_h - line_w;

          for (int i = 0; i < 9; ++i) {
            float x_coord = i * (graph_drawable_w - 1.0f) / 8.0f;
            id(nordpool_points_x)[i] = (int)round(inset + x_coord);
          }

          float min_p = id(nordpool_prices)[0];
          float max_p = id(nordpool_prices)[0];
          for (int i = 1; i < n; ++i) {
            if (id(nordpool_prices)[i] < min_p) min_p = id(nordpool_prices)[i];
            if (id(nordpool_prices)[i] > max_p) max_p = id(nordpool_prices)[i];
          }

          for (int i = 0; i < 9; ++i) {
            int idx = (i < n) ? i : (n - 1);
            if (max_p == min_p) {
              id(nordpool_points_y)[i] = (int)round(graph_container_h / 2.0f);
            } else {
              float scaled_y = graph_drawable_h - ((id(nordpool_prices)[idx] - min_p) / (max_p - min_p) * graph_drawable_h);
              id(nordpool_points_y)[i] = (int)round(inset + scaled_y);
            }
          }
          ESP_LOGD("update_chart", "Graph area %.0fx%.0f, Y-Points: %d, %d, %d, %d, %d, %d, %d, %d, %d",
                graph_container_w, graph_container_h,
                id(nordpool_points_y)[0], id(nordpool_points_y)[1], id(nordpool_points_y)[2],
                id(nordpool_points_y)[3], id(nordpool_points_y)[4], id(nordpool_points_y)[5],
                id(nordpool_points_y)[6], id(nordpool_points_y)[7], id(nordpool_points_y)[8]);
      - lvgl.line.update:
          # STEP 2: Redraw the line using the new values from the global arrays.
          id: lvgl_nordpool_line
          points:
            - x: !lambda return id(nordpool_points_x)[0];
              y: !lambda return id(nordpool_points_y)[0];
            - x: !lambda return id(nordpool_points_x)[1];
              y: !lambda return id(nordpool_points_y)[1];
            - x: !lambda return id(nordpool_points_x)[2];
              y: !lambda return id(nordpool_points_y)[2];
            - x: !lambda return id(nordpool_points_x)[3];
              y: !lambda return id(nordpool_points_y)[3];
            - x: !lambda return id(nordpool_points_x)[4];
              y: !lambda return id(nordpool_points_y)[4];
            - x: !lambda return id(nordpool_points_x)[5];
              y: !lambda return id(nordpool_points_y)[5];
            - x: !lambda return id(nordpool_points_x)[6];
              y: !lambda return id(nordpool_points_y)[6];
            - x: !lambda return id(nordpool_points_x)[7];
              y: !lambda return id(nordpool_points_y)[7];
            - x: !lambda return id(nordpool_points_x)[8];
              y: !lambda return id(nordpool_points_y)[8];

text_sensor:
  - platform: homeassistant
    id: nordpool_prices_text
    entity_id: ${nordpool_entity}
    attribute: prices
    internal: true
    on_value:
      - lambda: |-
          const char *p = x.c_str();
          int count = 0;
          while (*p && count < 9) {
            while (*p && (*p == ' ' || *p == ',' || *p == '[' || *p == ']')) p++;
            if (!*p) break;
            char *end = nullptr;
            float v = strtof(p, &end);
            if (end == p) { p++; continue; }
            id(nordpool_prices)[count++] = v;
            p = end;
          }
          if (count <= 0) return;
          id(nordpool_price_count) = count;
          char buf[16];
          auto set_price = [&](lv_obj_t *lbl, int idx) {
            if (lbl != nullptr && count > idx) {
              snprintf(buf, sizeof(buf), "%.0f", id(nordpool_prices)[idx]);
              lv_label_set_text(lbl, buf);
            }
          };
          set_price(id(lbl_nordpool_price_0), 0);
          set_price(id(lbl_nordpool_price_2), 2);
          set_price(id(lbl_nordpool_price_4), 4);
          set_price(id(lbl_nordpool_price_6), 6);
          set_price(id(lbl_nordpool_price_8), 8);
      - script.execute:
          id: nordpool_update_chart

  - platform: homeassistant
    id: nordpool_times_text
    entity_id: ${nordpool_entity}
    attribute: times
    internal: true
    on_value:
      - lambda: |-
          if (x.empty() || x == "unavailable" || x == "unknown") return;
          std::vector<std::string> times;
          size_t start = 0;
          while (start < x.size() && times.size() < 9) {
            size_t comma = x.find(',', start);
            std::string tok = (comma == std::string::npos) ? x.substr(start) : x.substr(start, comma - start);
            size_t a = tok.find_first_not_of(" \t\r\n[]'\"");
            size_t b = tok.find_last_not_of(" \t\r\n[]'\"");
            if (a != std::string::npos) times.push_back(tok.substr(a, b - a + 1));
            if (comma == std::string::npos) break;
            start = comma + 1;
          }
          if (times.empty()) return;
          auto set_time = [&](lv_obj_t *lbl, size_t idx) {
            if (lbl != nullptr && times.size() > idx) {
              lv_label_set_text(lbl, times[idx].c_str());
            }
          };
          set_time(id(lbl_nordpool_time_0), 0);
          set_time(id(lbl_nordpool_time_2), 2);
          set_time(id(lbl_nordpool_time_4), 4);
          set_time(id(lbl_nordpool_time_6), 6);
          set_time(id(lbl_nordpool_time_8), 8);
