# LVGL NordPool Electricity price page

# required vars:
# - page_title

# NordPool page
#lvgl:
#  pages:
    id: page_nordpool
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F081F" # finance
      - script.execute:
          id: nordpool_update_chart
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - container:
          styles: container_style
          align: CENTER
          layout:
            type: GRID
            grid_columns: [FR(1)]
            grid_rows: [CONTENT, FR(1), CONTENT]
            pad_row: 0
            pad_column: 0
          widgets:
            # --- TOP ROW: Price Labels ---
            - container:
                grid_cell_column_pos: 0
                grid_cell_row_pos: 0
                grid_cell_x_align: STRETCH
                grid_cell_y_align: START
                height: SIZE_CONTENT
                layout:
                  type: GRID
                  grid_columns: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
                  grid_rows: [ content ]
                widgets:
                  - label:
                      grid_cell_column_pos: 0
                      grid_cell_row_pos: 0
                      grid_cell_x_align: START
                      grid_cell_y_align: CENTER
                      id: lbl_nordpool_price_0
                      text: "???"
                      text_font: font_md
                      text_color: c_text_p
                      text_align: LEFT
                  - label:
                      grid_cell_column_pos: 2
                      grid_cell_row_pos: 0
                      grid_cell_x_align: START
                      grid_cell_y_align: CENTER
                      id: lbl_nordpool_price_2
                      text: "???"
                      hidden: ${"true" if (screen_width | int < 180) else "false"}
                      text_font: font_md
                      text_color: c_text_p
                      text_align: CENTER
                  - label:
                      id: lbl_nordpool_price_4
                      text: "???"
                      grid_cell_column_pos: 4
                      grid_cell_row_pos: 0
                      grid_cell_x_align: CENTER
                      grid_cell_y_align: CENTER
                      text_font: font_md
                      text_color: c_text_p
                      text_align: CENTER
                  - label:
                      id: lbl_nordpool_price_6
                      text: "???"
                      hidden: ${"true" if (screen_width | int < 180) else "false"}
                      grid_cell_column_pos: 6
                      grid_cell_row_pos: 0
                      grid_cell_x_align: CENTER
                      grid_cell_y_align: CENTER
                      text_font: font_md
                      text_color: c_text_p
                      text_align: CENTER
                  - label:
                      id: lbl_nordpool_price_8
                      text: "???"
                      grid_cell_column_pos: 8
                      grid_cell_row_pos: 0
                      grid_cell_x_align: END
                      grid_cell_y_align: CENTER
                      text_font: font_md
                      text_color: c_text_p
                      text_align: RIGHT

            # --- MIDDLE ROW: Price Graph ---
            - container:
                id: nordpool_graph_area
                grid_cell_column_pos: 0
                grid_cell_row_pos: 1
                grid_cell_x_align: STRETCH
                grid_cell_y_align: STRETCH
                widgets:
                  - line:
                      id: lvgl_nordpool_line
                      width: 100%
                      height: 100%
                      align: TOP_LEFT
                      line_width: ${nordpool_line_width}
                      line_color: c_green
                      line_rounded: true
                      pad_all: 0
                      points:
                        # Read initial points from globals
                        - x: !lambda return id(nordpool_points_x)[0];
                          y: !lambda return id(nordpool_points_y)[0];
                        - x: !lambda return id(nordpool_points_x)[1];
                          y: !lambda return id(nordpool_points_y)[1];
                        - x: !lambda return id(nordpool_points_x)[2];
                          y: !lambda return id(nordpool_points_y)[2];
                        - x: !lambda return id(nordpool_points_x)[3];
                          y: !lambda return id(nordpool_points_y)[3];
                        - x: !lambda return id(nordpool_points_x)[4];
                          y: !lambda return id(nordpool_points_y)[4];
                        - x: !lambda return id(nordpool_points_x)[5];
                          y: !lambda return id(nordpool_points_y)[5];
                        - x: !lambda return id(nordpool_points_x)[6];
                          y: !lambda return id(nordpool_points_y)[6];
                        - x: !lambda return id(nordpool_points_x)[7];
                          y: !lambda return id(nordpool_points_y)[7];
                        - x: !lambda return id(nordpool_points_x)[8];
                          y: !lambda return id(nordpool_points_y)[8];

            # --- BOTTOM ROW: Time Labels ---
            - container:
                grid_cell_column_pos: 0
                grid_cell_row_pos: 2
                grid_cell_x_align: STRETCH
                grid_cell_y_align: END
                height: SIZE_CONTENT
                layout:
                  type: GRID
                  grid_columns: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
                  grid_rows: [ content ]
                widgets:
                  - label:
                      grid_cell_column_pos: 0
                      grid_cell_row_pos: 0
                      grid_cell_x_align: START
                      grid_cell_y_align: CENTER
                      id: lbl_nordpool_time_0
                      text: "??:??"
                      text_font: font_sm
                      text_color: c_text_s
                      text_align: LEFT
                  - label:
                      grid_cell_column_pos: 2
                      grid_cell_row_pos: 0
                      grid_cell_x_align: START
                      grid_cell_y_align: CENTER
                      id: lbl_nordpool_time_2
                      text: "??:??"
                      hidden: ${"true" if (screen_width | int < 180) else "false"}
                      text_font: font_sm
                      text_color: c_text_s
                      text_align: CENTER
                  - label:
                      id: lbl_nordpool_time_4
                      text: "??:??"
                      grid_cell_column_pos: 4
                      grid_cell_row_pos: 0
                      grid_cell_x_align: CENTER
                      grid_cell_y_align: CENTER
                      text_font: font_sm
                      text_color: c_text_s
                      text_align: CENTER
                  - label:
                      id: lbl_nordpool_time_6
                      text: "??:??"
                      hidden: ${"true" if (screen_width | int < 180) else "false"}
                      grid_cell_column_pos: 6
                      grid_cell_row_pos: 0
                      grid_cell_x_align: CENTER
                      grid_cell_y_align: CENTER
                      text_font: font_sm
                      text_color: c_text_s
                      text_align: CENTER
                  - label:
                      id: lbl_nordpool_time_8
                      text: "??:??"
                      grid_cell_column_pos: 8
                      grid_cell_row_pos: 0
                      grid_cell_x_align: END
                      grid_cell_y_align: CENTER
                      text_font: font_sm
                      text_color: c_text_s
                      text_align: RIGHT
