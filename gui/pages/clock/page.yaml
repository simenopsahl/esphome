# https://esphome.io/cookbook/lvgl#an-analog-clock
# LVGL analog clock
#
# Optional vars:
# - page_title (e.g. "Klokke")

    id: page_analog_clock
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F0954"
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      # Outer Clock Container
      - obj:
          styles: container_style
          scrollable: false
          align: CENTER
          widgets:
            # clock face
            - meter:
                # Use the passed-in variables for size
                height: ${clock_meter_size}
                width: ${clock_meter_size}
                align: CENTER
                border_width: 0
                bg_opa: TRANSP
                scales:
                  # Minor ticks
                  - range_from: 0
                    range_to: 60
                    angle_range: 360
                    rotation: 270
                    ticks:
                      width: 1
                      count: 61
                      length: 10
                      color: c_bg_s
                    # Minuite hand
                    indicators:
                      - line:
                          id: minute_hand
                          width: 3
                          color: c_text_s
                          length: -4
                          value: 0
                  # Major ticks
                  - range_from: 1
                    range_to: 12
                    angle_range: 330
                    rotation: 300
                    ticks:
                      width: 1
                      count: 12
                      length: 1
                      major:
                        stride: 1
                        width: 4
                        length: 10
                        color: c_dark_gray
                        label_gap: 12
                  # Hour hand
                  - range_from: 0
                    range_to: 720
                    angle_range: 360
                    rotation: 270
#                    ticks:
#                      count: 0
                    indicators:
                      - line:
                          id: hour_hand
                          width: 5
                          color: c_purple
                          length: -30
                          value: 0
            - label:
                id: day_label
                text_font: font_sm
                align: center
                text: "Dag"
                text_color: c_gray
                pad_all: 2
                translate_x: -${clock_translate_x}
                translate_y: -${clock_translate_y}
            - label:
                id: date_label
                text_font: font_sm
                align: center
                text: "Dato"
                text_color: c_gray
                pad_all: 2
                translate_x: ${clock_translate_x}
                translate_y: ${clock_translate_y}
