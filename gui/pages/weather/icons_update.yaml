---
# Weather icons update
# example: !include { file: icons_update.yaml, vars: { suffix: "${suffix}", id: weather_condition_icon, input_id: ha_weather_condition } }
          - if:
              condition:
                lambda: 'return id(${input_id}).state == "clear-night";'
              then:
                lvgl.image.update:
                  id: ${id}
                  src: 'clear_night_${suffix}'

          - if:
              condition:
                lambda: 'return id(${input_id}).state == "cloudy";'
