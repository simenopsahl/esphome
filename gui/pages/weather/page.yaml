# LVGL Weather forecast page
#
# Optional vars:
# - page_title (e.g. "Vær")
#
# Sizes, fonts and the number of visible forecast entries come from the
# substitutions in gui/pages/weather/sensors.yaml.

    id: page_weather
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F0595" # weather-partly-cloudy
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - obj:
          styles: container_style
          scrollable: false
          align: CENTER
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_cross: CENTER
            flex_align_main: SPACE_EVENLY
            flex_align_track: CENTER
            pad_column: 0
            pad_row: 0
          widgets:
            # The first row (today's weather)
            - obj:
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  flex_align_main: SPACE_EVENLY
                  flex_align_track: CENTER
                  pad_column: 0
                  pad_row: 0
                pad_all: 0
                width: 100%
                height: SIZE_CONTENT
                widgets:
                  # Today's weather icon
                  - image:
                      id: weather_condition_icon
                      src: ${initial_today_icon_src}

                  # Today's temperature and condition
                  - obj:
                      pad_all: 0
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_cross: START
                        flex_align_main: SPACE_EVENLY
                        flex_align_track: CENTER
                        pad_row: 0
                        pad_column: 0
                      height: SIZE_CONTENT
                      width: SIZE_CONTENT
                      widgets:
                        - label:
                            id: weather_temperature_today
                            text: "--°C"
                            text_font: ${weather_today_temp_font}
                        - label:
                            id: weather_condition_today
                            text: "Været nå"
                            long_mode: wrap
                            scrollable: true
                            text_font: ${weather_today_condition_font}

            # The second row (forecast section). Entries beyond
            # `weather_forecast_count` (what fits the width) are hidden.
            - obj:
                pad_all: 0
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  flex_align_main: SPACE_AROUND
                  flex_align_track: CENTER
                  pad_column: 0
                  pad_row: 0
                width: 100%
                height: SIZE_CONTENT
                widgets:
                  # Forecast Item 0
                  - obj:
                      hidden: ${ 'true' if 0 >= (weather_forecast_count|int) else 'false' }
                      bg_color: c_black
                      pad_all: 0
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_cross: CENTER
                        pad_row: 0
                        pad_column: 0
                      height: SIZE_CONTENT
                      width: SIZE_CONTENT
                      widgets:
                        - label:
                            id: forecast_timestamp_0
                            text: "??:??"
                            text_font: ${weather_forecast_time_font}
                            text_color: c_text_s
                        - image:
                            id: forecast_condition_icon_0
                            src: ${initial_forecast_icon_src}
                        - label:
                            id: forecast_temperature_0
                            text: "--°C"
                            text_font: ${weather_forecast_temp_font}

                  # Forecast Item 1
                  - obj:
                      hidden: ${ 'true' if 1 >= (weather_forecast_count|int) else 'false' }
                      bg_color: c_black
                      pad_all: 0
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_cross: CENTER
                        pad_row: 0
                        pad_column: 0
                      height: SIZE_CONTENT
                      width: SIZE_CONTENT
                      widgets:
                        - label:
                            id: forecast_timestamp_1
                            text: "??:??"
                            text_font: ${weather_forecast_time_font}
                            text_color: c_text_s
                        - image:
                            id: forecast_condition_icon_1
                            src: ${initial_forecast_icon_src}
                        - label:
                            id: forecast_temperature_1
                            text: "--°C"
                            text_font: ${weather_forecast_temp_font}

                  # Forecast Item 2
                  - obj:
                      hidden: ${ 'true' if 2 >= (weather_forecast_count|int) else 'false' }
                      bg_color: c_black
                      pad_all: 0
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_cross: CENTER
                        pad_row: 0
                        pad_column: 0
                      height: SIZE_CONTENT
                      width: SIZE_CONTENT
                      widgets:
                        - label:
                            id: forecast_timestamp_2
                            text: "??:??"
                            text_font: ${weather_forecast_time_font}
                            text_color: c_text_s
                        - image:
                            id: forecast_condition_icon_2
                            src: ${initial_forecast_icon_src}
                        - label:
                            id: forecast_temperature_2
                            text: "--°C"
                            text_font: ${weather_forecast_temp_font}

                  # Forecast Item 3
                  - obj:
                      hidden: ${ 'true' if 3 >= (weather_forecast_count|int) else 'false' }
                      bg_color: c_black
                      pad_all: 0
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_cross: CENTER
                        pad_row: 0
                        pad_column: 0
                      height: SIZE_CONTENT
                      width: SIZE_CONTENT
                      widgets:
                        - label:
                            id: forecast_timestamp_3
                            text: "??:??"
                            text_font: ${weather_forecast_time_font}
                            text_color: c_text_s
                        - image:
                            id: forecast_condition_icon_3
                            src: ${initial_forecast_icon_src}
                        - label:
                            id: forecast_temperature_3
                            text: "--°C"
                            text_font: ${weather_forecast_temp_font}
