                  # Descriptor Label
                  - label:
                      id: lbl_pm25_l
                      text: "Svevestøv 2.5: "
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_pm25_value
                      text: "?"
                      text_font: font_lg
                      text_color: c_text_p
                  # Unit Label
                  - label:
                      id: lbl_pm25_unit
                      text: "µg/m³"
                      pad_right: ${container_pad_right}
                      text_font: font_md
                      text_color: c_text_s

            # --- Row 5: PM10.0 ---
            - obj:
                width: 100%
                height: SIZE_CONTENT
                pad_all: 0
                pad_left: ${container_pad_left}
                pad_right: ${container_pad_right}
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: SPACE_BETWEEN
                  flex_align_cross: CENTER
                  pad_row: 0
                  pad_column: 0
                widgets:
                  # Descriptor Label
                  - label:
                      id: lbl_pm10_l
                      text: "Svevestøv 10.0: "
                      pad_left: ${container_pad_left}
                      pad_right: ${container_pad_right}
                      text_font: font_sm
                      text_color: c_text_s
                  # Value Label
                  - label:
                      id: lbl_pm10_value
                      text: "?"
                      text_font: font_lg
                      text_color: c_text_p
                  # Unit Label
                  - label:
                      id: lbl_pm10_unit
                      text: "µg/m³"
                      pad_right: ${container_pad_right}
                      text_font: font_md
                      text_color: c_text_s
