# LVGL room temperature page
#
# Optional vars:
# - page_title (e.g. "Temperatur")

    id: page_temperature
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F050F"
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - obj:
          styles: container_style
          scrollable: false
          align: CENTER
          layout:
            type: GRID
            grid_columns: [ FR(1), FR(2), FR(1) ]
            grid_rows: [ FR(1), FR(4) ]
          widgets:
            - obj:
                grid_cell_row_pos: 1
                grid_cell_column_pos: 0
                grid_cell_y_align: STRETCH
                grid_cell_x_align: START
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: START
                widgets:
                  - label: # thermometer icon
                      id: rom_temp_icon_widget_icon
                      text: "\U000F050F"
                      text_font: mdi_lg
                      text_color: c_text_s
                      text_align: LEFT
                  - label: # area
                      id: room_temp_area_widget_text
                      text: ${display.page.temperature.area_label}
                      text_font: font_lg
                      text_color: c_text_s
                      text_align: LEFT
            - label: # temperature value
                id: room_temp_value_widget_text
                text: "?"
                text_font: font_fl
                text_color: c_text_p
                text_align: CENTER
                grid_cell_column_pos: 1
                grid_cell_row_pos: 1
                grid_cell_x_align: CENTER
                grid_cell_y_align: CENTER
            - label: # temperature unit
                id: room_temp_unit_widget_text
                text: "°C"
                text_font: font_xl
                text_color: c_text_s
                text_align: RIGHT
                grid_cell_column_pos: 2
                grid_cell_row_pos: 1
                grid_cell_x_align: END
                grid_cell_y_align: CENTER
