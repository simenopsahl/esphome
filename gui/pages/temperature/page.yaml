# LVGL room temperature page
#
# Optional vars:
# - page_title (e.g. "Temperatur")

    id: page_temperature
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F050F"
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - obj:
          styles: container_style
          align: CENTER
          layout:
            type: GRID
            grid_columns: [ FR(1), FR(2), FR(1) ]
            grid_rows: [ FR(1), FR(4) ]
          widgets:
            - obj:
                grid_cell_row_pos: 1
                grid_cell_column_pos: 0
                grid_cell_y_align: STRETCH
                grid_cell_x_align: START
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: START
                widgets:
                  - label: # thermometer icon
                      <<: !include
                        file: ../../widgets/labels/icon.yaml
                        vars:
                          uid: rom_temp_icon
                          icon: "\U000F050F"
                          icon_size: mdi_lg
                          color: c_text_s
                          align: left
                  - label: # area
                      <<: !include
                        file: ../../widgets/labels/text.yaml
                        vars:
                          uid: room_temp_area
                          text: ${display.page.temperature.area_label}
                          text_font: font_lg
                          color: c_text_s
                          align: left
            - label: # temperature value
                <<: !include
                  file: ../../widgets/labels/grid_text.yaml
                  vars:
                    uid: room_temp_value
                    text: "?"
                    text_font: font_fl
                    color: c_text_p
                    align: center
                    cell_column_pos: 1
                    cell_row_pos: 1
                    cell_x_align: center
                    cell_y_align: center
            - label: # temperature unit
                <<: !include
                  file: ../../widgets/labels/grid_text.yaml
                  vars:
                    uid: room_temp_unit
                    text: "°C"
                    text_font: font_xl
                    color: c_text_s
                    align: right
                    cell_column_pos: 2
                    cell_row_pos: 1
                    cell_x_align: end
                    cell_y_align: center