# LVGL room temperature page (narrow layout)
#
# Optional vars:
# - page_title (e.g. "Temperatur")

    id: page_temperature
    styles: page_style
    on_load:
      - script.execute:
          id: set_page_title
          title: ${page_title}
          icon: "\U000F050F"
    <<: !include
      file: ../../functions/swipe_navigation.yaml
    widgets:
      - obj:
          styles: container_style
          align: CENTER
          layout:
            type: FLEX
            flex_flow: COLUMN
            flex_align_cross: CENTER
            flex_align_main: SPACE_EVENLY
            flex_align_track: CENTER
            pad_column: 0
            pad_row: 0
          widgets:
            - label: # temperature value
                id: room_temp_value_widget_text
                text: "--°C"
                pad_all: 0
                text_font: font_fl
                text_color: c_text_p
                text_align: CENTER
                align: CENTER
            - obj:
                pad_all: 0
                width: 100%
                height: SIZE_CONTENT
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  flex_align_main: SPACE_AROUND
                  pad_column: 0
                  pad_row: 0
                widgets:
                  - label: # thermometer icon
                      id: room_temp_icon
                      text: "\U000F050F"
                      text_font: mdi_lg
                      text_color: c_text_s
                  - label: # area
                      id: room_temp_area
                      text: ${display.page.temperature.area_label}
                      text_font: font_lg
                      text_color: c_text_s
                  - label: # temperature unit
                      id: room_temp_unit
                      text: "°C"
                      text_font: font_lg
                      text_color: c_text_s