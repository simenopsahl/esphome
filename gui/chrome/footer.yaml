# Bottom navigation bar overlay package (`navbar` on `lvgl: top_layer`).
#
# Requires `gui/chrome/base.yaml` to be included.
# Can be omitted on tiny/round displays (where `chrome_footer: "false"` sets
# `page_pad_bottom: 0`), or included unconditionally when `navbar` is hidden
# at runtime if `chrome_footer == "false"`.

lvgl:
  top_layer:
    widgets:
      - <<: !include
          file: ../widgets/footer/widget.yaml
          vars:
            height: ${chrome_h}
            padding: ${chrome_pad}
            page_title_font: ${chrome_title_font}

esphome:
  on_boot:
    - priority: -150
      then:
        - if:
            condition:
              lambda: 'return std::string("${chrome_footer}") == "false";'
            then:
              - lvgl.widget.hide: navbar

