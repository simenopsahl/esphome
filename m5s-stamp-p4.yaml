# Board: Generic ESP32-P4 Board (pre-rev3) (Generic)
# Definition: definitions/boards/generic-esp32p4/manifest.yaml

esphome:
  name: m5s-stamp-p4
  friendly_name: m5s-stamp-p4

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

# This board has no native Wi-Fi. ESPHome's ``api:`` and
# ``ota:`` components both require a ``network``
# component — configure ``openthread:`` / ``ethernet:`` /
# ``esp32_hosted:`` to suit your setup, then add ``api:``
# and ``ota:`` blocks once the network is ready.
