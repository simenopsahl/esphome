packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common

  # --- BOARD AND MODULES ---
  board: !include board/jc4880p443ciwy.yaml

  # --- GUI PACKAGES ---
  colors: !include gui/themes/colors_night_owl.yaml
  lvgl: !include gui/800x480.yaml
  
  # --- LVGL PAGE & WIDGET PACKAGES ---
  tile_climate: !include
    file: gui/widgets/tiles/climate/remote.yaml
    vars:
      uid: heatpump
      row: 0
      col: 0
      row_span: 1
      col_span: 2          # e.g. span across both columns in row 0, or 1 for a single cell
      entity_id: climate.faircon_norgespumpa12_proxy
      title: "Varmepumpe"
      icon: "\U000F1A43"
  tile_outdoor_temp_sensor: !include
    file: gui/widgets/tiles/sensor/remote.yaml
    vars:
      page_id: page_dashboard
      uid: tile_outdoor_temp
      row: 1
      col: 0
      icon: "\U000F0595"
      title: "Ute"
      entity_id: sensor.ute_temperature
      unit: "°C" # Note: escape literal '%' as '%%' (e.g. unit: "%%")
      format: "%.1f"
  tile_t22_temp_sensor: !include
    file: gui/widgets/tiles/sensor/remote.yaml
    vars:
      page_id: page_dashboard
      uid: tile_t22_temp
      row: 1
      col: 1
      icon: "\U000F050F"
      title: "T22"
      entity_id: sensor.t22_temperature
      unit: "°C" # Note: escape literal '%' as '%%' (e.g. unit: "%%")
      format: "%.1f"
      
  room_temp_widget_sensors: !include { file: gui/widgets/labels/number_sensor.yaml, vars: {
    uid: room_temp_value,
    entity_id: sensor.t22_temperature
  }}


substitutions:
  common:
#    log_level: DEBUG
#    log_baud_rate: "115200"
  device:
    name: jc4880p443
    location: "Storage"
    framework:
      type: esp-idf
  display:
    home_page: page_analog_clock
    page:
      temperature:
        area_label: T22

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.36

# --- LVGL CLOCKS ---
time:
  - id: !extend time_homeassistant
    on_time_sync:
      - script.execute: lvgl_time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: lvgl_time_update

lvgl:
  pages:
    - <<: !include
        file: gui/pages/grid_dashboard/page.yaml
        vars:
          page_title: "Kontrollpanel"
          layout: 4x2
    - <<: !include
        file: gui/pages/climate/page.yaml
        vars:
          page_title: "Varmepumpe"

binary_sensor:
  # Call sensors from HA.
  - platform: homeassistant
    entity_id: binary_sensor.etg2_simen_occupancy
    id: presence1
  - platform: homeassistant
    entity_id: binary_sensor.etg2_gang_occupancy
    id: presence2
  # Turn on display while room is occupied
  - id: !extend presence_detected
    lambda: !lambda |-
      if ( (id(presence1).state) or (id(presence2).state) ) {
        return true;
      } else {
        return false;
      }
