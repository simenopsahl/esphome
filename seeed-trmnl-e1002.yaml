packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common

  # --- BOARD AND MODULES ---
  board: !include board/seeed_xiao_esp32s3_plus.yaml
  e1002: !include board/module/display_reterminal_e1002.yaml

substitutions:
  common:
    log_level: DEBUG
#    log_baud_rate: "115200"
  device:
    name: seeed-trmnl-e1002-ec2478
    location: "Storage"
    framework:
      type: esp-idf
  display:
    home_page: page_info
    font:
      text_sm: 18
      text_md: 22
      text_lg: 26
      text_xl: 30
      text_xxl: 36
      text_hg: 44
      text_fl: 54
      icons_sm: 30
      icons_md: 38
      icons_lg: 46
      icons_xl: 56
      icons_xxl: 66

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}
  area: ${device.location}

wifi:
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.71.37

display:
  - id: !extend display_eink
    pages:
      - id: page_image
        lambda: |-
          ESP_LOGI("display", "Page: Image");
          it.image(0, 0, id(i_selma));
      - id: page_info
        lambda: |-
          ESP_LOGI("display", "Page: Info");
          // Fill background.
          it.fill( id(epaper_bg_color) );

          // NAV
            // Home
          it.print( (it.get_width()/40)*27 , 0, id(mdi_sm), id(color_green), TextAlign::TOP_LEFT, "\U000F02DC");
            // Next
          it.print( (it.get_width()/40)*25 , 0, id(mdi_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "\U000F0142");
            // Back
          it.print( (it.get_width()/40)*23 , 0, id(mdi_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "\U000F0141");
          
          // Show wifi icon.
          if ( id(component_wifi).is_connected() ) {
            it.print( 0 , 0, id(mdi_md), id(color_green), TextAlign::TOP_LEFT, "\U000F05A9");
          }
          // Show HA icon.
          if ( id(component_api).is_connected() ) {
            it.print( it.get_width() , 0, id(mdi_md), id(color_blue), TextAlign::TOP_RIGHT, "\U000F07D0");
          }
          // PAGE
          it.print( (it.get_width()/40)*5 , 0, id(mdi_md), id(epaper_text_color), "\U000F02FC");
          it.print( (it.get_width()/40)*8, 4, id(font_md), id(epaper_text_color), "Enhet");
          it.line(10, 45, 790, 45, id(epaper_text_color));

          
          // DEVICE
          it.filled_rectangle(20, 65, 15, 180, id(epaper_accent1_color));
          it.line(20, 245, 370, 245, id(epaper_accent1_color));
          // NAME
          it.printf( 40, 80, id(font_md), id(epaper_text_color), "%s", App.get_name().c_str() );
          it.printf(40, 135, id(font_sm), id(epaper_text_color), "KEY0 GPIO3: Grønn");
          it.printf(40, 170, id(font_sm), id(epaper_text_color), "KEY1 GPIO4: Høyre");
          it.printf(40, 205, id(font_sm), id(epaper_text_color), "KEY2 GPIO5: Venstre");
          
          // NETWORK
          it.filled_rectangle(20, 265, 15, 180, id(epaper_accent2_color));
          it.line(20, 445, 370, 445, id(epaper_accent2_color));
          // SSID
          it.printf( 40, 280, id(font_md), id(epaper_text_color), "%s", id(sensor_ssid).state.c_str() );
          // IP
          it.printf( 40, 340, id(font_md), id(epaper_text_color), "%s", id(sensor_ip_address).state.c_str() );
          // MAC
          it.printf( 40, 395, id(font_md), id(epaper_text_color), "%s", id(sensor_mac_address).state.c_str() );

          // SENSORS
          it.filled_rectangle(410, 65, 15, 380, id(epaper_accent3_color));
          it.line(410, 445, 760, 445, id(epaper_accent3_color));
          // PERCENT
          it.print( 430, 80, id(font_md), id(epaper_text_color), "Batteriprosent: " );
          if (id(battery_level).has_state()) {
            it.printf(640, 80, id(font_md), id(epaper_text_color), "%.0f%%", id(battery_level).state);
          } else {
            it.print(640, 80, id(font_md), id(epaper_text_color), "--%");
          }
          // VOLTAGE
          it.print( 430, 150, id(font_md), id(epaper_text_color), "Batterispenning: " );
          if (id(battery_voltage).has_state()) {
            it.printf(640, 150, id(font_md), id(epaper_text_color), "%.2fV", id(battery_voltage).state);
          } else {
            it.print(640, 150, id(font_md), id(epaper_text_color), "--V");
          }
          // TEMPERATURE
          it.print( 430, 235, id(font_md), id(epaper_text_color), "Temperatur: " );
          if (id(temperature_sht40).has_state()) {
            it.printf(640, 235, id(font_md), id(epaper_text_color), "%.1f C", id(temperature_sht40).state);
          } else {
            it.print(640, 235, id(font_md), id(epaper_text_color), "-- C");
          }
          // HUMIDITY
          it.print( 430, 300, id(font_md), id(epaper_text_color), "Luftfuktighet: " );
          if (id(humidity_sht40).has_state()) {
            it.printf(640, 300, id(font_md), id(epaper_text_color), "%.1f %%", id(humidity_sht40).state);
          } else {
            it.print(640, 300, id(font_md), id(epaper_text_color), "-- %");
          }
          // SD card
          if (id(sd_card_detect).state) {
            it.printf(430, 385, id(font_sm), id(epaper_text_color), "SD Kort: oppdaget");
          } else {
            it.printf(430, 385, id(font_sm), id(epaper_text_color), "SD Kort: ikke oppdaget");
          }
          
          // Refresh Timestamp
          // Code by EnsconcE from https://community.home-assistant.io/t/esphome-show-time/348903
          char str[17];
          time_t currTime = id(time_rtc).now().timestamp;
          strftime( str, sizeof(str), "%H:%M", localtime(&currTime) );
          it.printf( 0, it.get_height(), id(font_sm), id(epaper_text_color), TextAlign::BOTTOM_LEFT, "@ %s", str );
      - id: page_content
        lambda: |-
          ESP_LOGI("display", "Page: Content");
          // Map weather states to MDI characters.
          std::map<std::string, std::string> weather_icon_map
            {
              {"clear-night", "\U000F0594"},
              {"cloudy", "\U000F0590"},
              {"cloudy-alert", "\U000F0F2F"},
              {"cloudy-arrow-right", "\U000F0E6E"},
              {"fog", "\U000F0591"},
              {"hail", "\U000F0592"},
              {"hazy", "\U000F0F30"},
              {"hurricane", "\U000F0898"},
              {"lightning", "\U000F0593"},
              {"lightning-rainy", "\U000F067E"},
              {"night", "\U000F0594"},
              {"night-partly-cloudy", "\U000F0F31"},
              {"partlycloudy", "\U000F0595"},
              {"partly-lightning", "\U000F0F32"},
              {"partly-rainy", "\U000F0F33"},
              {"partly-snowy", "\U000F0F34"},
              {"partly-snowy-rainy", "\U000F0F35"},
              {"pouring", "\U000F0596"},
              {"rainy", "\U000F0597"},
              {"snowy", "\U000F0598"},
              {"snowy-heavy", "\U000F0F36"},
              {"snowy-rainy", "\U000F067F"},
              {"sunny", "\U000F0599"},
              {"sunny-alert", "\U000F0F37"},
              {"sunny-off", "\U000F14E4"},
              {"sunset", "\U000F059A"},
              {"sunset-down", "\U000F059B"},
              {"sunset-up", "\U000F059C"},
              {"tornado", "\U000F0F38"},
              {"windy", "\U000F059D"},
              {"windy-variant", "\U000F059E"},
            };
          // Set graph color
          id(trace_nordpool)->set_line_color( id(epaper_accent2_color) );

          // Fill background.
          it.fill( id(epaper_bg_color) );

          // NAV
            // Home
          it.print( (it.get_width()/40)*27 , 0, id(mdi_sm), id(color_green), TextAlign::TOP_LEFT, "\U000F02DC");
            // Next
          it.print( (it.get_width()/40)*25 , 0, id(mdi_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "\U000F0142");
            // Back
          it.print( (it.get_width()/40)*23 , 0, id(mdi_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "\U000F0141");
          
          // Show wifi icon.
          if ( id(component_wifi).is_connected() ) {
            it.print( 0 , 0, id(mdi_md), id(color_green), TextAlign::TOP_LEFT, "\U000F05A9");
          }
          // Show HA icon.
          if ( id(component_api).is_connected() ) {
            it.print( it.get_width() , 0, id(mdi_md), id(color_blue), TextAlign::TOP_RIGHT, "\U000F07D0");
          }
          // PAGE
          it.print( (it.get_width()/40)*5 , 0, id(mdi_md), id(epaper_text_color), "\U000F02DC");
          it.print( (it.get_width()/40)*8, 4, id(font_md), id(epaper_text_color), "Info");
          it.line(10, 45, 790, 45, id(epaper_text_color));

          // Show loading screen before data is received.
          if (id(initial_data_received) == false) {
            it.print(it.get_width()/2, it.get_height()/2, id(font_xxl), id(epaper_text_color), TextAlign::TOP_CENTER, "Venter på data...");
          } else {

            // Weather Section
            // Now mid
            //it.printf(124, 0, id(mdi_xxl), TextAlign::TOP_LEFT, "%s", weather_icon_map[id(weather_condition_now).state.c_str()].c_str());
            //it.printf(224, 31, id(font_xl), TextAlign::TOP_LEFT, "%2.0f°C", id(weather_temperature).state);
            // Now Measured and forecasted
            it.printf(10, 60, id(mdi_xxl), id(epaper_text_color), TextAlign::TOP_LEFT, "%s", weather_icon_map[id(weather_condition_now).state.c_str()].c_str());
            it.print(100, 65, id(font_md), id(epaper_text_color), TextAlign::TOP_LEFT, "Målt:");
            it.printf(100, 90, id(font_hg), id(epaper_text_color), TextAlign::TOP_LEFT, "%2.0f°C", id(weather_temperature_actual).state);
            it.print(200, 65, id(font_md), id(epaper_text_color), TextAlign::TOP_LEFT, "Meldt:");
            it.printf(200, 90, id(font_xxl), id(epaper_text_color), TextAlign::TOP_LEFT, "%2.0f°C", id(weather_temperature_forecast).state);
            
            it.printf(55, 130, id(font_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_1).state.c_str());
            it.printf(55, 150, id(mdi_xl), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_1).state.c_str()].c_str());
            it.printf(55, 210, id(font_md), id(epaper_text_color), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_1).state);
            
            it.printf(147, 130, id(font_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_2).state.c_str());
            it.printf(147, 150, id(mdi_xl), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_2).state.c_str()].c_str());
            it.printf(147, 210, id(font_md), id(epaper_text_color), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_2).state);
            
            it.printf(236, 130, id(font_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_3).state.c_str());
            it.printf(236, 150, id(mdi_xl), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_3).state.c_str()].c_str());
            it.printf(236, 210, id(font_md), id(epaper_text_color), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_3).state);
            
            it.printf(330, 130, id(font_sm), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", id(weather_timestamp_4).state.c_str());
            it.printf(330, 150, id(mdi_xl), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", weather_icon_map[id(weather_condition_4).state.c_str()].c_str());
            it.printf(330, 210, id(font_md), id(epaper_text_color), TextAlign::TOP_CENTER, "%2.0f°C", id(weather_temperature_4).state);


            // FolloRen Section
            it.print(5, 250, id(mdi_lg), id(color_green), TextAlign::TOP_LEFT, "\U000F044C");
            it.print(55, 247, id(font_lg), id(epaper_text_color), TextAlign::TOP_LEFT, "FolloRen");
            it.printf(55, 269, id(font_xl), id(epaper_text_color), TextAlign::TOP_LEFT, "%s", id(folloren_next).state.c_str());
            
            it.print(350, 240, id(mdi_lg), id(epaper_accent2_color), TextAlign::TOP_CENTER, "\U000F0A79");
            it.printf(350, 285, id(font_md), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", id(folloren_restavfall).state.c_str());

            it.print(435, 240, id(mdi_lg), id(epaper_accent2_color), TextAlign::TOP_CENTER, "\U000F0395");
            it.printf(435, 285, id(font_md), id(epaper_text_color), TextAlign::TOP_CENTER, "%s", id(folloren_papir).state.c_str());


            // NordPool Section
            it.graph(405, 70, id(graph_nordpool), id(epaper_accent3_color));
            it.printf(410, 70, id(font_sm), id(epaper_text_color), TextAlign::BOTTOM_LEFT, "%s", id(nordpool_time_0).state.c_str());
            it.printf(410, 238, id(font_xxl), id(epaper_text_color), TextAlign::TOP_LEFT, "%2.0f Øre", id(nordpool_price_0).state);
            it.printf(600, 70, id(font_sm), id(epaper_text_color), TextAlign::BOTTOM_CENTER, "%s", id(nordpool_time_4).state.c_str());
            it.printf(600, 238, id(font_xxl), id(epaper_text_color), TextAlign::TOP_CENTER, "%2.0f Øre", id(nordpool_price_4).state);
            it.printf(790, 70, id(font_sm), id(epaper_text_color), TextAlign::BOTTOM_RIGHT, "%s", id(nordpool_time_8).state.c_str());
            it.printf(790, 238, id(font_xxl), id(epaper_text_color), TextAlign::TOP_RIGHT, "%2.0f Øre", id(nordpool_price_8).state);


            // Bus Section
            it.print(320, 580, id(font_lg), id(epaper_text_color), TextAlign::TOP_CENTER, "Bregnefaret");
            it.print(330, 607, id(font_md), id(epaper_text_color), TextAlign::TOP_LEFT, "510 Drøbak");
            it.printf(330, 626, id(font_lg), id(epaper_text_color), TextAlign::TOP_LEFT, "%s", id(bus_bregnefaret_line_0).state.c_str());
            it.printf(310, 614, id(font_xxl), id(epaper_text_color), TextAlign::TOP_RIGHT, "%s", id(bus_bregnefaret_due_at_0).state.c_str());

            it.print(330, 656, id(font_md), id(epaper_text_color), TextAlign::TOP_LEFT, "510 Drøbak");
            it.printf(330, 675, id(font_lg), id(epaper_text_color), TextAlign::TOP_LEFT, "%s", id(bus_bregnefaret_line_1).state.c_str());
            it.printf(310, 663, id(font_xxl), id(epaper_text_color), TextAlign::TOP_RIGHT, "%s", id(bus_bregnefaret_due_at_1).state.c_str());

            it.print(330, 705, id(font_md), id(epaper_text_color), TextAlign::TOP_LEFT, "510 Drøbak");
            it.printf(330, 724, id(font_lg), id(epaper_text_color), TextAlign::TOP_LEFT, "%s", id(bus_bregnefaret_line_2).state.c_str());
            it.printf(310, 712, id(font_xxl), id(epaper_text_color), TextAlign::TOP_RIGHT, "%s", id(bus_bregnefaret_due_at_2).state.c_str());


            // Car Section
            it.print(15, 615, id(mdi_lg), id(epaper_accent1_color), TextAlign::TOP_LEFT, "\U000F010B");
            it.printf(17, 658, id(font_xxl), id(epaper_text_color), TextAlign::TOP_LEFT, "%2.0f km", id(car_battery_range).state);
            it.printf(17, 685, id(font_hg), id(epaper_text_color), TextAlign::TOP_LEFT, "%2.0f%%", id(car_battery_percent).state);

          }
          // Refresh Timestamp
          // Code by EnsconcE from https://community.home-assistant.io/t/esphome-show-time/348903
          char str[17];
          time_t currTime = id(time_rtc).now().timestamp;
          strftime( str, sizeof(str), "%H:%M", localtime(&currTime) );
          it.printf( 0, it.get_height(), id(font_sm), id(epaper_text_color), TextAlign::BOTTOM_LEFT, "@ %s", str );
    
# Check if person is home
binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.etg2_occupancy
    id: presence_detected

  # Home
  - id: !extend button_green
    on_press:
      - display.page.show: ${display.home_page}
      - script.execute: update_screen
  # Stick Press
  - id: !extend button_left
    on_press:
      - display.page.show_previous: display_eink
      - script.execute: update_screen
  # Stick Down
  - id: !extend button_right
    on_press:
      - display.page.show_next: display_eink
      - script.execute: update_screen

image:
  - platform: file
    id: i_selma
    file: gui/img/spectra_selma_480x800.png
    type: RGB

sensor:
  # Call sensors from HA.
  - platform: homeassistant
    entity_id: sensor.waveshare_display_data
