packages:
  # --- COMMON PACKAGES ---
  <<: !include_dir_named common
  <<: !include_dir_named bluetooth

  # --- BOARD AND MODULES ---
  board: !include board/m5stack_core_s3se.yaml
  mbus_uart: !include board/extension/mbus_uart.yaml
  module_air_quality: !include board/module/module_air_quality.yaml
  base_btc: !include board/module/base_btc.yaml
  grove_i2c: !include board/extension/grove_i2c.yaml
  env_pro: !include board/module/unit_env_pro.yaml
  unit_co2: !include board/module/unit_co2.yaml

  # --- FEATURE PACKAGES ---
  combined_env_sensors: !include features/combined_env_sensors.yaml
  media_player: !include features/media_player.yaml

  # --- GUI PACKAGES ---
  colors: !include gui/themes/colors_night_owl.yaml
  lvgl: !include gui/main.yaml

  # --- LVGL WIDGET PACKAGES ---
  tile_flip_clock: !include
    file: gui/tiles/clock/flip_clock.yaml
    vars:
      uid: flip_clock
      row: 0
      col: 0
      row_span: 1
      col_span: 2
      show_date: true
  tile_climate: !include
    file: gui/tiles/climate/remote.yaml
    vars:
      uid: heatpump
      row: 1
      col: 0
      row_span: 1
      col_span: 1          # e.g. span across both columns in row 0, or 1 for a single cell
      entity_id: climate.etg1_stue_panelovn_bt
      title: "Panelovn"
      icon: "\U000F1A43"
  tile_t22_temp_sensor: !include
    file: gui/tiles/sensor/remote.yaml
    vars:
      page_id: page_dashboard
      uid: tile_t22_temp
      row: 1
      col: 1
      icon: "\U000F050F"
      title: "Rom"
      entity_id: sensor.etg1_stue_temperature
      unit: "°C"
      format: "%.1f"
      click_page: page_temperature

  room_temperature_widget_sensors: !include { file: gui/functions/number_sensor.yaml, vars: {
    uid: room_temp_value,
    entity_id: sensor.etg1_stue_tc_heatindex
  }}

substitutions:
  common:
#    log_level: DEBUG
#    log_baud_rate: "115200"
  device:
    name: m5s-c3se-4d0a70
    location: "TV Stue"
    framework:
      type: esp-idf
  module:
    internal:
      i2c_bus: i2c_mbus
  display:
    home_page: page_dashboard

esphome:
  comment: ${device.model} @ ${device.location}
  name: ${device.name}
  friendly_name: ${device.name}

wifi:
  use_address: ${device.name}.local
  manual_ip: 
    gateway: 192.168.68.1
    subnet: 255.255.252.0
    static_ip: 192.168.70.78

lvgl:
  buffer_size: 40%
  pages:
    - <<: !include
        file: gui/pages/grid_dashboard/page.yaml
        vars:
          page_title: "Kontrollpanel"
          layout: 2x2
    - <<: !include
        file: gui/pages/climate/page.yaml
        vars:
          page_title: "Panelovn"

binary_sensor:
  # Call sensors from HA.
  - platform: homeassistant
    entity_id: binary_sensor.etg1_stue_occupancy
    id: presence1
  - platform: homeassistant
    entity_id: binary_sensor.etg1_kjokken_occupancy
    id: presence2
  # Turn on display while room is occupied
  - id: !extend presence_detected
    lambda: !lambda |-
      if ( (id(presence1).state) or (id(presence2).state) ) {
        return true;
      } else {
        return false;
      }

sensor:
  # Combine sensors
  - id: !extend temperature_local
    sources:
      # Base BTC
      - source: temperature_sht30_base_btc
      # HAT ENV III
#      - source: temperature_sht30_hat_env
#      - source: temperature_qmp6988_hat_env
      # Unit ENV III
#      - source: temperature_sht30_unit_env
#      - source: temperature_qmp6988_unit_env
      # Unit ENV IV
#      - source: temperature_bmp280_unit_env
#      - source: temperature_sht40_unit_env
      # Unit ENV Pro
      - source: temperature_bme688
      # Unit CO2
      - source: temperature_scd40_unit_co2
    on_value: 
      then:
        - lvgl.label.update:
            id: lbl_temp_local_value
            text:
              format: "%.1f"
              args: [ 'x' ]

  - id: !extend humidity_local
    sources:
      # Base BTC
      - source: humidity_sht30_base_btc
      # HAT ENV III
#      - source: humidity_sht30_hat_env
      # Unit ENV III
#      - source: humidity_sht30_unit_env
      # Unit ENV IV
#      - source: humidity_sht40_unit_env
      # Unit ENV Pro
      - source: humidity_bme688
      # Unit CO2
      - source: humidity_scd40_unit_co2

  - id: !extend pressure_local
    sources:
      # HAT ENV III
#      - source: pressure_qmp6988_hat_env
      # Unit ENV III
#      - source: pressure_qmp6988_unit_env
      # Unit ENV IV
#      - source: pressure_bmp280_unit_env
      # Unit ENV Pro
      - source: pressure_bme688

  # extend sensors to update lvgl
  - id: !extend unit_co2_scd40_sensor
    co2:
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_co2_value
              text:
                format: "%.0f"
                args: [ 'x' ]
